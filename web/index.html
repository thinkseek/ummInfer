<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ummInfer</title>
<style>
  /* Design tokens mirror clients/ummmlx/Sources/ummmlx/Theme.swift. */
  :root {
    --bg: #FFFFFF; --surface: #F7F7F7; --hover: #F2F2F2; --line: #EBEBEB;
    --text: #111111; --secondary: #6E6E6E; --tertiary: #A3A3A3;
    --ink: #111111; --on-ink: #FFFFFF;
    --accent: #0D9384; --danger: #EB5230;
    --r-control: 8px; --r-card: 12px;
    --f-title: 20px; --f-section: 15px; --f-body: 13px; --f-caption: 12px;
  }
  :root.dark {
    --bg: #151515; --surface: #1C1C1C; --hover: #232323; --line: #2B2B2B;
    --text: #F2F2F2; --secondary: #A3A3A3; --tertiary: #6B6B6B;
    --ink: #F2F2F2; --on-ink: #151515;
    --accent: #2BB3A3; --danger: #FF6B47;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; background: var(--bg);
    color: var(--text); font: var(--f-body)/1.5 -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px;
    background: var(--surface);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tertiary); transition: background .2s; }
  .dot.busy { background: var(--accent); }
  #status { font-size: var(--f-caption); color: var(--secondary); }
  .chip {
    font: var(--f-caption)/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--secondary); background: var(--hover);
    padding: 4px 7px; border-radius: 6px;
  }
  .spacer { flex: 1; }

  /* Global streaming voice bar */
  #voiceBar {
    display: flex; align-items: center; gap: 8px; padding: 4px 8px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--bg);
  }
  #voiceToggle, #realtimeToggle {
    border: none; background: transparent; padding: 3px 9px; border-radius: 999px;
    font-size: var(--f-caption); color: var(--secondary);
  }
  #voiceToggle.on, #realtimeToggle.on { background: var(--accent); color: #fff; }
  #voiceStatus, #realtimeStatus { font-size: var(--f-caption); color: var(--secondary); min-width: 68px; }
  #voiceMute, #voiceStop { padding: 3px 9px; font-size: var(--f-caption); }
  .realtime-echo-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: var(--f-caption); color: var(--secondary);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  .realtime-strip {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 6px 16px; background: var(--surface);
    border-top: 1px solid var(--line); font-size: var(--f-caption);
    color: var(--secondary);
  }
  .realtime-pill {
    display: inline-flex; align-items: center;
    font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--secondary); background: var(--bg);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 8px;
  }
  .realtime-pill.echo-on {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    font-weight: 600;
  }
  .realtime-pill.echo-off {
    color: var(--danger);
    border-color: color-mix(in srgb, var(--danger) 45%, var(--line));
    background: color-mix(in srgb, var(--danger) 10%, transparent);
    font-weight: 600;
  }
  .realtime-mic-meter {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 8px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--line);
    font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--secondary);
  }
  .realtime-mic-track {
    position: relative; width: 64px; height: 6px;
    border-radius: 999px; overflow: hidden;
    background: var(--hover); border: 1px solid var(--line);
  }
  .realtime-mic-fill {
    display: block; height: 100%; width: 0%;
    border-radius: 999px; background: var(--accent);
  }

  #settings {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
    padding: 12px 16px; background: var(--surface);
  }
  #settings label { display: flex; flex-direction: column; gap: 4px; font-size: var(--f-caption); color: var(--secondary); }
  #settings label.check { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 6px; }
  #settings label.dimmed { opacity: .48; }
  #settings input:disabled, #settings select:disabled { opacity: .5; cursor: default; }
  #settings label.grow { flex: 1 1 260px; }
  input[type=text], input:not([type]), select, textarea {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--r-control);
    padding: 7px 9px; outline: none; transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  #settings input { width: 100%; }
  #settings label.grow input, #settings label:first-child input { width: 100%; }
  #settings label:first-child { flex: 1 1 300px; }
  #settings label:nth-child(2) { flex: 0 1 220px; }
  #settings label:nth-child(5) { flex: 0 1 130px; }
  input[type=checkbox] { accent-color: var(--accent); }

  button {
    font: inherit; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); border-radius: var(--r-control); padding: 7px 14px;
    cursor: pointer; transition: background .15s, border-color .15s, transform .08s;
  }
  button:hover { background: var(--hover); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  button.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  button.primary:hover { opacity: .88; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }

  #transcript { flex: 1; overflow-y: auto; padding: 20px; }
  .empty-state {
    max-width: 860px; margin: 10vh auto 0; padding: 0 4px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    text-align: center;
  }
  .empty-state h2 {
    margin: 0; font-size: var(--f-section); font-weight: 600; color: var(--text);
  }
  .empty-state .empty-sub {
    margin: -8px 0 0; font-size: var(--f-caption); color: var(--secondary);
  }
  .preset-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px; width: 100%;
  }
  .preset-card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    text-align: left; padding: 13px 14px;
    border: 1px solid var(--line); border-radius: var(--r-card);
    background: var(--surface); color: var(--text);
    transition: border-color .15s, background .15s, transform .08s;
  }
  .preset-card:hover {
    background: var(--hover);
    border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
  }
  .preset-title {
    font-size: var(--f-body); font-weight: 600; color: var(--text);
  }
  .preset-subtitle {
    font-size: var(--f-caption); color: var(--secondary); line-height: 1.4;
  }
  .preset-tags {
    display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px;
  }
  .preset-tag {
    font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 2px 6px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--line); color: var(--secondary);
  }
  .telemetry-strip {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    margin-top: 2px;
  }
  .telemetry-pill {
    display: inline-flex; align-items: center;
    font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--secondary); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 8px;
  }
  .telemetry-pill.accent {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    font-weight: 600;
  }
  .turn { display: flex; flex-direction: column; gap: 6px; max-width: 720px; margin: 0 0 18px; }
  .turn.user { margin-left: auto; align-items: flex-end; }
  .turn .meta {
    display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px;
    font-size: var(--f-caption); font-weight: 500; color: var(--secondary);
  }
  .turn-interrupted-badge {
    display: inline-flex; align-items: center;
    font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 500; color: var(--danger);
    background: color-mix(in srgb, var(--danger) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--line));
    border-radius: 999px; padding: 1px 7px;
  }
  .turn .body { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .flow { display: flex; flex-direction: column; gap: 10px; }
  .block.text {
    white-space: pre-wrap; word-break: break-word; padding: 11px 14px;
    border-radius: var(--r-card); background: var(--surface);
    line-height: 1.62; animation: rise .18s ease-out;
  }
  .turn.user .block.text { background: var(--ink); color: var(--on-ink); }
  .block.text.md { white-space: normal; }
  .block.text:empty:not(.caret) { display: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  /* Balanced, compact Markdown typography (never oversized headings) */
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p { margin: 0 0 8px; line-height: 1.62; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    margin: 12px 0 6px; font-weight: 600; line-height: 1.4; color: var(--text);
  }
  .md h1 { font-size: 15.5px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .md h2 { font-size: 14.5px; }
  .md h3 { font-size: 13.5px; }
  .md h4 { font-size: var(--f-body); }
  .md h5, .md h6 { font-size: var(--f-body); font-weight: 500; color: var(--secondary); }
  .md ul, .md ol { margin: 4px 0 8px; padding-left: 1.35em; }
  .md li { margin: 3px 0; line-height: 1.6; }
  .md li > p { margin: 0; }
  .md blockquote {
    margin: 6px 0 8px; padding: 2px 0 2px 11px;
    border-left: 2.5px solid color-mix(in srgb, var(--accent) 65%, transparent);
    color: var(--secondary);
  }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .md a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .md strong { font-weight: 600; }
  .md code {
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--hover); padding: 1px 5px; border-radius: 4px;
    border: 1px solid var(--line);
  }
  .md .md-code {
    margin: 8px 0; border: 1px solid var(--line); border-radius: var(--r-control);
    background: var(--bg); overflow: hidden;
  }
  .md .md-code-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 10px; background: var(--hover); border-bottom: 1px solid var(--line);
    font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--secondary);
  }
  .md .md-code-copy {
    border: none; background: transparent; padding: 1px 6px; font-size: 11px;
    color: var(--secondary); border-radius: 4px;
  }
  .md .md-code-copy:hover { background: var(--line); color: var(--text); }
  .md pre {
    margin: 0; padding: 9px 11px; overflow-x: auto;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .md pre code {
    background: transparent; border: none; padding: 0; font: inherit;
  }
  .md .md-table-wrap { margin: 8px 0; overflow-x: auto; }
  .md table {
    border-collapse: collapse; font-size: 12.5px; width: auto; min-width: 60%;
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-control);
  }
  .md th, .md td {
    padding: 5px 10px; border: 1px solid var(--line); text-align: left; vertical-align: top;
  }
  .md th { background: var(--hover); font-weight: 600; }

  .caret::after {
    content: ""; display: inline-block; width: 2px; height: 1em;
    margin-left: 2px; vertical-align: -2px; background: var(--accent);
    animation: blink 1s steps(1) infinite;
  }
  .block.text.md.caret::after { display: inline-block; margin-top: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Interleaved visual slot cards */
  .slot {
    display: flex; flex-direction: column; gap: 8px; padding: 10px;
    border: 1px solid var(--line); border-radius: var(--r-card); background: var(--bg);
    animation: rise .2s ease-out;
  }
  .slot.has-error { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
  .slot-card-head { display: flex; align-items: center; gap: 8px; }
  .slot-caption {
    font-size: var(--f-caption); color: var(--secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }
  .badge {
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    padding: 2px 6px; border-radius: 4px; background: var(--hover); color: var(--secondary);
  }
  .badge.image { color: var(--accent); }
  .badge.continuity {
    text-transform: none; letter-spacing: 0; font-weight: 500;
    border: 1px solid var(--line);
  }
  .badge.continuity.i2v-chain {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .badge.continuity.i2v-chain.explicit {
    font-weight: 600;
    border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
    background: color-mix(in srgb, var(--accent) 15%, transparent);
  }
  .badge.continuity.prompt-anchor { color: var(--secondary); }
  .slot-media {
    position: relative; min-height: 168px; border-radius: var(--r-control);
    overflow: hidden; background: var(--surface);
    display: flex; align-items: center; justify-content: center;
  }
  .slot-media img, .slot-media video {
    display: block; width: 100%; max-height: 380px; object-fit: contain;
    border-radius: var(--r-control);
    animation: fade .35s ease-out;
  }
  .slot-media a { display: block; width: 100%; line-height: 0; }
  .shimmer {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, var(--surface) 30%, var(--hover) 50%, var(--surface) 70%);
    background-size: 200% 100%; animation: shimmer 1.4s linear infinite;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .slot-overlay {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: color-mix(in srgb, var(--bg) 45%, transparent);
  }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .slot-error { font-size: var(--f-caption); color: var(--danger); padding: 0 10px; text-align: center; }
  .slot-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .slot-actions button, .slot-actions a.dl { padding: 3px 9px; font-size: var(--f-caption); }
  .slot-actions a.dl {
    color: var(--accent); text-decoration: none; border: 1px solid var(--line);
    border-radius: var(--r-control); background: var(--bg);
  }
  .slot-actions a.dl:hover { background: var(--hover); }

  .artifacts { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .artifact-card { display: flex; flex-direction: column; gap: 6px; }
  .artifact-card a.dl {
    font-size: var(--f-caption); color: var(--accent); text-decoration: none;
  }
  .artifact-card a.dl:hover { text-decoration: underline; }
  .artifacts img {
    display: block; width: 168px; height: 168px; object-fit: cover;
    border-radius: var(--r-card); border: 1px solid var(--line);
    animation: fade .35s ease-out;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .artifacts audio { border-radius: var(--r-control); }
  .artifacts video { max-width: 100%; border-radius: var(--r-card); border: 1px solid var(--line); }
  .legs { font-size: var(--f-caption); color: var(--danger); }
  .asr-note { font-size: var(--f-caption); color: var(--secondary); font-style: italic; }
  .attach-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 0 16px 8px; background: var(--surface); font-size: var(--f-caption);
    color: var(--secondary);
  }
  .attach-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px;
    background: var(--hover); border: 1px solid var(--line); border-radius: 999px;
  }
  .attach-chip button { padding: 0 5px; border: none; background: transparent; font-size: 12px; }
  button.recording { background: var(--danger); border-color: var(--danger); color: #fff; }

  .wave { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
  .wave i { width: 3px; height: 4px; border-radius: 2px; background: var(--accent); opacity: .5; }
  .wave.playing i { opacity: 1; animation: bar .9s ease-in-out infinite; }
  .wave.playing i:nth-child(2) { animation-delay: .12s; }
  .wave.playing i:nth-child(3) { animation-delay: .24s; }
  .wave.playing i:nth-child(4) { animation-delay: .36s; }
  .wave.playing i:nth-child(5) { animation-delay: .48s; }
  @keyframes bar { 0%, 100% { height: 4px; } 50% { height: 18px; } }

  #error {
    display: flex; gap: 8px; padding: 12px 16px; font-size: var(--f-body);
    color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent);
  }

  footer {
    display: flex; align-items: flex-end; gap: 10px; padding: 16px;
    background: var(--surface); border-top: 1px solid var(--line);
  }
  #prompt { flex: 1; resize: vertical; min-height: 38px; max-height: 160px; }
</style>
</head>
<body>
<header>
  <h1>ummInfer</h1>
  <span class="dot" id="dot"></span>
  <span id="status" role="status">Ready</span>
  <span class="chip" id="session" hidden></span>
  <span class="spacer"></span>
  <div id="voiceBar">
    <button id="voiceToggle" type="button" aria-pressed="true">Voice ON</button>
    <button id="realtimeToggle" type="button" aria-pressed="false"
            title="Opt in to full-duplex microphone audio over WebSocket">Realtime OFF</button>
    <label class="realtime-echo-toggle"
           title="Server-side echo suppression for full-duplex voice (toggle before connecting or live mid-response)">
      <input type="checkbox" id="realtimeEchoSuppression" checked>
      <span>Echo suppression</span>
    </label>
    <span id="realtimeStatus" role="status">Realtime off</span>
    <div class="wave" id="voiceWave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <span id="voiceStatus" role="status">Voice ready</span>
    <button id="voiceMute" type="button">Mute</button>
    <button id="voiceStop" type="button">Stop Voice</button>
  </div>
  <select id="theme" aria-label="Theme">
    <option value="system">System</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>
  <button id="new">New chat</button>
</header>

<section id="settings">
  <label>Base URL<input id="endpoint" value="http://127.0.0.1:30000/v1" spellcheck="false"></label>
  <label>Model<input id="model" value="Qwen2.5-0.5B-Instruct-4bit" spellcheck="false"></label>
  <label class="check"><input type="checkbox" id="image"> Image</label>
  <label class="check"><input type="checkbox" id="audio"> Audio</label>
  <label class="check"><input type="checkbox" id="video"> Video</label>
  <label>Voice<input id="voice" value="vivian" spellcheck="false"></label>
  <label class="check"><input type="checkbox" id="narrative" checked> Narrative</label>
  <label>Visuals<select id="visualMode">
    <option value="auto">Auto: Img+Vid</option>
    <option value="image">Image only</option>
    <option value="video">Video only</option>
  </select></label>
  <label>Max slots<input id="maxSlots" type="number" min="1" max="4" value="3" style="width:64px"></label>
  <label class="check" title="In Narrative mode, allow pure-text responses for math, code, or factual prompts without redundant visuals"><input type="checkbox" id="allowTextOnly" checked> Smart text-only</label>
  <label title="Cross-slot visual continuity across narrative visual beats">Continuity<select id="narrativeContinuity">
    <option value="off" selected>Off</option>
    <option value="prompt_anchor">Prompt anchor</option>
    <option value="i2v_chain">I2V chain</option>
  </select></label>
  <label title="Optional cross-slot style cue (max 256 UTF-8 bytes)">Style anchor<input id="styleAnchor" type="text" placeholder="Optional style cue (≤256B)" style="width:190px"></label>
  <label class="check" title="Enable Wan2.2 TeaCache (0.05) for sub-10s video generation"><input type="checkbox" id="fastVideo"> Fast video</label>
  <details id="advanced">
    <summary>Options</summary>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;align-items:center;">
      <label>Max tokens<input id="maxTokens" type="number" min="1" max="4096" value="256" style="width:76px"></label>
      <label>Temp<input id="temperature" type="number" step="0.1" min="0" max="2" value="0" style="width:64px"></label>
      <label>top_p<input id="topP" type="number" step="0.05" min="0.05" max="1" placeholder="1.0" style="width:68px"></label>
      <label>Seed<input id="seed" type="number" step="1" placeholder="auto" style="width:84px"></label>

const ui = {

  temperature: $('temperature'), topP: $('topP'), seed: $('seed'), apiKey: $('apiKey'),
  realtimeEndpoint: $('realtimeEndpoint'),
  imageSize: $('imageSize'), imageSteps: $('imageSteps'), imageFile: $('imageFile'),
  refAudio: $('refAudio'), videoSize: $('videoSize'), videoSeconds: $('videoSeconds'),
  videoFrames: $('videoFrames'), videoSteps: $('videoSteps'),
  videoGuidance: $('videoGuidance'), videoFramePolicy: $('videoFramePolicy'),
  videoMotionThreshold: $('videoMotionThreshold'), videoSceneThreshold: $('videoSceneThreshold'),
  nativeAllocatorTelemetry: $('nativeAllocatorTelemetry'),
  advanced: $('advanced'),
  transcript: $('transcript'), emptyState: $('emptyState'), showcasePresets: $('showcasePresets'),
  error: $('error'),
  attachBar: $('attachBar'), askImage: $('askImage'), askVideo: $('askVideo'),
  askAudio: $('askAudio'), pickImage: $('pickImage'), pickVideo: $('pickVideo'),
  pickAudio: $('pickAudio'), mic: $('mic'),
  prompt: $('prompt'), send: $('send'), stop: $('stop'), newChat: $('new'),
  narrative: $('narrative'), visualMode: $('visualMode'), maxSlots: $('maxSlots'),
  allowTextOnly: $('allowTextOnly'), narrativeContinuity: $('narrativeContinuity'),
  styleAnchor: $('styleAnchor'), fastVideo: $('fastVideo'),
  voiceToggle: $('voiceToggle'), voiceWave: $('voiceWave'),
  voiceStatus: $('voiceStatus'), voiceMute: $('voiceMute'), voiceStop: $('voiceStop'),
  realtimeToggle: $('realtimeToggle'), realtimeStatus: $('realtimeStatus'),
  realtimeEchoSuppression: $('realtimeEchoSuppression'),
  realtimeStrip: $('realtimeStrip'), realtimeStripPhase: $('realtimeStripPhase'),
  realtimeMicMeter: $('realtimeMicMeter'), realtimeMicMeterFill: $('realtimeMicMeterFill'),
  realtimeEchoState: $('realtimeEchoState'), realtimeBargeInCount: $('realtimeBargeInCount'),
};

const log = (...args) => console.log('[umm]', ...args);

// ---------- theme (Theme.swift tokens, system/light/dark) ----------

const THEME_KEY = 'ummweb.theme';
const scheme = matchMedia('(prefers-color-scheme: dark)');

function applyTheme() {
  const mode = localStorage.getItem(THEME_KEY) || 'system';
  ui.theme.value = mode;
  document.documentElement.classList.toggle(
    'dark', mode === 'dark' || (mode === 'system' && scheme.matches));
}
scheme.addEventListener('change', applyTheme);
ui.theme.addEventListener('change', () => {
  localStorage.setItem(THEME_KEY, ui.theme.value);
  applyTheme();
});
applyTheme();

// ---------- settings ----------

const DEFAULT_ENDPOINT = 'http://127.0.0.1:30000/v1';
const DEFAULT_MODEL = 'Qwen2.5-0.5B-Instruct-4bit';
const SAME_ORIGIN_ENDPOINT =
  (location.protocol === 'http:' || location.protocol === 'https:')
    ? (location.origin + '/v1') : '';

const SETTINGS = ['endpoint', 'realtimeEndpoint', 'model', 'voice', 'maxTokens', 'temperature', 'topP',
                  'seed', 'imageSize', 'imageSteps', 'videoSize', 'videoSeconds',
                  'videoFrames', 'videoSteps', 'videoGuidance', 'videoFramePolicy',
                  'videoMotionThreshold', 'videoSceneThreshold', 'visualMode', 'maxSlots',
                  'narrativeContinuity', 'styleAnchor'];
for (const key of SETTINGS) {
  const saved = localStorage.getItem('ummweb.' + key);
  if (saved !== null) ui[key].value = saved;
}
// When served by `umm-infer serve --web-root`, default to same-origin /v1 and
// heal any stale default endpoint saved before the page was hosted here.
if (SAME_ORIGIN_ENDPOINT && (!ui.endpoint.value.trim() || ui.endpoint.value.trim() === DEFAULT_ENDPOINT)) {
  ui.endpoint.value = SAME_ORIGIN_ENDPOINT;
}
ui.image.checked = localStorage.getItem('ummweb.image') === '1';
ui.audio.checked = localStorage.getItem('ummweb.audio') === '1';
ui.video.checked = localStorage.getItem('ummweb.video') === '1';
ui.narrative.checked = localStorage.getItem('ummweb.narrative') !== '0';
ui.allowTextOnly.checked = localStorage.getItem('ummweb.allowTextOnly') !== '0';
ui.fastVideo.checked = localStorage.getItem('ummweb.fastVideo') === '1';
ui.nativeAllocatorTelemetry.checked = localStorage.getItem('ummweb.nativeAllocatorTelemetry') === '1';
ui.realtimeEchoSuppression.checked = localStorage.getItem('ummweb.echoSuppression') !== '0';
const saveSettings = () => {
  for (const key of SETTINGS) localStorage.setItem('ummweb.' + key, ui[key].value);
  localStorage.setItem('ummweb.image', ui.image.checked ? '1' : '0');
  localStorage.setItem('ummweb.audio', ui.audio.checked ? '1' : '0');
  localStorage.setItem('ummweb.video', ui.video.checked ? '1' : '0');
  localStorage.setItem('ummweb.narrative', ui.narrative.checked ? '1' : '0');
  localStorage.setItem('ummweb.allowTextOnly', ui.allowTextOnly.checked ? '1' : '0');
  localStorage.setItem('ummweb.fastVideo', ui.fastVideo.checked ? '1' : '0');
  localStorage.setItem('ummweb.nativeAllocatorTelemetry', ui.nativeAllocatorTelemetry.checked ? '1' : '0');
  localStorage.setItem('ummweb.echoSuppression', ui.realtimeEchoSuppression.checked ? '1' : '0');
};

function apiURL(base, suffix) {
  const url = new URL(base.trim());
  if (url.protocol !== 'http:' && url.protocol !== 'https:') {
    throw new Error('Base URL must use http or https.');
  }
  if (url.username || url.password || url.search || url.hash) {
    throw new Error('Use a base URL without credentials, query, or fragment.');
  }
  let path = url.pathname.replace(/\/+$/, '');
  if (!path) path = '/v1';
  url.pathname = path + suffix;
  return url;
}

function authHeaders(extra = {}) {
  const headers = { ...extra };
  const key = ui.apiKey.value.trim();
  if (key) headers.Authorization = 'Bearer ' + key;
  return headers;
}

async function discoverModel() {
  try {
    const res = await fetch(apiURL(ui.endpoint.value, '/models'), { headers: authHeaders() });
    if (!res.ok) return;
    const data = await res.json();
    const id = data?.data?.[0]?.id;
    if (typeof id === 'string' && id &&
        (!ui.model.value.trim() || ui.model.value.trim() === DEFAULT_MODEL)) {
      ui.model.value = id;
      saveSettings();
    }
  } catch { /* best-effort model discovery */ }
}
discoverModel();
ui.endpoint.addEventListener('change', discoverModel);

function readFileAsDataURL(input) {
  const file = input.files && input.files[0];
  if (!file) return Promise.resolve('');
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
    reader.onerror = () => reject(new Error('Failed to read selected file.'));
    reader.readAsDataURL(file);
  });
}

function encodeBase64(bytes) {
  let binary = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

function encodeWavPcm16Mono(samples, sampleRate) {
  const len = samples.length;
  const buf = new ArrayBuffer(44 + len * 2);
  const view = new DataView(buf);
  const str = (off, s) => { for (let i = 0; i < s.length; i += 1) view.setUint8(off + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); view.setUint32(4, 36 + len * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  str(36, 'data'); view.setUint32(40, len * 2, true);
  for (let i = 0; i < len; i += 1) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Uint8Array(buf);
}

function encodePcm16Mono(samples) {
  const bytes = new Uint8Array(samples.length * 2);
  const view = new DataView(bytes.buffer);
  for (let i = 0; i < samples.length; i += 1) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return bytes;
}

function resampleMono(samples, fromRate, toRate) {
  if (fromRate === toRate) return samples;
  const outLen = Math.max(1, Math.round(samples.length * toRate / fromRate));
  const out = new Float32Array(outLen);
  const ratio = fromRate / toRate;
  for (let i = 0; i < outLen; i += 1) {
    const pos = i * ratio;
    const idx = Math.floor(pos);
    const frac = pos - idx;
    const a = samples[idx] ?? 0;
    const b = samples[Math.min(idx + 1, samples.length - 1)] ?? a;
    out[i] = a + (b - a) * frac;
  }
  return out;
}

async function decodeAudioToWav16kBase64(arrayBuffer) {
  const ctx = new AudioContext();
  try {
    const audioBuf = await ctx.decodeAudioData(arrayBuffer.slice(0));
    const len = audioBuf.length;
    const mono = new Float32Array(len);
    for (let c = 0; c < audioBuf.numberOfChannels; c += 1) {
      const ch = audioBuf.getChannelData(c);
      for (let i = 0; i < len; i += 1) mono[i] += ch[i] / audioBuf.numberOfChannels;
    }
    const pcm16k = resampleMono(mono, audioBuf.sampleRate, 16000);
    return encodeBase64(encodeWavPcm16Mono(pcm16k, 16000));
  } finally {
    ctx.close().catch(() => {});
  }
}

// ---------- multimodal composer attachments ----------

let attachedImage = null; // { name, dataURL }
let attachedVideo = null; // { name, dataURL }
let attachedAudio = null; // { name, wavBase64 }
let micState = null;      // { stream, ctx, src, proc, chunks, sampleRate }

function renderAttachments() {
  ui.attachBar.replaceChildren();
  const addChip = (label, onRemove) => {
    const chip = document.createElement('span');
    chip.className = 'attach-chip';
    chip.append(document.createTextNode(label));
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '×';
    btn.addEventListener('click', onRemove);
    chip.append(btn);
    ui.attachBar.append(chip);
  };
  if (attachedImage) {
    addChip(`Image: ${attachedImage.name}`, () => {
      attachedImage = null; ui.askImage.value = ''; renderAttachments();
    });
  }
  if (attachedVideo) {
    addChip(`Video: ${attachedVideo.name}`, () => {
      attachedVideo = null; ui.askVideo.value = ''; renderAttachments();
    });
  }
  if (attachedAudio) {
    addChip(`Audio (16k WAV): ${attachedAudio.name}`, () => {
      attachedAudio = null; ui.askAudio.value = ''; renderAttachments();
    });
  }
  ui.attachBar.hidden = !attachedImage && !attachedVideo && !attachedAudio;
}

ui.pickImage.addEventListener('click', () => ui.askImage.click());
ui.askImage.addEventListener('change', async () => {
  const file = ui.askImage.files?.[0];
  if (!file) return;
  try {
    const dataURL = await readFileAsDataURL(ui.askImage);
    attachedImage = { name: file.name, dataURL };
    attachedVideo = null; ui.askVideo.value = '';
    renderAttachments();
  } catch (err) { showError(err.message); }
});

ui.pickVideo.addEventListener('click', () => ui.askVideo.click());
ui.askVideo.addEventListener('change', async () => {
  const file = ui.askVideo.files?.[0];
  if (!file) return;
  if (file.size > 32 * 1024 * 1024) {
    showError('Attached video exceeds the 32 MiB upload limit.');
    ui.askVideo.value = '';
    return;
  }
  try {
    const dataURL = await readFileAsDataURL(ui.askVideo);
    attachedVideo = { name: file.name, dataURL };
    attachedImage = null; ui.askImage.value = '';
    renderAttachments();
    if (ui.status.textContent === SHOWCASE_PRESETS.temporal_video_qa.missingVideoHint) {
      setStatus('Ready', false);
    }
  } catch (err) { showError(err.message); }
});

ui.pickAudio.addEventListener('click', () => ui.askAudio.click());
ui.askAudio.addEventListener('change', async () => {
  const file = ui.askAudio.files?.[0];
  if (!file) return;
  try {
    setStatus('Converting audio to 16 kHz WAV…', false);
    const wavBase64 = await decodeAudioToWav16kBase64(await file.arrayBuffer());
    attachedAudio = { name: file.name, wavBase64 };
    renderAttachments();
    setStatus('Ready', false);
  } catch (err) { showError('Audio decode failed: ' + err.message); }
});

ui.mic.addEventListener('click', async () => {
  if (micState) {
    const st = micState;
    micState = null;
    ui.mic.classList.remove('recording');
    ui.mic.textContent = 'Mic';
    st.proc.disconnect();
    st.src.disconnect();
    st.stream.getTracks().forEach((t) => t.stop());
    const total = st.chunks.reduce((n, c) => n + c.length, 0);
    const merged = new Float32Array(total);
    let off = 0;
    for (const c of st.chunks) { merged.set(c, off); off += c.length; }
    st.ctx.close().catch(() => {});
    if (total > 0) {
      const pcm16k = resampleMono(merged, st.sampleRate, 16000);
      const sec = (pcm16k.length / 16000).toFixed(1);
      attachedAudio = { name: `mic-${sec}s.wav`, wavBase64: encodeBase64(encodeWavPcm16Mono(pcm16k, 16000)) };
      renderAttachments();
      setStatus(`Recorded ${sec}s`, false);
    } else {
      setStatus('Ready', false);
    }
    return;
  }
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Microphone requires localhost/127.0.0.1 or HTTPS.');
    }
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    proc.onaudioprocess = (e) => { chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
    src.connect(proc);
    proc.connect(ctx.destination);
    micState = { stream, ctx, src, proc, chunks, sampleRate: ctx.sampleRate };
    ui.mic.classList.add('recording');
    ui.mic.textContent = 'Stop Mic';
    setStatus('Recording… click Stop Mic when done', true);
  } catch (err) {
    showError('Microphone error: ' + err.message);
  }
});

    prompt: 'Watch this attached video clip and summarize the key visual events, motion changes, and scene cuts in chronological order.',
  }),
});

function applyShowcasePresetToControls(presetId, controls, hooks = {}) {
  const preset = SHOWCASE_PRESETS[presetId];
  if (!preset) return null;
  controls.narrative.checked = true;
  controls.visualMode.value = preset.narrativeMode;
  controls.allowTextOnly.checked = preset.allowTextOnly;
  controls.narrativeContinuity.value = preset.continuityMode;
  controls.styleAnchor.value = preset.styleAnchor;
  controls.fastVideo.checked = preset.fastVideo;
  if (controls.videoFramePolicy) {
    controls.videoFramePolicy.value = preset.videoFramePolicy;
  }
  if (controls.videoMotionThreshold) {
    controls.videoMotionThreshold.value = preset.videoMotionThreshold;
  }
  if (controls.videoSceneThreshold) {
    controls.videoSceneThreshold.value = preset.videoSceneThreshold;
  }
  if (controls.advanced && preset.videoFramePolicy === 'temporal') {
    controls.advanced.open = true;
  }
  if (typeof hooks.setAudioEnabled === 'function') {
    hooks.setAudioEnabled(preset.enableAudio);
  }
  controls.prompt.value = preset.prompt;
  if (typeof hooks.syncNarrativeControls === 'function') hooks.syncNarrativeControls();
  if (typeof hooks.syncVideoFrameControls === 'function') hooks.syncVideoFrameControls();
  if (typeof hooks.saveSettings === 'function') hooks.saveSettings();
  if (typeof hooks.setStatus === 'function') {
    const hasVideo = typeof hooks.hasAttachedVideo === 'function'
      ? Boolean(hooks.hasAttachedVideo())
      : false;
    if (preset.requiresVideoAttachment && !hasVideo && preset.missingVideoHint) {
      hooks.setStatus(preset.missingVideoHint, false);
    } else {
      hooks.setStatus('Ready', false);
    }
  }
  if (typeof controls.prompt.focus === 'function') controls.prompt.focus();
  return preset;
}

function updateEmptyStateVisibility(emptyEl, messageCount) {
  if (!emptyEl) return;
  emptyEl.hidden = messageCount > 0;
}
// SHOWCASE_PRESETS_END

// TURN_TELEMETRY_BEGIN
function formatTelemetryDuration(ms) {
  if (typeof ms !== 'number' || !Number.isFinite(ms) || ms < 0) return null;
  const rounded = Math.round(ms);
  if (rounded < 1000) return `${rounded} ms`;
  return `${(ms / 1000).toFixed(2)} s`;
}

function formatAllocatorBytes(bytes) {
  if (typeof bytes !== 'number' || !Number.isFinite(bytes) || bytes < 0) return null;
  const KiB = 1024;
  const MiB = 1024 * 1024;
  const GiB = 1024 * 1024 * 1024;
  const fmt = (val, unit) => {
    const rounded = Math.round(val * 10) / 10;
    const text = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    return `${text} ${unit}`;
  };
  if (bytes >= GiB) return fmt(bytes / GiB, 'GiB');
  if (bytes >= MiB) return fmt(bytes / MiB, 'MiB');
  if (bytes >= KiB) return fmt(bytes / KiB, 'KiB');
  return `${Math.round(bytes)} B`;
}

function applyNativeAllocatorTelemetryOption(body, enabled) {
  if (enabled === true) {
    body.telemetry = { native_allocator: true };
  }
  return body;
}

function extractNativeAllocatorTelemetry(root) {
  if (!root || typeof root !== 'object') return null;
  const candidate = (root.unified && typeof root.unified === 'object' &&
                     root.unified.telemetry != null)
    ? root.unified.telemetry
    : root.telemetry;
  if (!candidate || typeof candidate !== 'object' || Array.isArray(candidate)) return null;
  if (!Array.isArray(candidate.stages) && typeof candidate.coverage !== 'string') return null;
  return candidate;
}

function summarizeNativeAllocatorTelemetry(envelope) {
  if (!envelope || typeof envelope !== 'object' || Array.isArray(envelope)) return null;
  const stages = Array.isArray(envelope.stages) ? envelope.stages : [];
  let coveredCount = 0;
  let peakBytes = null;
  const detailLines = [];
  for (const entry of stages) {
    if (!entry || typeof entry !== 'object') continue;
    const stage = typeof entry.stage === 'string' && entry.stage ? entry.stage : '';
    const nativeStage = typeof entry.native_stage === 'string' &&
                        entry.native_stage && entry.native_stage !== 'unknown'
      ? entry.native_stage : '';
    const stageName = (stage && nativeStage && nativeStage !== stage)
      ? `${stage}/${nativeStage}`
      : (nativeStage || stage || 'stage');
    const rawPeak = entry.allocated_bytes_peak;
    const validPeak = entry.coverage === 'COVERED' &&
                      typeof rawPeak === 'number' &&
                      Number.isFinite(rawPeak) &&
                      rawPeak >= 0;
    if (validPeak) {
      coveredCount += 1;
      peakBytes = peakBytes === null ? rawPeak : Math.max(peakBytes, rawPeak);
      const formattedPeak = formatAllocatorBytes(rawPeak);
      const epochId = entry.epoch && typeof entry.epoch === 'object' &&
                      typeof entry.epoch.id === 'number' &&
                      Number.isSafeInteger(entry.epoch.id) && entry.epoch.id > 0
        ? entry.epoch.id : null;
      const epochSuffix = epochId !== null ? ` · epoch #${epochId}` : '';
      detailLines.push(`${stageName}: COVERED · peak ${formattedPeak}${epochSuffix}`);
    } else {
      const reason = typeof entry.reason === 'string' && entry.reason ? entry.reason : '';
      const reasonSuffix = reason ? ` (${reason})` : '';
      detailLines.push(`${stageName}: NOT_COVERED${reasonSuffix}`);
    }
  }
  if (coveredCount > 0 && peakBytes !== null) {
    const formatted = formatAllocatorBytes(peakBytes);
    const header = `Native CUDA allocator (${coveredCount}/${stages.length} stage${stages.length === 1 ? '' : 's'} covered)`;
    return {
      covered: true,
      coverage: coveredCount === stages.length ? 'COVERED' : 'PARTIAL',
      coveredStageCount: coveredCount,
      totalStageCount: stages.length,
      peakBytes,
      label: `VRAM: ${formatted} peak`,
      title: [header, ...detailLines].join('\n'),
    };
  }
  const header = 'Native CUDA allocator (NOT_COVERED)';
  const lines = detailLines.length ? detailLines : ['no stages reported'];
  return {
    covered: false,
    coverage: 'NOT_COVERED',
    coveredStageCount: 0,
    totalStageCount: stages.length,
    peakBytes: null,
    label: 'VRAM: N/C',
    title: [header, ...lines].join('\n'),
  };
}

function formatTurnTelemetry(telemetry) {
  if (!telemetry || typeof telemetry !== 'object') return [];
  const pills = [];
  const ttft = formatTelemetryDuration(telemetry.ttftMs);
  if (ttft !== null) pills.push({ kind: 'ttft', label: `TTFT ${ttft}` });
  const ttfa = formatTelemetryDuration(telemetry.ttfaMs);
  if (ttfa !== null) pills.push({ kind: 'ttfa', label: `TTFA ${ttfa}` });
  const visualCount = Number.isInteger(telemetry.visualSettledCount)
    ? telemetry.visualSettledCount : 0;
  if (visualCount > 0) {
    const countLabel = visualCount === 1 ? '1 visual' : `${visualCount} visuals`;
    const firstVisual = formatTelemetryDuration(telemetry.firstVisualMs);
    pills.push({
      kind: 'visual',
      label: firstVisual !== null ? `${countLabel} (${firstVisual})` : countLabel,
    });
  }
  if (telemetry.hasI2VChain === true || telemetry.hasExplicitAnchor === true) {
    pills.push({
      kind: 'i2v',
      label: telemetry.hasExplicitAnchor === true ? 'Explicit I2V' : 'I2V',
    });
  }
  const total = formatTelemetryDuration(telemetry.totalMs);
  if (total !== null) pills.push({ kind: 'total', label: `Total ${total}` });
  const vram = summarizeNativeAllocatorTelemetry(telemetry.nativeAllocator);
  if (vram !== null) {
    pills.push({
      kind: 'vram',
      label: vram.label,
      title: vram.title,
      coverage: vram.coverage,
    });
  }
  return pills;
}
// TURN_TELEMETRY_END

function syncEmptyState() {
  const turnCount = ui.transcript.querySelectorAll('.turn').length;
  updateEmptyStateVisibility(ui.emptyState, turnCount);
}

function elapsedTelemetryMs(targetTurn) {
  if (!targetTurn?.telemetry || typeof targetTurn.telemetry.startedAt !== 'number') return null;
  return Math.max(0, performance.now() - targetTurn.telemetry.startedAt);
}

function renderTurnTelemetry(targetTurn) {
  if (!targetTurn?.telemetryEl) return;
  const pills = formatTurnTelemetry(targetTurn.telemetry);
  if (!pills.length) {
    targetTurn.telemetryEl.replaceChildren();
    targetTurn.telemetryEl.hidden = true;
    return;
  }
  const frag = document.createDocumentFragment();
  for (const pill of pills) {
    const span = document.createElement('span');
    span.className = 'telemetry-pill' + (pill.kind === 'i2v' ? ' accent' : '');
    span.dataset.metric = pill.kind;
    if (pill.coverage) span.dataset.coverage = pill.coverage;
    if (pill.title) span.title = pill.title;
    span.textContent = pill.label;
    frag.append(span);
  }
  targetTurn.telemetryEl.replaceChildren(frag);
  targetTurn.telemetryEl.hidden = false;
}

function recordNativeAllocatorTelemetry(targetTurn, rawTelemetry) {
  if (!targetTurn?.telemetry || !rawTelemetry || typeof rawTelemetry !== 'object') return;
  targetTurn.telemetry.nativeAllocator = rawTelemetry;
  renderTurnTelemetry(targetTurn);
}

function recordTurnTotal(targetTurn) {
  if (!targetTurn?.telemetry || targetTurn.telemetry.totalMs !== null) return;
  targetTurn.telemetry.totalMs = elapsedTelemetryMs(targetTurn);
  renderTurnTelemetry(targetTurn);
}

function addTurn(role, text) {
  const el = document.createElement('div');
  el.className = 'turn ' + role;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = role === 'user' ? 'You' : 'ummInfer';
  const body = document.createElement('div');
  body.className = 'body';
  const asrEl = document.createElement('div');
  asrEl.className = 'asr-note';
  const flow = document.createElement('div');
  flow.className = 'flow';
  const artifacts = document.createElement('div');
  artifacts.className = 'artifacts';
  const legs = document.createElement('div');
  legs.className = 'legs';
  const telemetryEl = document.createElement('div');
  telemetryEl.className = 'telemetry-strip';
  telemetryEl.hidden = true;
