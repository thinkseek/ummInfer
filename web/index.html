<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ummInfer</title>
<style>
  /* Design tokens mirror clients/ummmlx/Sources/ummmlx/Theme.swift. */
  :root {
    --bg: #FFFFFF; --surface: #F7F7F7; --hover: #F2F2F2; --line: #EBEBEB;
    --text: #111111; --secondary: #6E6E6E; --tertiary: #A3A3A3;
    --ink: #111111; --on-ink: #FFFFFF;
    --accent: #0D9384; --danger: #EB5230;
    --r-control: 8px; --r-card: 12px;
    --f-title: 20px; --f-section: 15px; --f-body: 13px; --f-caption: 12px;
  }
  :root.dark {
    --bg: #151515; --surface: #1C1C1C; --hover: #232323; --line: #2B2B2B;
    --text: #F2F2F2; --secondary: #A3A3A3; --tertiary: #6B6B6B;
    --ink: #F2F2F2; --on-ink: #151515;
    --accent: #2BB3A3; --danger: #FF6B47;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; background: var(--bg);
    color: var(--text); font: var(--f-body)/1.5 -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    background: var(--surface);
  }
  header h1 { margin: 0; font-size: var(--f-title); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tertiary); transition: background .2s; }
  .dot.busy { background: var(--accent); }
  #status { font-size: var(--f-caption); color: var(--secondary); }
  .chip {
    font: var(--f-caption)/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--secondary); background: var(--hover);
    padding: 4px 7px; border-radius: 6px;
  }
  .spacer { flex: 1; }

  #settings {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
    padding: 12px 16px; background: var(--surface);
  }
  #settings label { display: flex; flex-direction: column; gap: 4px; font-size: var(--f-caption); color: var(--secondary); }
  #settings label.check { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 6px; }
  #settings label.grow { flex: 1 1 260px; }
  input[type=text], input:not([type]), select, textarea {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--r-control);
    padding: 7px 9px; outline: none; transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  #settings input { width: 100%; }
  #settings label.grow input, #settings label:first-child input { width: 100%; }
  #settings label:first-child { flex: 1 1 300px; }
  #settings label:nth-child(2) { flex: 0 1 220px; }
  #settings label:nth-child(5) { flex: 0 1 130px; }
  input[type=checkbox] { accent-color: var(--accent); }

  button {
    font: inherit; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); border-radius: var(--r-control); padding: 7px 14px;
    cursor: pointer; transition: background .15s, border-color .15s, transform .08s;
  }
  button:hover { background: var(--hover); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  button.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  button.primary:hover { opacity: .88; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }

  #transcript { flex: 1; overflow-y: auto; padding: 20px; }
  #transcript:empty::after {
    content: "Chat with your ummInfer unified server";
    display: block; text-align: center; color: var(--tertiary);
    font-size: var(--f-section); padding-top: 18vh;
  }
  .turn { display: flex; flex-direction: column; gap: 6px; max-width: 680px; margin: 0 0 18px; }
  .turn.user { margin-left: auto; align-items: flex-end; }
  .turn .meta { font-size: var(--f-caption); font-weight: 500; color: var(--secondary); }
  .turn .body { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .turn .text {
    white-space: pre-wrap; word-break: break-word; padding: 10px 13px;
    border-radius: var(--r-card); background: var(--surface);
    animation: rise .18s ease-out;
  }
  .turn.user .text { background: var(--ink); color: var(--on-ink); }
  .turn .text:empty:not(.caret) { display: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .caret::after {
    content: ""; display: inline-block; width: 2px; height: 1em;
    margin-left: 2px; vertical-align: -2px; background: var(--accent);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .artifacts { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .artifact-card { display: flex; flex-direction: column; gap: 6px; }
  .artifact-card a.dl {
    font-size: var(--f-caption); color: var(--accent); text-decoration: none;
  }
  .artifact-card a.dl:hover { text-decoration: underline; }
  .artifacts img {
    display: block; width: 168px; height: 168px; object-fit: cover;
    border-radius: var(--r-card); border: 1px solid var(--line);
    animation: fade .35s ease-out;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .artifacts audio { border-radius: var(--r-control); }
  .artifacts video { max-width: 100%; border-radius: var(--r-card); border: 1px solid var(--line); }
  .legs { font-size: var(--f-caption); color: var(--danger); }
  .asr-note { font-size: var(--f-caption); color: var(--secondary); font-style: italic; }
  .attach-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 0 16px 8px; background: var(--surface); font-size: var(--f-caption);
    color: var(--secondary);
  }
  .attach-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px;
    background: var(--hover); border: 1px solid var(--line); border-radius: 999px;
  }
  .attach-chip button { padding: 0 5px; border: none; background: transparent; font-size: 12px; }
  button.recording { background: var(--danger); border-color: var(--danger); color: #fff; }

  .wave { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
  .wave i { width: 3px; height: 4px; border-radius: 2px; background: var(--accent); opacity: .5; }
  .wave.playing i { opacity: 1; animation: bar .9s ease-in-out infinite; }
  .wave.playing i:nth-child(2) { animation-delay: .12s; }
  .wave.playing i:nth-child(3) { animation-delay: .24s; }
  .wave.playing i:nth-child(4) { animation-delay: .36s; }
  .wave.playing i:nth-child(5) { animation-delay: .48s; }
  @keyframes bar { 0%, 100% { height: 4px; } 50% { height: 18px; } }

  #error {
    display: flex; gap: 8px; padding: 12px 16px; font-size: var(--f-body);
    color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent);
  }

  footer {
    display: flex; align-items: flex-end; gap: 10px; padding: 16px;
    background: var(--surface); border-top: 1px solid var(--line);
  }
  #prompt { flex: 1; resize: vertical; min-height: 38px; max-height: 160px; }
</style>
</head>
<body>
<header>
  <h1>ummInfer</h1>
  <span class="dot" id="dot"></span>
  <span id="status" role="status">Ready</span>
  <span class="chip" id="session" hidden></span>
  <span class="spacer"></span>
  <select id="theme" aria-label="Theme">
    <option value="system">System</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>
  <button id="new">New chat</button>
</header>

<section id="settings">
  <label>Base URL<input id="endpoint" value="http://127.0.0.1:30000/v1" spellcheck="false"></label>
  <label>Model<input id="model" value="Qwen2.5-0.5B-Instruct-4bit" spellcheck="false"></label>
  <label class="check"><input type="checkbox" id="image"> Image</label>
  <label class="check"><input type="checkbox" id="audio"> Audio</label>
  <label class="check"><input type="checkbox" id="video"> Video</label>
  <label>Voice<input id="voice" value="vivian" spellcheck="false"></label>
  <details id="advanced">
    <summary>Options</summary>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;align-items:center;">
      <label>Max tokens<input id="maxTokens" type="number" min="1" max="4096" value="256" style="width:76px"></label>
      <label>Temp<input id="temperature" type="number" step="0.1" min="0" max="2" value="0" style="width:64px"></label>
      <label>top_p<input id="topP" type="number" step="0.05" min="0.05" max="1" placeholder="1.0" style="width:68px"></label>
      <label>Seed<input id="seed" type="number" step="1" placeholder="auto" style="width:84px"></label>
      <label>API key<input id="apiKey" type="password" placeholder="optional" style="width:120px"></label>
      <label>Img size<select id="imageSize"><option value="512x512">512x512</option><option value="1024x1024">1024x1024</option></select></label>
      <label>Img steps<input id="imageSteps" type="number" min="1" max="100" placeholder="default" style="width:72px"></label>
      <label>Edit img<input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp" style="max-width:170px"></label>
      <label>Ref WAV<input id="refAudio" type="file" accept="audio/wav,.wav" style="max-width:170px"></label>
      <label>Vid size<select id="videoSize"><option value="480x320">480x320</option><option value="704x480">704x480</option><option value="1280x704">1280x704</option></select></label>
      <label>Vid sec<input id="videoSeconds" type="number" min="1" max="10" value="1" style="width:56px"></label>
      <label>Vid frames<input id="videoFrames" type="number" min="1" max="81" placeholder="auto" style="width:68px"></label>
      <label>Vid steps<input id="videoSteps" type="number" min="1" max="100" placeholder="default" style="width:72px"></label>
      <label>Vid CFG<input id="videoGuidance" type="number" step="0.5" min="0" placeholder="5.0" style="width:64px"></label>
    </div>
  </details>
</section>

<main id="transcript"></main>
<div id="error" hidden></div>

<div class="attach-bar" id="attachBar" hidden></div>
<footer>
  <input id="askImage" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <input id="askAudio" type="file" accept="audio/*" hidden>
  <button id="pickImage" type="button" title="Attach image for VLM visual QA">+ Img</button>
  <button id="pickAudio" type="button" title="Attach audio file for ASR -> VLM">+ Audio</button>
  <button id="mic" type="button" title="Record voice for ASR -> VLM">Mic</button>
  <textarea id="prompt" rows="1" placeholder="Write a prompt (or attach image / record voice)"></textarea>
  <button id="send" class="primary">Send</button>
  <button id="stop" class="danger" hidden>Stop</button>
</footer>

<script type="module">
// ummInfer web client. Wire protocol mirrored from
// clients/ummmlx/Sources/ummmlx/ChatClient.swift and UnifiedStream.swift;
// contract in docs/mixed-output-contract.md.

const $ = (id) => document.getElementById(id);
const ui = {
  dot: $('dot'), status: $('status'), session: $('session'), theme: $('theme'),
  endpoint: $('endpoint'), model: $('model'), image: $('image'), audio: $('audio'),
  video: $('video'), voice: $('voice'), maxTokens: $('maxTokens'),
  temperature: $('temperature'), topP: $('topP'), seed: $('seed'), apiKey: $('apiKey'),
  imageSize: $('imageSize'), imageSteps: $('imageSteps'), imageFile: $('imageFile'),
  refAudio: $('refAudio'), videoSize: $('videoSize'), videoSeconds: $('videoSeconds'),
  videoFrames: $('videoFrames'), videoSteps: $('videoSteps'),
  videoGuidance: $('videoGuidance'), transcript: $('transcript'), error: $('error'),
  attachBar: $('attachBar'), askImage: $('askImage'), askAudio: $('askAudio'),
  pickImage: $('pickImage'), pickAudio: $('pickAudio'), mic: $('mic'),
  prompt: $('prompt'), send: $('send'), stop: $('stop'), newChat: $('new'),
};

const log = (...args) => console.log('[umm]', ...args);

// ---------- theme (Theme.swift tokens, system/light/dark) ----------

const THEME_KEY = 'ummweb.theme';
const scheme = matchMedia('(prefers-color-scheme: dark)');

function applyTheme() {
  const mode = localStorage.getItem(THEME_KEY) || 'system';
  ui.theme.value = mode;
  document.documentElement.classList.toggle(
    'dark', mode === 'dark' || (mode === 'system' && scheme.matches));
}
scheme.addEventListener('change', applyTheme);
ui.theme.addEventListener('change', () => {
  localStorage.setItem(THEME_KEY, ui.theme.value);
  applyTheme();
});
applyTheme();

// ---------- settings ----------

const DEFAULT_ENDPOINT = 'http://127.0.0.1:30000/v1';
const DEFAULT_MODEL = 'Qwen2.5-0.5B-Instruct-4bit';
const SAME_ORIGIN_ENDPOINT =
  (location.protocol === 'http:' || location.protocol === 'https:')
    ? (location.origin + '/v1') : '';

const SETTINGS = ['endpoint', 'model', 'voice', 'maxTokens', 'temperature', 'topP',
                  'seed', 'imageSize', 'imageSteps', 'videoSize', 'videoSeconds',
                  'videoFrames', 'videoSteps', 'videoGuidance'];
for (const key of SETTINGS) {
  const saved = localStorage.getItem('ummweb.' + key);
  if (saved !== null) ui[key].value = saved;
}
// When served by `umm-infer serve --web-root`, default to same-origin /v1 and
// heal any stale default endpoint saved before the page was hosted here.
if (SAME_ORIGIN_ENDPOINT && (!ui.endpoint.value.trim() || ui.endpoint.value.trim() === DEFAULT_ENDPOINT)) {
  ui.endpoint.value = SAME_ORIGIN_ENDPOINT;
}
ui.image.checked = localStorage.getItem('ummweb.image') === '1';
ui.audio.checked = localStorage.getItem('ummweb.audio') === '1';
ui.video.checked = localStorage.getItem('ummweb.video') === '1';
const saveSettings = () => {
  for (const key of SETTINGS) localStorage.setItem('ummweb.' + key, ui[key].value);
  localStorage.setItem('ummweb.image', ui.image.checked ? '1' : '0');
  localStorage.setItem('ummweb.audio', ui.audio.checked ? '1' : '0');
  localStorage.setItem('ummweb.video', ui.video.checked ? '1' : '0');
};

function apiURL(base, suffix) {
  const url = new URL(base.trim());
  if (url.protocol !== 'http:' && url.protocol !== 'https:') {
    throw new Error('Base URL must use http or https.');
  }
  if (url.username || url.password || url.search || url.hash) {
    throw new Error('Use a base URL without credentials, query, or fragment.');
  }
  let path = url.pathname.replace(/\/+$/, '');
  if (!path) path = '/v1';
  url.pathname = path + suffix;
  return url;
}

function authHeaders(extra = {}) {
  const headers = { ...extra };
  const key = ui.apiKey.value.trim();
  if (key) headers.Authorization = 'Bearer ' + key;
  return headers;
}

async function discoverModel() {
  try {
    const res = await fetch(apiURL(ui.endpoint.value, '/models'), { headers: authHeaders() });
    if (!res.ok) return;
    const data = await res.json();
    const id = data?.data?.[0]?.id;
    if (typeof id === 'string' && id &&
        (!ui.model.value.trim() || ui.model.value.trim() === DEFAULT_MODEL)) {
      ui.model.value = id;
      saveSettings();
    }
  } catch { /* best-effort model discovery */ }
}
discoverModel();
ui.endpoint.addEventListener('change', discoverModel);

function readFileAsDataURL(input) {
  const file = input.files && input.files[0];
  if (!file) return Promise.resolve('');
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
    reader.onerror = () => reject(new Error('Failed to read selected file.'));
    reader.readAsDataURL(file);
  });
}

function encodeBase64(bytes) {
  let binary = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

function encodeWavPcm16Mono(samples, sampleRate) {
  const len = samples.length;
  const buf = new ArrayBuffer(44 + len * 2);
  const view = new DataView(buf);
  const str = (off, s) => { for (let i = 0; i < s.length; i += 1) view.setUint8(off + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); view.setUint32(4, 36 + len * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  str(36, 'data'); view.setUint32(40, len * 2, true);
  for (let i = 0; i < len; i += 1) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Uint8Array(buf);
}

function resampleMono(samples, fromRate, toRate) {
  if (fromRate === toRate) return samples;
  const outLen = Math.max(1, Math.round(samples.length * toRate / fromRate));
  const out = new Float32Array(outLen);
  const ratio = fromRate / toRate;
  for (let i = 0; i < outLen; i += 1) {
    const pos = i * ratio;
    const idx = Math.floor(pos);
    const frac = pos - idx;
    const a = samples[idx] ?? 0;
    const b = samples[Math.min(idx + 1, samples.length - 1)] ?? a;
    out[i] = a + (b - a) * frac;
  }
  return out;
}

async function decodeAudioToWav16kBase64(arrayBuffer) {
  const ctx = new AudioContext();
  try {
    const audioBuf = await ctx.decodeAudioData(arrayBuffer.slice(0));
    const len = audioBuf.length;
    const mono = new Float32Array(len);
    for (let c = 0; c < audioBuf.numberOfChannels; c += 1) {
      const ch = audioBuf.getChannelData(c);
      for (let i = 0; i < len; i += 1) mono[i] += ch[i] / audioBuf.numberOfChannels;
    }
    const pcm16k = resampleMono(mono, audioBuf.sampleRate, 16000);
    return encodeBase64(encodeWavPcm16Mono(pcm16k, 16000));
  } finally {
    ctx.close().catch(() => {});
  }
}

// ---------- multimodal composer attachments ----------

let attachedImage = null; // { name, dataURL }
let attachedAudio = null; // { name, wavBase64 }
let micState = null;      // { stream, ctx, src, proc, chunks, sampleRate }

function renderAttachments() {
  ui.attachBar.replaceChildren();
  const addChip = (label, onRemove) => {
    const chip = document.createElement('span');
    chip.className = 'attach-chip';
    chip.append(document.createTextNode(label));
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '×';
    btn.addEventListener('click', onRemove);
    chip.append(btn);
    ui.attachBar.append(chip);
  };
  if (attachedImage) {
    addChip(`Image: ${attachedImage.name}`, () => {
      attachedImage = null; ui.askImage.value = ''; renderAttachments();
    });
  }
  if (attachedAudio) {
    addChip(`Audio (16k WAV): ${attachedAudio.name}`, () => {
      attachedAudio = null; ui.askAudio.value = ''; renderAttachments();
    });
  }
  ui.attachBar.hidden = !attachedImage && !attachedAudio;
}

ui.pickImage.addEventListener('click', () => ui.askImage.click());
ui.askImage.addEventListener('change', async () => {
  const file = ui.askImage.files?.[0];
  if (!file) return;
  try {
    const dataURL = await readFileAsDataURL(ui.askImage);
    attachedImage = { name: file.name, dataURL };
    renderAttachments();
  } catch (err) { showError(err.message); }
});

ui.pickAudio.addEventListener('click', () => ui.askAudio.click());
ui.askAudio.addEventListener('change', async () => {
  const file = ui.askAudio.files?.[0];
  if (!file) return;
  try {
    setStatus('Converting audio to 16 kHz WAV…', false);
    const wavBase64 = await decodeAudioToWav16kBase64(await file.arrayBuffer());
    attachedAudio = { name: file.name, wavBase64 };
    renderAttachments();
    setStatus('Ready', false);
  } catch (err) { showError('Audio decode failed: ' + err.message); }
});

ui.mic.addEventListener('click', async () => {
  if (micState) {
    const st = micState;
    micState = null;
    ui.mic.classList.remove('recording');
    ui.mic.textContent = 'Mic';
    st.proc.disconnect();
    st.src.disconnect();
    st.stream.getTracks().forEach((t) => t.stop());
    const total = st.chunks.reduce((n, c) => n + c.length, 0);
    const merged = new Float32Array(total);
    let off = 0;
    for (const c of st.chunks) { merged.set(c, off); off += c.length; }
    st.ctx.close().catch(() => {});
    if (total > 0) {
      const pcm16k = resampleMono(merged, st.sampleRate, 16000);
      const sec = (pcm16k.length / 16000).toFixed(1);
      attachedAudio = { name: `mic-${sec}s.wav`, wavBase64: encodeBase64(encodeWavPcm16Mono(pcm16k, 16000)) };
      renderAttachments();
      setStatus(`Recorded ${sec}s`, false);
    } else {
      setStatus('Ready', false);
    }
    return;
  }
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Microphone requires localhost/127.0.0.1 or HTTPS.');
    }
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    proc.onaudioprocess = (e) => { chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
    src.connect(proc);
    proc.connect(ctx.destination);
    micState = { stream, ctx, src, proc, chunks, sampleRate: ctx.sampleRate };
    ui.mic.classList.add('recording');
    ui.mic.textContent = 'Stop Mic';
    setStatus('Recording… click Stop Mic when done', true);
  } catch (err) {
    showError('Microphone error: ' + err.message);
  }
});

// ---------- state ----------

let running = false;
let stopped = false;
let controller = null;
let sessionID = '';
let turn = null;          // current assistant turn
let inflight = new Map(); // artifact_id -> partial chunks
const history = [];       // completed {role, content} pairs

function newSessionID() {
  const bytes = crypto.getRandomValues(new Uint8Array(8));
  return 'ummweb-' + [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('');
}

// ChatClient.chatURL: strip trailing slashes, default /v1, append the route.
function chatURL(base) {
  return apiURL(base, '/chat/completions');
}

// ---------- view helpers ----------

function setStatus(text, busy = running) {
  ui.status.textContent = text;
  ui.dot.classList.toggle('busy', busy);
}

function showError(text) {
  ui.error.textContent = text;
  ui.error.hidden = false;
}

function clearError() {
  ui.error.hidden = true;
  ui.error.textContent = '';
}

function addTurn(role, text) {
  const el = document.createElement('div');
  el.className = 'turn ' + role;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = role === 'user' ? 'You' : 'ummInfer';
  const body = document.createElement('div');
  body.className = 'body';
  const textEl = document.createElement('div');
  textEl.className = 'text';
  textEl.textContent = text;
  const asrEl = document.createElement('div');
  asrEl.className = 'asr-note';
  const artifacts = document.createElement('div');
  artifacts.className = 'artifacts';
  const legs = document.createElement('div');
  legs.className = 'legs';
  body.append(asrEl, textEl, artifacts, legs);
  el.append(meta, body);
  ui.transcript.append(el);
  scrollToEnd();
  return { el, asrEl, textEl, artifacts, legs, text };
}

function scrollToEnd() {
  ui.transcript.scrollTop = ui.transcript.scrollHeight;
}

function appendText(delta) {
  if (!turn) return;
  if (!turn.text) setStatus('Streaming…');
  turn.text += delta;
  turn.textEl.textContent = turn.text;
  scrollToEnd();
}

// ---------- streaming PCM16 playback ----------
// One AudioContext per turn. Chunks are scheduled back to back on a running
// cursor instead of starting a fresh source per chunk, so the waveform stays
// continuous. A short jitter buffer avoids an immediate starve.

const player = {
  ctx: null, next: 0, started: false, ended: false,
  pending: [], buffered: 0, sources: 0,

  begin(wave) {
    this.stop();
    waveEl = wave;
    this.ctx = new AudioContext();
    this.next = 0; this.started = false; this.ended = false;
    this.pending = []; this.buffered = 0; this.sources = 0;
  },

  push(bytes, rate, channels) {
    if (!this.ctx || this.ended) return;
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    const buffer = pcmBuffer(this.ctx, bytes, rate, channels);
    if (!buffer) { log('pcm: rejected', bytes.length, rate, channels); return; }
    this.pending.push(buffer);
    this.buffered += buffer.duration;
    if (!this.started && this.buffered >= 0.3) {
      this.started = true;
      this.next = this.ctx.currentTime + 0.1;
      setPlaying(true);
    }
    if (this.started) this.drain();
  },

  drain() {
    const ctx = this.ctx;
    for (const buffer of this.pending) {
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(ctx.destination);
      const at = Math.max(this.next, ctx.currentTime + 0.02);
      source.start(at);
      this.next = at + buffer.duration;
      log('pcm: schedule', buffer.duration.toFixed(3) + 's', 'at', at.toFixed(3));
      this.sources += 1;
      source.onended = () => {
        this.sources -= 1;
        if (this.sources === 0 && this.ended) this.finish();
      };
    }
    this.pending = [];
    this.buffered = 0;
  },

  end() {
    this.ended = true;
    if (!this.started && this.pending.length) {
      this.started = true;
      this.next = this.ctx.currentTime + 0.05;
      setPlaying(true);
      this.drain();
    }
    if (this.sources === 0) this.finish();
  },

  finish() {
    setPlaying(false);
    this.ctx?.close().catch(() => {});
    this.ctx = null;
  },

  stop() {
    this.ended = true;
    setPlaying(false);
    this.pending = [];
    this.buffered = 0;
    this.sources = 0;
    this.ctx?.close().catch(() => {});
    this.ctx = null;
  },
};

// The wave belongs to the turn that owns this audio, not to the module-level
// `turn`, which is cleared when the request ends while playback continues.
let waveEl = null;

function setPlaying(active) {
  if (!waveEl) return;
  waveEl.classList.toggle('playing', active);
}

function pcmBuffer(ctx, bytes, rate, channels) {
  const frameBytes = channels * 2;
  if (!bytes.length || bytes.length % frameBytes !== 0) return null;
  if (!(rate > 0) || channels < 1 || channels > 8) return null;
  const frames = bytes.length / frameBytes;
  const buffer = ctx.createBuffer(channels, frames, rate);
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  for (let c = 0; c < channels; c += 1) {
    const out = buffer.getChannelData(c);
    for (let i = 0, offset = c * 2; i < frames; i += 1, offset += frameBytes) {
      out[i] = view.getInt16(offset, true) / 32768;
    }
  }
  return buffer;
}

// ---------- artifacts (UnifiedStream.swift ArtifactCollector) ----------

function decodeBase64(text) {
  const binary = atob(text);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function sha256Hex(bytes) {
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
  return [...digest].map((b) => b.toString(16).padStart(2, '0')).join('');
}

async function ingestArtifact(chunk) {
  if (!chunk || typeof chunk !== 'object') throw new Error('Artifact is missing.');
  if (chunk.encoding !== 'base64') throw new Error('Artifact encoding must be base64.');
  if (!(chunk.total >= 1) || !(chunk.index >= 0) || chunk.index >= chunk.total) {
    throw new Error('Artifact chunk index is out of range.');
  }
  let slot = inflight.get(chunk.artifact_id);
  if (!slot) {
    slot = { mime: chunk.mime_type, total: chunk.total, parts: [] };
    inflight.set(chunk.artifact_id, slot);
  }
  if (slot.total !== chunk.total) throw new Error('Artifact total changed between chunks.');
  slot.parts[chunk.index] = decodeBase64(chunk.data);
  if (chunk.index + 1 < chunk.total) return;

  inflight.delete(chunk.artifact_id);
  const size = slot.parts.reduce((n, part) => n + part.length, 0);
  const bytes = new Uint8Array(size);
  let offset = 0;
  for (const part of slot.parts) { bytes.set(part, offset); offset += part.length; }
  if (chunk.bytes != null && chunk.bytes !== bytes.length) {
    throw new Error(`Artifact ${chunk.artifact_id} has ${bytes.length} bytes, not ${chunk.bytes}.`);
  }
  if (chunk.sha256 && crypto.subtle) {
    const digest = await sha256Hex(bytes);
    if (digest !== chunk.sha256.toLowerCase()) {
      throw new Error(`Artifact ${chunk.artifact_id} failed its sha256 check.`);
    }
  }
  deliver(chunk, bytes);
}

function deliver(chunk, bytes) {
  const mime = chunk.mime_type;
  log('artifact', chunk.artifact_id, mime, bytes.length + ' bytes');
  if (mime === 'audio/pcm') {
    player.push(bytes, chunk.sample_rate ?? 24000, chunk.channels ?? 1);
    return;
  }
  const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
  const wrapCard = (node, filename) => {
    const card = document.createElement('div');
    card.className = 'artifact-card';
    card.append(node);
    const dl = document.createElement('a');
    dl.className = 'dl';
    dl.href = url;
    dl.download = filename;
    dl.textContent = `Download ${filename} (${(bytes.length / 1024).toFixed(1)} KB)`;
    card.append(dl);
    turn.artifacts.append(card);
  };
  if (chunk.media_type === 'image') {
    const link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener';
    const img = document.createElement('img');
    img.src = url;
    img.alt = 'Generated image';
    link.append(img);
    wrapCard(link, 'image.png');
  } else if (mime === 'audio/wav') {
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.src = url;
    wrapCard(audio, 'speech.wav');
  } else if (mime === 'video/mp4') {
    const video = document.createElement('video');
    video.controls = true;
    video.src = url;
    wrapCard(video, 'video.mp4');
  } else {
    const note = document.createElement('div');
    note.className = 'legs';
    note.textContent = `Unsupported artifact ${mime}`;
    turn.artifacts.append(note);
  }
  scrollToEnd();
}

// ---------- SSE ----------

async function* readLines(res) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let rest = '';
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      rest += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = rest.indexOf('\n')) >= 0) {
        let line = rest.slice(0, cut);
        rest = rest.slice(cut + 1);
        if (line.endsWith('\r')) line = line.slice(0, -1);
        yield line;
      }
      if (rest.length > 4 * 1024 * 1024) throw new Error('An SSE line exceeds 4 MiB.');
    }
    rest += decoder.decode();
    if (rest) yield rest.replace(/\r$/, '');
  } finally {
    reader.cancel().catch(() => {});
  }
}

function errorDetail(root) {
  if (typeof root.error === 'string') return root.error;
  if (root.error && typeof root.error === 'object') {
    return [root.error.type, root.error.code, root.error.message]
      .filter((v) => typeof v === 'string' && v).join(': ') || 'no error detail';
  }
  return typeof root.message === 'string' && root.message ? root.message : 'no error detail';
}

async function consume(payload, st) {
  if (payload === '[DONE]') { st.done = true; return; }
  let root;
  try { root = JSON.parse(payload); } catch { throw new Error('An SSE event is not JSON.'); }
  if (root.error != null) throw new Error(errorDetail(root));

  const unified = root.unified;
  if (unified != null) {
    if (st.terminal) throw new Error('A unified event follows the terminal event.');
    if (unified.seq !== st.seq) {
      throw new Error(`Unified seq ${unified.seq} arrived, expected ${st.seq}.`);
    }
    st.seq += 1;
    st.sawUnified = true;
    if (unified.session_id) st.sessionID = unified.session_id;
    log('event', unified.kind, unified.seq, unified.stage);
    switch (unified.kind) {
      case 'asr_final':
        if (unified.text) turn.asrEl.textContent = `ASR: ${unified.text}`;
        break;
      case 'artifact': await ingestArtifact(unified.artifact); break;
      case 'leg_error':
        turn.legs.textContent = `${unified.stage} output: ${unified.error || 'failed'}`;
        break;
      case 'complete': st.terminal = 1; break;
      case 'error': st.terminal = 1; throw new Error(unified.error || 'The request failed.');
      case 'cancelled': {
        st.terminal = 1;
        const err = new Error('The server cancelled the request.');
        err.cancelled = true;
        throw err;
      }
      default: break;
    }
  }

  const choice = Array.isArray(root.choices) ? root.choices[0] : null;
  if (choice?.delta && typeof choice.delta.content === 'string' && choice.delta.content) {
    st.text += choice.delta.content;
    appendText(choice.delta.content);
  }
  if (choice?.finish_reason) st.finish = choice.finish_reason;
}

// ---------- send / stop ----------

function setBusy(busy) {
  running = busy;
  ui.send.hidden = busy;
  ui.stop.hidden = !busy;
  for (const control of [
    ui.endpoint, ui.model, ui.image, ui.audio, ui.video, ui.voice, ui.maxTokens,
    ui.temperature, ui.topP, ui.seed, ui.apiKey, ui.imageSize, ui.imageSteps,
    ui.imageFile, ui.refAudio, ui.videoSize, ui.videoSeconds,
    ui.videoFrames, ui.videoSteps, ui.videoGuidance, ui.pickImage,
    ui.pickAudio, ui.mic, ui.newChat]) {
    control.disabled = busy;
  }
  ui.dot.classList.toggle('busy', busy);
}

async function send() {
  if (running) return;
  const text = ui.prompt.value.trim();
  if (!text && !attachedImage && !attachedAudio) {
    setStatus('Input required', false); ui.prompt.focus(); return;
  }

  let url;
  let model;
  try {
    url = chatURL(ui.endpoint.value);
    model = ui.model.value.trim();
    if (!model) throw new Error('Model is required.');
  } catch (err) { showError(err.message); return; }

  saveSettings();
  if (!sessionID) sessionID = newSessionID();

  let userContent;
  if (attachedImage || attachedAudio) {
    const parts = [];
    if (text) parts.push({ type: 'text', text });
    if (attachedImage) parts.push({ type: 'image_url', image_url: { url: attachedImage.dataURL } });
    if (attachedAudio) parts.push({ type: 'input_audio', input_audio: { data: attachedAudio.wavBase64, format: 'wav' } });
    userContent = parts;
  } else {
    userContent = text;
  }

  const maxTokVal = Number.parseInt(ui.maxTokens.value.trim(), 10);
  const tempVal = Number(ui.temperature.value);
  const body = {
    model,
    messages: [{ role: 'user', content: userContent }],
    max_tokens: Number.isInteger(maxTokVal) && maxTokVal > 0 ? maxTokVal : 256,
    temperature: Number.isFinite(tempVal) && tempVal >= 0 ? tempVal : 0,
    stream: true,
    session_id: sessionID,
  };
  if (history.length > 0) body.session_history = true;
  if (ui.topP.value.trim() !== '') {
    const topPVal = Number(ui.topP.value);
    if (Number.isFinite(topPVal) && topPVal > 0 && topPVal <= 1) body.top_p = topPVal;
  }
  if (ui.seed.value.trim() !== '') {
    const seedVal = Number.parseInt(ui.seed.value.trim(), 10);
    if (Number.isInteger(seedVal)) body.seed = seedVal;
  }
  const modalities = ['text'];
  if (ui.image.checked) {
    modalities.push('image');
    body.image = { size: ui.imageSize.value || '512x512', output_format: 'png' };
    if (ui.imageSteps.value.trim() !== '') {
      const stepsVal = Number.parseInt(ui.imageSteps.value.trim(), 10);
      if (Number.isInteger(stepsVal) && stepsVal > 0) body.image.steps = stepsVal;
    }
    const editImageUrl = await readFileAsDataURL(ui.imageFile);
    if (editImageUrl) body.image.image = editImageUrl;
  }
  if (ui.audio.checked) {
    modalities.push('audio');
    body.audio = { voice: ui.voice.value.trim() || 'vivian', format: 'wav' };
    const refAudioUrl = await readFileAsDataURL(ui.refAudio);
    if (refAudioUrl) body.audio.ref_audio = refAudioUrl;
    // Only audio-only turns stream PCM; mixed image/video turns keep single WAV.
    if (!ui.image.checked && !ui.video.checked) body.audio.stream = true;
  }
  if (ui.video.checked) {
    modalities.push('video');
    body.video = { size: ui.videoSize.value || '480x320', output_format: 'mp4' };
    const secVal = Number.parseInt(ui.videoSeconds.value.trim(), 10);
    if (Number.isInteger(secVal) && secVal > 0) body.video.seconds = secVal;
    if (ui.videoFrames.value.trim() !== '') {
      const frVal = Number.parseInt(ui.videoFrames.value.trim(), 10);
      if (Number.isInteger(frVal) && frVal > 0) body.video.num_frames = frVal;
    }
    if (ui.videoSteps.value.trim() !== '') {
      const vsVal = Number.parseInt(ui.videoSteps.value.trim(), 10);
      if (Number.isInteger(vsVal) && vsVal > 0) body.video.steps = vsVal;
    }
    if (ui.videoGuidance.value.trim() !== '') {
      const cfgVal = Number(ui.videoGuidance.value);
      if (Number.isFinite(cfgVal) && cfgVal >= 0) body.video.guidance_scale = cfgVal;
    }
  }
  if (modalities.length > 1) body.modalities = modalities;

  const userLabel = [
    text,
    attachedImage ? `[Image: ${attachedImage.name}]` : '',
    attachedAudio ? `[Audio: ${attachedAudio.name}]` : '',
  ].filter(Boolean).join(' ');
  const sentImage = attachedImage;
  attachedImage = null; ui.askImage.value = '';
  attachedAudio = null; ui.askAudio.value = '';
  renderAttachments();

  ui.prompt.value = '';
  clearError();
  stopped = false;
  inflight = new Map();
  setBusy(true);
  setStatus('Connecting…');
  const userTurn = addTurn('user', userLabel);
  if (sentImage) {
    const thumb = document.createElement('img');
    thumb.src = sentImage.dataURL;
    thumb.alt = sentImage.name;
    userTurn.artifacts.append(thumb);
  }
  turn = addTurn('assistant', '');
  turn.textEl.classList.add('caret');
  waveEl = document.createElement('div');
  waveEl.className = 'wave';
  waveEl.hidden = !ui.audio.checked;
  waveEl.innerHTML = '<i></i><i></i><i></i><i></i><i></i>';
  turn.el.querySelector('.body').append(waveEl);
  if (ui.audio.checked) player.begin(waveEl);

  controller = new AbortController();
  const st = { seq: 0, terminal: 0, sawUnified: false, done: false, text: '', finish: '', sessionID };
  log('request', url.href, JSON.stringify({ ...body, messages: '[redacted media]' }));

  try {
    let res = await fetch(url, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json', Accept: 'text/event-stream' }),
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    if (res.status === 400 && body.session_history) {
      delete body.session_history;
      res = await fetch(url, {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Accept: 'text/event-stream' }),
        body: JSON.stringify(body),
        signal: controller.signal,
      });
    }
    if (!res.ok) {
      const detail = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}: ${limit(detail)}`);
    }
    const type = (res.headers.get('content-type') || '').split(';')[0].trim().toLowerCase();
    if (type !== 'text/event-stream') {
      throw new Error(`Expected text/event-stream, got ${type || 'no content type'}.`);
    }

    // One data line carries one event (docs/mixed-output-contract.md), the same
    // flush rule ChatClient.SSEParser uses.
    for await (const line of readLines(res)) {
      if (!line.startsWith('data:')) continue;
      let payload = line.slice(5);
      if (payload.startsWith(' ')) payload = payload.slice(1);
      await consume(payload, st);
      if (st.done) break;
    }

    if (!st.done) throw new Error('The stream ended before [DONE].');
    if (st.sawUnified && st.terminal !== 1) {
      throw new Error('The unified stream ended without a terminal event.');
    }
    if (inflight.size) throw new Error('An artifact stream ended before its final chunk.');

    if (st.sessionID) {
      sessionID = st.sessionID;
      ui.session.hidden = false;
      ui.session.textContent =
        'session ' + sessionID.replace(/^ummweb-/, '').slice(0, 8);
      ui.session.title = sessionID;
    }
    history.push({ role: 'user', content: userLabel });
    history.push({ role: 'assistant', content: st.text });
    turn.textEl.classList.remove('caret');
    player.end();
    setStatus(st.finish ? `Completed · ${st.finish}` : 'Completed');
    setBusy(false);
  } catch (err) {
    player.stop();
    const aborted = stopped || err.name === 'AbortError' || err.cancelled;
    turn.textEl.classList.remove('caret');
    setBusy(false);
    if (aborted) {
      setStatus('Stopped');
      if (!turn.text && !turn.artifacts.childElementCount) turn.el.remove();
    } else {
      setStatus('Error');
      let msg = err.message || String(err);
      if (/failed to fetch/i.test(msg)) {
        msg = `Failed to fetch ${url.href} — check that Base URL matches this page's host/port (${location.origin}/v1) and the server is reachable.`;
      }
      showError(msg);
    }
    log('failed', err.message);
  } finally {
    controller = null;
    turn = null;
  }
}

function limit(text) {
  const trimmed = String(text || '').trim();
  return trimmed.length > 300 ? trimmed.slice(0, 300) + '…' : (trimmed || 'no error detail');
}

ui.send.addEventListener('click', send);
ui.stop.addEventListener('click', () => {
  if (!running) return;
  stopped = true;
  setStatus('Stopping…');
  controller?.abort();
});
ui.prompt.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
    event.preventDefault();
    send();
  }
});
ui.newChat.addEventListener('click', () => {
  if (running) return;
  history.length = 0;
  ui.transcript.replaceChildren();
  sessionID = '';
  ui.session.hidden = true;
  clearError();
  setStatus('Ready', false);
});
</script>
</body>
</html>
