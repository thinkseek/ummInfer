      if (!isPlainObject(rawReference)) throw new Error(`${label}.visual_reference must be an object.`);
      const slotId = parseOptionalStringField(rawReference, 'slot_id', `${label}.visual_reference`);
      const referenceSha = parseOptionalStringField(rawReference, 'sha256', `${label}.visual_reference`);
      if (!slotId || (referenceSha && !/^[0-9a-f]{64}$/i.test(referenceSha))) {
        throw new Error(`${label}.visual_reference requires a slot id and valid optional SHA-256.`);
      }
      visualReference = {
        slot_id: slotId,
        sha256: referenceSha ? referenceSha.toLowerCase() : null,
        source_attached: rawReference.source_attached === true,
        edit_source_attached: rawReference.edit_source_attached === true,
      };
    }
    const narrativeEvents = isReplay && Array.isArray(rawTurn.narrative_events)
      ? JSON.parse(JSON.stringify(rawTurn.narrative_events)) : [];
    const mediaArtifacts = isReplay && Array.isArray(rawTurn.media_artifacts)
      ? JSON.parse(JSON.stringify(rawTurn.media_artifacts)) : [];
    const replay = isReplay && rawTurn.replay !== undefined && rawTurn.replay !== null
      ? parseImportedReplay(rawTurn.replay, label) : null;
    const directRenders = isReplay && Array.isArray(rawTurn.direct_renders)
      ? rawTurn.direct_renders.map((record, replayIndex) => parseDirectRenderRecord(record, label, replayIndex)) : [];

    turns.push({
      index: i + 1,
      role: resolvedRole,
      prompt,
      response,
      asr_text: asrText,
      interrupted,
      spoken_bytes: spokenBytes,
      visual_slots: visualSlots,
      telemetry,
      outcome,
      terminal,
      visual_reference: visualReference,
      narrative_events: narrativeEvents,
      media_artifacts: mediaArtifacts,
      direct_renders: directRenders,
      replay,
    });
  }

  return {
    schema: root.schema,
    sourceClient: root.schema === 'umminfer-session-export-v1' ? 'ummmlx' : 'web',
    exported_at: exportedAt,
    session_id: sessionId,
    model,
    turn_count: turns.length,
    turns,
    video_frame_selection: frameSelection,
  };
}

function formatImportedSessionChip(sessionId) {
  if (typeof sessionId === 'string' && sessionId.trim()) {
    const cleaned = sanitizeSessionIdForFilename(sessionId)
      .replace(/^umm(?:web|mlx)-/, '')
      .slice(0, 8);
    return {
      text: `imported ${cleaned || 'local'}`,
      title: `Imported session (${sessionId.trim()})`,
    };
  }
  return {
    text: 'imported local',
    title: 'Imported session (local)',
  };
}

function applyImportedSessionWithContext(parsed, ctx) {
  if (!isPlainObject(parsed) || !Array.isArray(parsed.turns)) {
    throw new Error('Parsed session payload is invalid.');
  }
  if (ctx.isBusy()) {
    throw new Error('Cannot import a session while a response is streaming.');
  }
  ctx.stopActiveAudio?.();
  ctx.resetState(parsed.session_id || '');
  ctx.applyVideoFrameSelection?.(parsed.video_frame_selection);
  ctx.clearTranscript();
  ctx.clearError?.();

  for (const item of parsed.turns) {
    let userTurn = null;
    let assistantTurn = null;
    const hasUser = Boolean(item.prompt) || (item.role === 'user' && !item.response &&
      !item.asr_text && !item.interrupted && item.visual_slots.length === 0 && !item.telemetry);
    const hasAssistant = Boolean(item.response) || Boolean(item.asr_text) ||
      item.interrupted === true || item.visual_slots.length > 0 ||
      item.telemetry !== null || item.role === 'assistant' || Boolean(item.outcome) || Boolean(item.replay);

    if (hasUser) {
      userTurn = ctx.addTurn('user', item.prompt);
      userTurn.visualReference = item.visual_reference || null;
    }
    if (hasAssistant) {
      assistantTurn = ctx.addTurn('assistant', '');
      assistantTurn.outcome = item.outcome || null;
      assistantTurn.terminal = item.terminal || null;
      assistantTurn.events = item.narrative_events || [];
      assistantTurn.mediaArtifacts = item.media_artifacts || [];
      assistantTurn.directRenders = item.direct_renders || [];
      assistantTurn.requestId = item.terminal?.request_id || '';
      if (item.replay) assistantTurn.rawChunks = item.replay.chunks;
      if (item.asr_text) {
        assistantTurn.asrText = item.asr_text;
        assistantTurn.asrEl.textContent = `ASR: ${item.asr_text}`;
      }
      if (item.response) {
        assistantTurn.text = item.response;
        ctx.renderAssistantText(assistantTurn, item.response);
      }
      for (let j = 0; j < item.visual_slots.length; j += 1) {
        const slotMeta = item.visual_slots[j];
        ctx.addImportedVisualSlot(assistantTurn, slotMeta, j);
      }
      if (item.direct_renders?.length) applyDirectRenders(assistantTurn);
      if (item.replay) ctx.addReplayControl?.(assistantTurn);
      if (item.interrupted === true) {
        assistantTurn.interrupted = true;
        assistantTurn.spokenBytes = item.spoken_bytes;
        const badgeText = formatInterruptedBadge(item.spoken_bytes) || 'Interrupted';
        ctx.attachInterruptedBadge(assistantTurn, item.spoken_bytes, badgeText);
      }
      if (item.telemetry !== null) {
        assistantTurn.telemetry = item.telemetry;
        ctx.renderTelemetry(assistantTurn);
      }
    }
    ctx.recordTurn(userTurn, assistantTurn, item.prompt, item.response, item.outcome);
  }

  const chip = formatImportedSessionChip(parsed.session_id);
  ctx.setSessionChip(chip);
  ctx.syncUI();
  const sourceTag = parsed.sourceClient === 'ummmlx' ? ' · macOS ummmlx' : '';
  const turnLabel = parsed.turns.length === 1 ? '1 turn' : `${parsed.turns.length} turns`;
  ctx.setStatus(`Imported ${turnLabel}${sourceTag}`, false);
  return {
    turnCount: parsed.turns.length,
    schema: parsed.schema,
    sourceClient: parsed.sourceClient,
    sessionId: parsed.session_id,
    chip,
  };
}
// SESSION_IMPORT_END

function applyImportedSession(parsed) {
  return applyImportedSessionWithContext(parsed, {
    isBusy: () => running || Boolean(realtime.activeResponseId) || Boolean(micState),
    stopActiveAudio() {
      stopRealtime();
      player.stop();
    },
    resetState(nextSessionId) {
      clearComposerAndSessionResources();
      stopped = false;
      inflight = new Map();
      turn = null;
      history.length = 0;
      sessionTurns.length = 0;
      sessionID = nextSessionId;
    },
    applyVideoFrameSelection(selection) {
      applyVideoFrameSelectionToControls(ui, selection);
      videoFrameBudgetPersistenceError = null;
      saveSettings();
      syncVideoFrameControls();
    },
    clearTranscript() {
      ui.transcript.replaceChildren(ui.emptyState);
    },
    clearError,
    addTurn,
    renderAssistantText(assistantTurn, text) {
      const block = document.createElement('div');
      block.className = 'block text md';
      block._raw = text;
      renderMarkdownInto(block, text);
      assistantTurn.flow.append(block);
    },
    addImportedVisualSlot(assistantTurn, slotMeta, idx) {
      const continuity = visualSlotContinuityBadge(slotMeta);
      const slot = createSlot(slotMeta.id, slotMeta.prompt || '', slotMeta.kind, continuity);
      slot.slotIndex = slotMeta.slot_index;
      slot.continuityMeta = {
        continuity_mode: slotMeta.continuity_mode || '',
        anchor_slot_index: slotMeta.anchor_slot_index,
        anchor_explicit: slotMeta.anchor_explicit === true,
        anchor_sha256: slotMeta.anchor_sha256 || '',
      };
      slot.bytes = slotMeta.bytes;
      slot.sha256 = slotMeta.sha256 || '';
      for (const variant of slotMeta.variants || []) {
        slot.artifactMeta[variant.kind] = { ...variant };
        if (variant.kind === 'image') slot.imageSha256 = variant.sha256;
      }
      slot.terminalState = slotMeta.terminal_state || null;
      if (slotMeta.error) {
        showSlotError(slot, slotMeta.error);
      } else if (slotMeta.terminal_state === 'aborted') {
        showSlotCancelled(slot);
      } else {
        showSlotImportedMetadata(slot);
      }
      if (!slot.prompt) {
        slot.swap.disabled = true;
        slot.regen.disabled = true;
      }
      const key = assistantTurn.slots.has(slot.id) ? `${slot.id}-${idx}` : slot.id;
      assistantTurn.slots.set(key, slot);
      assistantTurn.flow.append(slot.el);
    },
    attachInterruptedBadge: attachRealtimeInterruptedBadge,
    renderTelemetry: renderTurnTelemetry,
    recordTurn(userTurn, assistantTurn, promptText, responseText, outcome) {
      sessionTurns.push({ userTurn, assistantTurn });
      if (promptText) history.push({ role: 'user', content: promptText });
      if (responseText && outcome !== 'cancelled' && outcome !== 'error') {
        history.push({ role: 'assistant', content: responseText });
      }
    },
    addReplayControl(assistantTurn) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'replay-turn';
      button.textContent = 'Replay raw SSE';
      button.setAttribute('aria-label', 'Replay this response locally from verified raw SSE');
      button.addEventListener('click', () => replaySessionTurn(assistantTurn));
      assistantTurn.legs.append(button);
    },
    setSessionChip(chip) {
      ui.session.hidden = false;
      ui.session.textContent = chip.text;
      ui.session.title = chip.title;
    },
    syncUI: syncEmptyState,
    setStatus,
  });
}

async function replaySessionTurn(targetTurn, { playAudio = true } = {}) {
  if (running || !targetTurn?.rawChunks?.length) return false;
  const rawChunks = targetTurn.rawChunks.slice();
  const expectedEvents = canonicalJson(targetTurn.events || []);
  const originalOutcome = targetTurn.outcome || 'completed';
  const originalTerminal = targetTurn.terminal ? JSON.parse(JSON.stringify(targetTurn.terminal)) : null;
  const originalTelemetry = targetTurn.telemetry;
  const originalRequestId = targetTurn.requestId || targetTurn.terminal?.request_id || '';
  revokeTurnMedia(targetTurn);
  targetTurn.flow.replaceChildren();
  targetTurn.artifacts.replaceChildren();
  targetTurn.legs.replaceChildren();
  targetTurn.text = '';
  targetTurn.tailText = null;
  targetTurn.asrText = '';
  targetTurn.asrEl.textContent = '';
  targetTurn.slots = new Map();
  targetTurn.nonSlotVisuals = [];
  targetTurn.events = [];
  targetTurn.mediaArtifacts = [];
  targetTurn.completedArtifactIds = new Set();
  targetTurn.telemetry = null;
  targetTurn.terminal = null;
  targetTurn.outcome = null;
  targetTurn.requestId = originalRequestId;
  turn = targetTurn;
  stopped = false;
  inflight = new Map();
  controller = new AbortController();
  setBusy(true);
  setStatus('Replaying raw SSE locally…');
  const st = {
    seq: 0, terminal: 0, sawUnified: false, done: false, text: '', finish: '',
    sessionID, requestID: originalRequestId,
    behaviorRequested: false, behaviorEvidenceHeader: '',
  };
  let replaySucceeded = false;
  try {
    const rawBytes = concatRawChunks(rawChunks);
    const hasPcm = rawSsePayloads(rawBytes).some((payload) => {
      if (payload === '[DONE]') return false;
      try {
        const artifact = JSON.parse(payload).unified?.artifact;
        return artifact?.mime_type === 'audio/pcm';
      } catch { return false; }
    });
    if (hasPcm && playAudio) player.begin(ui.voiceWave);
    for await (const line of readLines(new Response(rawBytes))) {
      if (stopped) throw new DOMException('Replay stopped', 'AbortError');
      if (!line.startsWith('data:')) continue;
      let payload = line.slice(5);
      if (payload.startsWith(' ')) payload = payload.slice(1);
      try {
        await consume(payload, st);
      } catch (err) {
        if (!(originalOutcome === 'cancelled' && err.cancelled && !stopped)) throw err;
      }
      if (st.done) break;
    }
    if (!st.done && !['cancelled', 'error'].includes(originalOutcome)) throw new Error('Replay ended before [DONE].');
    if (st.sawUnified && st.terminal !== 1 && !['cancelled', 'error'].includes(originalOutcome)) {
      throw new Error('Replay ended without a unified terminal.');
    }
    if (inflight.size) throw new Error('Replay ended with an incomplete artifact.');
    if (['cancelled', 'error'].includes(originalOutcome) && !targetTurn.terminal) {
      settleTurnTerminal(targetTurn, originalOutcome === 'cancelled' ? 'cancelled' : 'error');
    }
    if (canonicalJson(targetTurn.events) !== expectedEvents) {
      throw new Error('Replayed narrative events diverge from the imported event index.');
    }
    applyDirectRenders(targetTurn);
    player.end();
    replaySucceeded = true;
    setStatus(`Replay ${targetTurn.outcome || originalOutcome}`, false);
  } catch (err) {
    player.stop();
    if (stopped || err.name === 'AbortError' || err.cancelled) {
      setStatus('Replay stopped · original outcome preserved', false);
    } else {
      showError(`Replay failed: ${err.message}`);
      setStatus('Replay failed', false);
    }
  } finally {
    if (!replaySucceeded) {
      targetTurn.terminal = originalTerminal;
      targetTurn.outcome = originalOutcome;
    }
    targetTurn.telemetry = originalTelemetry;
    renderTurnTelemetry(targetTurn);
    targetTurn.rawChunks = rawChunks;
    targetTurn.completedArtifactIds = new Set(targetTurn.mediaArtifacts.map((item) => item.artifact_id));
    controller = null;
    turn = null;
    inflight = new Map();
    stopped = false;
    setBusy(false);
    const entry = sessionTurns.find((item) => item.assistantTurn === targetTurn);
    if (entry && originalTelemetry) entry.assistantTurn.telemetry = originalTelemetry;
    const replayButton = document.createElement('button');
    replayButton.type = 'button';
    replayButton.className = 'replay-turn';
    replayButton.textContent = 'Replay raw SSE';
    replayButton.setAttribute('aria-label', 'Replay this response locally from verified raw SSE');
    replayButton.addEventListener('click', () => replaySessionTurn(targetTurn));
    targetTurn.legs.append(replayButton);
  }
  return true;
}

async function restoreImportedMedia() {
  for (const entry of sessionTurns) {
    const assistant = entry.assistantTurn;
    if (assistant?.rawChunks?.length) {
      await replaySessionTurn(assistant, { playAudio: false });
    } else if (assistant?.outcome === 'cancelled' && !assistant.text &&
               !assistant.slots?.size && !assistant.artifacts?.childElementCount) {
      // A client-side stop can precede all response bytes, so no replay object exists.
      assistant.legs.textContent = 'Cancelled before response output.';
    }
  }
}

function collectSessionExportState(exportedAt = new Date().toISOString()) {
  return {
    session_id: sessionID || '',
    model: ui.model.value.trim() || '',
    exported_at: exportedAt,
    video_frame_selection: parseVideoFrameSelection(
      ui.videoFramePolicy.value, ui.videoMotionThreshold.value,
      ui.videoSceneThreshold.value, ui.videoFrameBudget.value),
    turns: sessionTurns.map((entry) => {
      const u = entry.userTurn;
      const a = entry.assistantTurn;
      const slots = [];
      if (a?.slots) {
        for (const slot of a.slots.values()) {
          slots.push({
            id: slot.id,
            kind: slot.kind,
            slot_index: slot.slotIndex,
            prompt: slot.prompt || '',
            bytes: slot.bytes,
            sha256: slot.sha256,
            continuity_mode: slot.continuityMeta?.continuity_mode || '',
            anchor_slot_index: slot.continuityMeta?.anchor_slot_index,
            anchor_explicit: slot.continuityMeta?.anchor_explicit === true,
            anchor_sha256: slot.continuityMeta?.anchor_sha256 || '',
            error: slot.hasError ? (slot.error || 'Generation failed') : '',
            terminal_state: slot.terminalState || null,
            variants: Object.values(slot.artifactMeta || {}),
          });
        }
      }
      if (Array.isArray(a?.nonSlotVisuals)) {
        for (const visual of a.nonSlotVisuals) slots.push(visual);
      }
      const record = {
        prompt: u?.text || '',
        response: a?.text || '',
        visual_slots: slots,
        telemetry: a?.telemetry || null,
        visual_reference: u?.visualReference || null,
        outcome: a?.outcome || null,
        terminal: a?.terminal || null,
        events: a?.events || [],
        media_artifacts: a?.mediaArtifacts || [],
        raw_chunks: a?.rawChunks || [],
        raw_capture_error: a?.rawCaptureError || null,
        direct_renders: a?.directRenders || [],
      };
      if (a?.asrText) record.asr_text = a.asrText;
      if (a?.interrupted === true) {
        record.interrupted = true;
        if (parseNonNegativeCursor(a.spokenBytes) !== null) {
          record.spoken_bytes = a.spokenBytes;
        }
      }
      return record;
    }),
  };
}

function exportSession(format) {
  if (!canExportSession(sessionTurns.length, running)) return false;
  const normalized = format === 'replay' ? 'replay' : (format === 'markdown' || format === 'md' ? 'markdown' : 'json');
  const result = triggerSessionExportDownload(collectSessionExportState(), normalized);
  if (normalized === 'replay') {
    setStatus('Preparing verified replay archive…', false);
    result.then((download) => setStatus(`Exported ${download.filename}`, false))
      .catch((err) => {
        showError(`Replay export failed: ${err.message}`);
        setStatus('Replay export failed', false);
      });
    return true;
  }
  setStatus(`Exported ${result.filename}`, false);
  return true;
}

function openImportDialog() {
  if (running || realtime.enabled || realtime.activeResponseId || micState) {
    showError('Cannot import a session while a response, recording, or live voice session is active.');
    return false;
  }
  ui.importSessionInput.value = '';
  ui.importSessionInput.click();
  return true;
}

function hasActiveSlotRender() {
  return sessionTurns.some((entry) => [...(entry.assistantTurn?.slots?.values?.() || [])]
    .some((slot) => slot.loading || slot.renderController));
}

function revokeTurnMedia(targetTurn) {
  if (!targetTurn?.el) return;
  const urls = new Set();
  for (const slot of targetTurn.slots?.values?.() || []) {
    cancelSlotRender(slot);
    for (const url of [slot.url, ...Object.values(slot.cache || {})]) {
      if (typeof url === 'string' && url.startsWith('blob:')) urls.add(url);
    }
  }
  for (const node of targetTurn.el.querySelectorAll('img, audio, video, a')) {
    if (typeof node.pause === 'function') node.pause();
    for (const attr of ['src', 'href']) {
      const url = node.getAttribute(attr) || '';
      if (url.startsWith('blob:')) urls.add(url);
    }
  }
  for (const url of urls) URL.revokeObjectURL(url);
}

function clearComposerAndSessionResources() {
  for (const entry of sessionTurns) revokeTurnMedia(entry.assistantTurn);
  for (const media of ui.transcript.querySelectorAll('audio, video')) media.pause();
  if (micState) {
    const activeMic = micState;
    micState = null;
    activeMic.proc.disconnect();
    activeMic.src.disconnect();
    activeMic.stream.getTracks().forEach((track) => track.stop());
    activeMic.ctx.close().catch(() => {});
  }
  ui.mic.classList.remove('recording');
  ui.mic.textContent = 'Mic';
  attachedImage = null;
  attachedVideo = null;
  attachedAudio = null;
  revisionSource = null;
  ui.askImage.value = '';
  ui.askVideo.value = '';
  ui.askAudio.value = '';
  ui.imageFile.value = '';
  ui.refAudio.value = '';
  ui.prompt.value = '';
  renderAttachments();
}

function newChat() {
  if (running) return false;
  stopRealtime();
  player.stop();
  clearComposerAndSessionResources();
  turn = null;
  inflight = new Map();
  stopped = false;
  history.length = 0;
  sessionTurns.length = 0;
  ui.transcript.replaceChildren(ui.emptyState);
  syncEmptyState();
  sessionID = '';
  ui.session.hidden = true;
  applyVideoFrameSelectionToControls(ui, undefined);
  videoFrameBudgetPersistenceError = null;
  saveSettings();
  syncVideoFrameControls();
  clearError();
  setStatus('Ready', false);
  ui.prompt.focus();
  return true;
}

// KEYBOARD_SHORTCUTS_BEGIN
function resolveGlobalShortcutAction(event, state = {}) {
  if (!event || event.defaultPrevented || event.isComposing) {
    return null;
  }
  const key = typeof event.key === 'string' ? event.key : '';
  const code = typeof event.code === 'string' ? event.code : '';
  const lower = key.toLowerCase();
  const primary = Boolean(event.metaKey || event.ctrlKey);
  const alt = Boolean(event.altKey);
  const shift = Boolean(event.shiftKey);

  if (key === 'Escape' && !primary && !alt && !shift) {
    if (state && state.exportMenuOpen === true) return 'close_export_menu';
    if (state && state.isRunning === true) return 'stop_generation';
    return null;
  }

  if (primary && !alt && !shift && lower === 'e') {
    return 'export_json';
  }
  if (primary && !alt && shift && lower === 'e') {
    return 'export_markdown';
  }
  if (primary && !alt && !shift && lower === 'o') {
    return 'import_session';
  }
  if ((!primary && alt && !shift && (lower === 'n' || code === 'KeyN')) ||
      (primary && !alt && shift && (lower === 'k' || code === 'KeyK'))) {
    return 'new_chat';
  }

  return null;
}

function handleGlobalShortcut(event, ctx = {}) {
  const isRunning = typeof ctx.isRunning === 'function'
    ? Boolean(ctx.isRunning())
    : Boolean(ctx.isRunning);
  const explicitBusy = typeof ctx.isBusy === 'function'
    ? Boolean(ctx.isBusy())
    : (ctx.isBusy !== undefined ? Boolean(ctx.isBusy) : false);
  const isBusy = explicitBusy || isRunning;
  const isLiveVoiceActive = typeof ctx.isLiveVoiceActive === 'function'
    ? Boolean(ctx.isLiveVoiceActive())
    : Boolean(ctx.isLiveVoiceActive);
  const hasTurns = typeof ctx.hasTurns === 'function'
    ? Boolean(ctx.hasTurns())
    : Boolean(ctx.hasTurns);
  const exportMenuOpen = typeof ctx.isExportMenuOpen === 'function'
    ? Boolean(ctx.isExportMenuOpen())
    : Boolean(ctx.exportMenuOpen);

  const action = resolveGlobalShortcutAction(event, { isRunning, exportMenuOpen });
  if (!action) {
    return { action: null, handled: false, prevented: false };
  }

  if (typeof event.preventDefault === 'function') {
    event.preventDefault();
  }
  if (event.repeat) {
    return { action, handled: false, prevented: true, reason: 'repeat' };
  }

  switch (action) {
    case 'close_export_menu':
      ctx.closeExportMenu?.();
      return { action, handled: true, prevented: true };
    case 'stop_generation':
      if (!isRunning) return { action, handled: false, prevented: true, reason: 'not_running' };
      ctx.stopGeneration?.();
      return { action, handled: true, prevented: true };
    case 'export_json':
      if (isBusy || !hasTurns) {
        return { action, handled: false, prevented: true, reason: isBusy ? 'busy' : 'empty' };
      }
      ctx.exportSession?.(ctx.defaultExportFormat || 'json');
      return { action, handled: true, prevented: true };
    case 'export_markdown':
      if (isBusy || !hasTurns) {
        return { action, handled: false, prevented: true, reason: isBusy ? 'busy' : 'empty' };
      }
      ctx.exportSession?.('markdown');
      return { action, handled: true, prevented: true };
    case 'import_session':
      if (isBusy || isLiveVoiceActive) {
        return {
          action, handled: false, prevented: true,
          reason: isBusy ? 'busy' : 'live_voice_active',
        };
      }
      ctx.openImportDialog?.();
      return { action, handled: true, prevented: true };
    case 'new_chat':
      if (isBusy || isLiveVoiceActive) {
        return {
          action, handled: false, prevented: true,
          reason: isBusy ? 'busy' : 'live_voice_active',
        };
      }
      ctx.newChat?.();
      return { action, handled: true, prevented: true };
    default:
      return { action: null, handled: false, prevented: false };
  }
}
// KEYBOARD_SHORTCUTS_END

ui.exportSession.addEventListener('click', (event) => {
  const selected = ['json', 'markdown', 'replay'].includes(ui.exportFormat.value) ? ui.exportFormat.value : 'json';
  const format = event?.shiftKey ? (selected === 'markdown' ? 'json' : 'markdown') : selected;
  exportSession(format);
});

ui.importSession.addEventListener('click', () => {
  openImportDialog();
});

ui.importSessionInput.addEventListener('change', async () => {
  const file = ui.importSessionInput.files?.[0];
  ui.importSessionInput.value = '';
  if (!file) return;
  if (running || realtime.enabled || realtime.activeResponseId || micState) {
    showError('Cannot import a session while a response, recording, or live voice session is active.');
    return;
  }
  if (typeof file.size === 'number' && file.size > MAX_IMPORT_FILE_BYTES) {
    showError('Imported session JSON exceeds the 128 MiB file limit.');
    setStatus('Import failed', false);
    return;
  }
  try {
    const text = await file.text();
    const parsed = parseImportedSessionJson(text);
    await verifyImportedReplay(parsed);
    applyImportedSession(parsed);
    if (parsed.schema === SESSION_REPLAY_SCHEMA) await restoreImportedMedia();
    setStatus(parsed.schema === SESSION_REPLAY_SCHEMA
      ? `Imported ${parsed.turns.length} turns · verified media restored`
      : `Imported ${parsed.turns.length} turns · media omitted in compact export`, false);
  } catch (err) {
    console.error('Session import failed', err?.stack || err);
    showError('Session import failed: ' + (err?.message || String(err)));
    setStatus('Import failed', false);
  }
});

syncEmptyState();

ui.newChat.addEventListener('click', () => {
  newChat();
});

document.addEventListener('keydown', (event) => {
  handleGlobalShortcut(event, {
    isRunning: () => running,
    isBusy: () => running,
    isLiveVoiceActive: () => Boolean(realtime.enabled || realtime.activeResponseId),
    hasTurns: () => sessionTurns.length > 0,
    isExportMenuOpen: () => false,
    defaultExportFormat: ui.exportFormat.value,
    exportSession,
    openImportDialog,
    newChat,
    stopGeneration,
  });
});
</script>
</body>
