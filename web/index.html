<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ummInfer</title>
<style>
  /* Design tokens mirror clients/ummmlx/Sources/ummmlx/Theme.swift. */
  :root {
    --bg: #FFFFFF; --surface: #F7F7F7; --hover: #F2F2F2; --line: #EBEBEB;
    --text: #111111; --secondary: #6E6E6E; --tertiary: #A3A3A3;
    --ink: #111111; --on-ink: #FFFFFF;
    --accent: #0D9384; --danger: #EB5230;
    --r-control: 8px; --r-card: 12px;
    --f-title: 20px; --f-section: 15px; --f-body: 13px; --f-caption: 12px;
  }
  :root.dark {
    --bg: #151515; --surface: #1C1C1C; --hover: #232323; --line: #2B2B2B;
    --text: #F2F2F2; --secondary: #A3A3A3; --tertiary: #6B6B6B;
    --ink: #F2F2F2; --on-ink: #151515;
    --accent: #2BB3A3; --danger: #FF6B47;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; background: var(--bg);
    color: var(--text); font: var(--f-body)/1.5 -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    background: var(--surface);
  }
  header h1 { margin: 0; font-size: var(--f-title); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tertiary); transition: background .2s; }
  .dot.busy { background: var(--accent); }
  #status { font-size: var(--f-caption); color: var(--secondary); }
  .chip {
    font: var(--f-caption)/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--secondary); background: var(--hover);
    padding: 4px 7px; border-radius: 6px;
  }
  .spacer { flex: 1; }

  #settings {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
    padding: 12px 16px; background: var(--surface);
  }
  #settings label { display: flex; flex-direction: column; gap: 4px; font-size: var(--f-caption); color: var(--secondary); }
  #settings label.check { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 6px; }
  #settings label.grow { flex: 1 1 260px; }
  input[type=text], input:not([type]), select, textarea {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--r-control);
    padding: 7px 9px; outline: none; transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  #settings input { width: 100%; }
  #settings label.grow input, #settings label:first-child input { width: 100%; }
  #settings label:first-child { flex: 1 1 300px; }
  #settings label:nth-child(2) { flex: 0 1 220px; }
  #settings label:nth-child(5) { flex: 0 1 130px; }
  input[type=checkbox] { accent-color: var(--accent); }

  button {
    font: inherit; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); border-radius: var(--r-control); padding: 7px 14px;
    cursor: pointer; transition: background .15s, border-color .15s, transform .08s;
  }
  button:hover { background: var(--hover); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  button.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  button.primary:hover { opacity: .88; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }

  #transcript { flex: 1; overflow-y: auto; padding: 20px; }
  #transcript:empty::after {
    content: "Chat with your ummInfer unified server";
    display: block; text-align: center; color: var(--tertiary);
    font-size: var(--f-section); padding-top: 18vh;
  }
  .turn { display: flex; flex-direction: column; gap: 6px; max-width: 680px; margin: 0 0 18px; }
  .turn.user { margin-left: auto; align-items: flex-end; }
  .turn .meta { font-size: var(--f-caption); font-weight: 500; color: var(--secondary); }
  .turn .body { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .turn .text {
    white-space: pre-wrap; word-break: break-word; padding: 10px 13px;
    border-radius: var(--r-card); background: var(--surface);
    animation: rise .18s ease-out;
  }
  .turn.user .text { background: var(--ink); color: var(--on-ink); }
  .turn .text:empty:not(.caret) { display: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .caret::after {
    content: ""; display: inline-block; width: 2px; height: 1em;
    margin-left: 2px; vertical-align: -2px; background: var(--accent);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .artifacts { display: flex; flex-wrap: wrap; gap: 10px; }
  .artifacts img {
    display: block; width: 168px; height: 168px; object-fit: cover;
    border-radius: var(--r-card); border: 1px solid var(--line);
    animation: fade .35s ease-out;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .artifacts audio { border-radius: var(--r-control); }
  .artifacts video { max-width: 100%; border-radius: var(--r-card); border: 1px solid var(--line); }
  .legs { font-size: var(--f-caption); color: var(--danger); }

  .wave { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
  .wave i { width: 3px; height: 4px; border-radius: 2px; background: var(--accent); opacity: .5; }
  .wave.playing i { opacity: 1; animation: bar .9s ease-in-out infinite; }
  .wave.playing i:nth-child(2) { animation-delay: .12s; }
  .wave.playing i:nth-child(3) { animation-delay: .24s; }
  .wave.playing i:nth-child(4) { animation-delay: .36s; }
  .wave.playing i:nth-child(5) { animation-delay: .48s; }
  @keyframes bar { 0%, 100% { height: 4px; } 50% { height: 18px; } }

  #error {
    display: flex; gap: 8px; padding: 12px 16px; font-size: var(--f-body);
    color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent);
  }

  footer {
    display: flex; align-items: flex-end; gap: 10px; padding: 16px;
    background: var(--surface); border-top: 1px solid var(--line);
  }
  #prompt { flex: 1; resize: vertical; min-height: 38px; max-height: 160px; }
</style>
</head>
<body>
<header>
  <h1>ummInfer</h1>
  <span class="dot" id="dot"></span>
  <span id="status" role="status">Ready</span>
  <span class="chip" id="session" hidden></span>
  <span class="spacer"></span>
  <select id="theme" aria-label="Theme">
    <option value="system">System</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>
  <button id="new">New chat</button>
</header>

<section id="settings">
  <label>Base URL<input id="endpoint" value="http://127.0.0.1:30000/v1" spellcheck="false"></label>
  <label>Model<input id="model" value="Qwen2.5-0.5B-Instruct-4bit" spellcheck="false"></label>
  <label class="check"><input type="checkbox" id="image"> Image</label>
  <label class="check"><input type="checkbox" id="audio"> Audio</label>
  <label>Voice<input id="voice" value="vivian" spellcheck="false"></label>
</section>

<main id="transcript"></main>
<div id="error" hidden></div>

<footer>
  <textarea id="prompt" rows="1" placeholder="Write a prompt"></textarea>
  <button id="send" class="primary">Send</button>
  <button id="stop" class="danger" hidden>Stop</button>
</footer>

<script type="module">
// ummInfer web client. Wire protocol mirrored from
// clients/ummmlx/Sources/ummmlx/ChatClient.swift and UnifiedStream.swift;
// contract in docs/mixed-output-contract.md.

const $ = (id) => document.getElementById(id);
const ui = {
  dot: $('dot'), status: $('status'), session: $('session'), theme: $('theme'),
  endpoint: $('endpoint'), model: $('model'), image: $('image'), audio: $('audio'),
  voice: $('voice'), transcript: $('transcript'), error: $('error'),
  prompt: $('prompt'), send: $('send'), stop: $('stop'), newChat: $('new'),
};

const log = (...args) => console.log('[umm]', ...args);

// ---------- theme (Theme.swift tokens, system/light/dark) ----------

const THEME_KEY = 'ummweb.theme';
const scheme = matchMedia('(prefers-color-scheme: dark)');

function applyTheme() {
  const mode = localStorage.getItem(THEME_KEY) || 'system';
  ui.theme.value = mode;
  document.documentElement.classList.toggle(
    'dark', mode === 'dark' || (mode === 'system' && scheme.matches));
}
scheme.addEventListener('change', applyTheme);
ui.theme.addEventListener('change', () => {
  localStorage.setItem(THEME_KEY, ui.theme.value);
  applyTheme();
});
applyTheme();

// ---------- settings ----------

const SETTINGS = ['endpoint', 'model', 'voice'];
for (const key of SETTINGS) {
  const saved = localStorage.getItem('ummweb.' + key);
  if (saved !== null) ui[key].value = saved;
}
ui.image.checked = localStorage.getItem('ummweb.image') === '1';
ui.audio.checked = localStorage.getItem('ummweb.audio') === '1';
const saveSettings = () => {
  for (const key of SETTINGS) localStorage.setItem('ummweb.' + key, ui[key].value);
  localStorage.setItem('ummweb.image', ui.image.checked ? '1' : '0');
  localStorage.setItem('ummweb.audio', ui.audio.checked ? '1' : '0');
};

// ---------- state ----------

let running = false;
let stopped = false;
let controller = null;
let sessionID = '';
let turn = null;          // current assistant turn
let inflight = new Map(); // artifact_id -> partial chunks
const history = [];       // completed {role, content} pairs

function newSessionID() {
  const bytes = crypto.getRandomValues(new Uint8Array(8));
  return 'ummweb-' + [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('');
}

// ChatClient.chatURL: strip trailing slashes, default /v1, append the route.
function chatURL(base) {
  const url = new URL(base.trim());
  if (url.protocol !== 'http:' && url.protocol !== 'https:') {
    throw new Error('Base URL must use http or https.');
  }
  if (url.username || url.password || url.search || url.hash) {
    throw new Error('Use a base URL without credentials, query, or fragment.');
  }
  let path = url.pathname.replace(/\/+$/, '');
  if (!path) path = '/v1';
  url.pathname = path + '/chat/completions';
  return url;
}

// ---------- view helpers ----------

function setStatus(text, busy = running) {
  ui.status.textContent = text;
  ui.dot.classList.toggle('busy', busy);
}

function showError(text) {
  ui.error.textContent = text;
  ui.error.hidden = false;
}

function clearError() {
  ui.error.hidden = true;
  ui.error.textContent = '';
}

function addTurn(role, text) {
  const el = document.createElement('div');
  el.className = 'turn ' + role;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = role === 'user' ? 'You' : 'ummInfer';
  const body = document.createElement('div');
  body.className = 'body';
  const textEl = document.createElement('div');
  textEl.className = 'text';
  textEl.textContent = text;
  const artifacts = document.createElement('div');
  artifacts.className = 'artifacts';
  const legs = document.createElement('div');
  legs.className = 'legs';
  body.append(textEl, artifacts, legs);
  el.append(meta, body);
  ui.transcript.append(el);
  scrollToEnd();
  return { el, textEl, artifacts, legs, text };
}

function scrollToEnd() {
  ui.transcript.scrollTop = ui.transcript.scrollHeight;
}

function appendText(delta) {
  if (!turn) return;
  if (!turn.text) setStatus('Streaming…');
  turn.text += delta;
  turn.textEl.textContent = turn.text;
  scrollToEnd();
}

// ---------- streaming PCM16 playback ----------
// One AudioContext per turn. Chunks are scheduled back to back on a running
// cursor instead of starting a fresh source per chunk, so the waveform stays
// continuous. A short jitter buffer avoids an immediate starve.

const player = {
  ctx: null, next: 0, started: false, ended: false,
  pending: [], buffered: 0, sources: 0,

  begin(wave) {
    this.stop();
    waveEl = wave;
    this.ctx = new AudioContext();
    this.next = 0; this.started = false; this.ended = false;
    this.pending = []; this.buffered = 0; this.sources = 0;
  },

  push(bytes, rate, channels) {
    if (!this.ctx || this.ended) return;
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    const buffer = pcmBuffer(this.ctx, bytes, rate, channels);
    if (!buffer) { log('pcm: rejected', bytes.length, rate, channels); return; }
    this.pending.push(buffer);
    this.buffered += buffer.duration;
    if (!this.started && this.buffered >= 0.3) {
      this.started = true;
      this.next = this.ctx.currentTime + 0.1;
      setPlaying(true);
    }
    if (this.started) this.drain();
  },

  drain() {
    const ctx = this.ctx;
    for (const buffer of this.pending) {
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(ctx.destination);
      const at = Math.max(this.next, ctx.currentTime + 0.02);
      source.start(at);
      this.next = at + buffer.duration;
      log('pcm: schedule', buffer.duration.toFixed(3) + 's', 'at', at.toFixed(3));
      this.sources += 1;
      source.onended = () => {
        this.sources -= 1;
        if (this.sources === 0 && this.ended) this.finish();
      };
    }
    this.pending = [];
    this.buffered = 0;
  },

  end() {
    this.ended = true;
    if (!this.started && this.pending.length) {
      this.started = true;
      this.next = this.ctx.currentTime + 0.05;
      setPlaying(true);
      this.drain();
    }
    if (this.sources === 0) this.finish();
  },

  finish() {
    setPlaying(false);
    this.ctx?.close().catch(() => {});
    this.ctx = null;
  },

  stop() {
    this.ended = true;
    setPlaying(false);
    this.pending = [];
    this.buffered = 0;
    this.sources = 0;
    this.ctx?.close().catch(() => {});
    this.ctx = null;
  },
};

// The wave belongs to the turn that owns this audio, not to the module-level
// `turn`, which is cleared when the request ends while playback continues.
let waveEl = null;

function setPlaying(active) {
  if (!waveEl) return;
  waveEl.classList.toggle('playing', active);
}

function pcmBuffer(ctx, bytes, rate, channels) {
  const frameBytes = channels * 2;
  if (!bytes.length || bytes.length % frameBytes !== 0) return null;
  if (!(rate > 0) || channels < 1 || channels > 8) return null;
  const frames = bytes.length / frameBytes;
  const buffer = ctx.createBuffer(channels, frames, rate);
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  for (let c = 0; c < channels; c += 1) {
    const out = buffer.getChannelData(c);
    for (let i = 0, offset = c * 2; i < frames; i += 1, offset += frameBytes) {
      out[i] = view.getInt16(offset, true) / 32768;
    }
  }
  return buffer;
}

// ---------- artifacts (UnifiedStream.swift ArtifactCollector) ----------

function decodeBase64(text) {
  const binary = atob(text);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function sha256Hex(bytes) {
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
  return [...digest].map((b) => b.toString(16).padStart(2, '0')).join('');
}

async function ingestArtifact(chunk) {
  if (!chunk || typeof chunk !== 'object') throw new Error('Artifact is missing.');
  if (chunk.encoding !== 'base64') throw new Error('Artifact encoding must be base64.');
  if (!(chunk.total >= 1) || !(chunk.index >= 0) || chunk.index >= chunk.total) {
    throw new Error('Artifact chunk index is out of range.');
  }
  let slot = inflight.get(chunk.artifact_id);
  if (!slot) {
    slot = { mime: chunk.mime_type, total: chunk.total, parts: [] };
    inflight.set(chunk.artifact_id, slot);
  }
  if (slot.total !== chunk.total) throw new Error('Artifact total changed between chunks.');
  slot.parts[chunk.index] = decodeBase64(chunk.data);
  if (chunk.index + 1 < chunk.total) return;

  inflight.delete(chunk.artifact_id);
  const size = slot.parts.reduce((n, part) => n + part.length, 0);
  const bytes = new Uint8Array(size);
  let offset = 0;
  for (const part of slot.parts) { bytes.set(part, offset); offset += part.length; }
  if (chunk.bytes != null && chunk.bytes !== bytes.length) {
    throw new Error(`Artifact ${chunk.artifact_id} has ${bytes.length} bytes, not ${chunk.bytes}.`);
  }
  if (chunk.sha256 && crypto.subtle) {
    const digest = await sha256Hex(bytes);
    if (digest !== chunk.sha256.toLowerCase()) {
      throw new Error(`Artifact ${chunk.artifact_id} failed its sha256 check.`);
    }
  }
  deliver(chunk, bytes);
}

function deliver(chunk, bytes) {
  const mime = chunk.mime_type;
  log('artifact', chunk.artifact_id, mime, bytes.length + ' bytes');
  if (mime === 'audio/pcm') {
    player.push(bytes, chunk.sample_rate ?? 24000, chunk.channels ?? 1);
    return;
  }
  const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
  if (chunk.media_type === 'image') {
    const link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener';
    const img = document.createElement('img');
    img.src = url;
    img.alt = 'Generated image';
    link.append(img);
    turn.artifacts.append(link);
  } else if (mime === 'audio/wav') {
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.src = url;
    turn.artifacts.append(audio);
  } else if (mime === 'video/mp4') {
    const video = document.createElement('video');
    video.controls = true;
    video.src = url;
    turn.artifacts.append(video);
  } else {
    const note = document.createElement('div');
    note.className = 'legs';
    note.textContent = `Unsupported artifact ${mime}`;
    turn.artifacts.append(note);
  }
  scrollToEnd();
}

// ---------- SSE ----------

async function* readLines(res) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let rest = '';
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      rest += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = rest.indexOf('\n')) >= 0) {
        let line = rest.slice(0, cut);
        rest = rest.slice(cut + 1);
        if (line.endsWith('\r')) line = line.slice(0, -1);
        yield line;
      }
      if (rest.length > 4 * 1024 * 1024) throw new Error('An SSE line exceeds 4 MiB.');
    }
    rest += decoder.decode();
    if (rest) yield rest.replace(/\r$/, '');
  } finally {
    reader.cancel().catch(() => {});
  }
}

function errorDetail(root) {
  if (typeof root.error === 'string') return root.error;
  if (root.error && typeof root.error === 'object') {
    return [root.error.type, root.error.code, root.error.message]
      .filter((v) => typeof v === 'string' && v).join(': ') || 'no error detail';
  }
  return typeof root.message === 'string' && root.message ? root.message : 'no error detail';
}

async function consume(payload, st) {
  if (payload === '[DONE]') { st.done = true; return; }
  let root;
  try { root = JSON.parse(payload); } catch { throw new Error('An SSE event is not JSON.'); }
  if (root.error != null) throw new Error(errorDetail(root));

  const unified = root.unified;
  if (unified != null) {
    if (st.terminal) throw new Error('A unified event follows the terminal event.');
    if (unified.seq !== st.seq) {
      throw new Error(`Unified seq ${unified.seq} arrived, expected ${st.seq}.`);
    }
    st.seq += 1;
    st.sawUnified = true;
    if (unified.session_id) st.sessionID = unified.session_id;
    log('event', unified.kind, unified.seq, unified.stage);
    switch (unified.kind) {
      case 'artifact': await ingestArtifact(unified.artifact); break;
      case 'leg_error':
        turn.legs.textContent = `${unified.stage} output: ${unified.error || 'failed'}`;
        break;
      case 'complete': st.terminal = 1; break;
      case 'error': st.terminal = 1; throw new Error(unified.error || 'The request failed.');
      case 'cancelled': {
        st.terminal = 1;
        const err = new Error('The server cancelled the request.');
        err.cancelled = true;
        throw err;
      }
      default: break;
    }
  }

  const choice = Array.isArray(root.choices) ? root.choices[0] : null;
  if (choice?.delta && typeof choice.delta.content === 'string' && choice.delta.content) {
    st.text += choice.delta.content;
    appendText(choice.delta.content);
  }
  if (choice?.finish_reason) st.finish = choice.finish_reason;
}

// ---------- send / stop ----------

function setBusy(busy) {
  running = busy;
  ui.send.hidden = busy;
  ui.stop.hidden = !busy;
  for (const control of [
    ui.endpoint, ui.model, ui.image, ui.audio, ui.voice, ui.newChat]) {
    control.disabled = busy;
  }
  ui.dot.classList.toggle('busy', busy);
}

async function send() {
  if (running) return;
  const text = ui.prompt.value.trim();
  if (!text) { setStatus('Input required', false); ui.prompt.focus(); return; }

  let url;
  let model;
  try {
    url = chatURL(ui.endpoint.value);
    model = ui.model.value.trim();
    if (!model) throw new Error('Model is required.');
  } catch (err) { showError(err.message); return; }

  saveSettings();
  if (!sessionID) sessionID = newSessionID();

  const body = {
    model,
    messages: [...history, { role: 'user', content: text }],
    max_tokens: 64,
    temperature: 0,
    stream: true,
    session_id: sessionID,
  };
  const modalities = ['text'];
  if (ui.image.checked) {
    modalities.push('image');
    body.image = { size: '512x512', output_format: 'png' };
  }
  if (ui.audio.checked) {
    modalities.push('audio');
    body.audio = { voice: ui.voice.value.trim() || 'vivian', format: 'wav' };
    // ChatClient.requestBody: only audio-only turns stream PCM; with an image
    // the server keeps its ordered single-leg WAV path.
    if (!ui.image.checked) body.audio.stream = true;
  }
  if (modalities.length > 1) body.modalities = modalities;

  ui.prompt.value = '';
  clearError();
  stopped = false;
  inflight = new Map();
  setBusy(true);
  setStatus('Connecting…');
  addTurn('user', text);
  turn = addTurn('assistant', '');
  turn.textEl.classList.add('caret');
  waveEl = document.createElement('div');
  waveEl.className = 'wave';
  waveEl.hidden = !ui.audio.checked;
  waveEl.innerHTML = '<i></i><i></i><i></i><i></i><i></i>';
  turn.el.querySelector('.body').append(waveEl);
  if (ui.audio.checked) player.begin(waveEl);

  controller = new AbortController();
  const st = { seq: 0, terminal: 0, sawUnified: false, done: false, text: '', finish: '', sessionID };
  log('request', url.href, JSON.stringify(body));

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' },
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    if (!res.ok) {
      const detail = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}: ${limit(detail)}`);
    }
    const type = (res.headers.get('content-type') || '').split(';')[0].trim().toLowerCase();
    if (type !== 'text/event-stream') {
      throw new Error(`Expected text/event-stream, got ${type || 'no content type'}.`);
    }

    // One data line carries one event (docs/mixed-output-contract.md), the same
    // flush rule ChatClient.SSEParser uses.
    for await (const line of readLines(res)) {
      if (!line.startsWith('data:')) continue;
      let payload = line.slice(5);
      if (payload.startsWith(' ')) payload = payload.slice(1);
      await consume(payload, st);
      if (st.done) break;
    }

    if (!st.done) throw new Error('The stream ended before [DONE].');
    if (st.sawUnified && st.terminal !== 1) {
      throw new Error('The unified stream ended without a terminal event.');
    }
    if (inflight.size) throw new Error('An artifact stream ended before its final chunk.');

    if (st.sessionID) {
      sessionID = st.sessionID;
      ui.session.hidden = false;
      ui.session.textContent =
        'session ' + sessionID.replace(/^ummweb-/, '').slice(0, 8);
      ui.session.title = sessionID;
    }
    history.push({ role: 'user', content: text });
    history.push({ role: 'assistant', content: st.text });
    turn.textEl.classList.remove('caret');
    player.end();
    setStatus(st.finish ? `Completed · ${st.finish}` : 'Completed');
    setBusy(false);
  } catch (err) {
    player.stop();
    const aborted = stopped || err.name === 'AbortError' || err.cancelled;
    turn.textEl.classList.remove('caret');
    setBusy(false);
    if (aborted) {
      setStatus('Stopped');
      if (!turn.text && !turn.artifacts.childElementCount) turn.el.remove();
    } else {
      setStatus('Error');
      showError(err.message || String(err));
    }
    log('failed', err.message);
  } finally {
    controller = null;
    turn = null;
  }
}

function limit(text) {
  const trimmed = String(text || '').trim();
  return trimmed.length > 300 ? trimmed.slice(0, 300) + '…' : (trimmed || 'no error detail');
}

ui.send.addEventListener('click', send);
ui.stop.addEventListener('click', () => {
  if (!running) return;
  stopped = true;
  setStatus('Stopping…');
  controller?.abort();
});
ui.prompt.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
    event.preventDefault();
    send();
  }
});
ui.newChat.addEventListener('click', () => {
  if (running) return;
  history.length = 0;
  ui.transcript.replaceChildren();
  sessionID = '';
  ui.session.hidden = true;
  clearError();
  setStatus('Ready', false);
});
</script>
</body>
</html>
