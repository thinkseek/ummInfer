// VIDEO_FRAME_SELECTION_BEGIN
function parseVideoFrameBudget(value) {
  if (value === '' || value === undefined || value === null) return undefined;
  if (typeof value !== 'string' || !['4', '8', '16'].includes(value)) {
    throw new Error('Frame budget must be Default, 4, 8, or 16.');
  }
  return Number(value);
}

function parseVideoFrameSelection(policy, motionText, sceneText, budgetText = '') {
  const maxFrames = parseVideoFrameBudget(budgetText);
  if (policy !== 'uniform' && policy !== 'temporal') {
    throw new Error('Input frame policy must be Uniform or Temporal.');
  }
  if (policy === 'uniform') {
    return maxFrames === undefined ? undefined : { policy: 'uniform', max_frames: maxFrames };
  }
  const threshold = (text, name) => {
    const normalized = String(text).trim();
    const value = Number(normalized);
    if (!normalized || !Number.isFinite(value) || value < 0 || value > 1) {
      throw new Error(`${name} must be a finite number in [0,1].`);
    }
    return value;
  };
  const selection = {
    policy: 'temporal',
    motion_threshold: threshold(motionText, 'Motion threshold'),
    scene_threshold: threshold(sceneText, 'Scene threshold'),
  };
  if (maxFrames !== undefined) selection.max_frames = maxFrames;
  return selection;
}

function validateVideoFrameBudgetJson(text) {
  // JSON.parse erases the 4 vs 4.0 distinction. Inspect only property tokens,
  // skipping arbitrary string content, so floats/exponents cannot slip through.
  let index = 0;
  while (index < text.length) {
    if (text[index] !== '"') { index += 1; continue; }
    const start = index;
    index += 1;
    while (index < text.length) {
      if (text[index] === '\\') { index += 2; continue; }
      if (text[index] === '"') { index += 1; break; }
      index += 1;
    }
    let key;
    try { key = JSON.parse(text.slice(start, index)); } catch { continue; }
    let cursor = index;
    while (/\s/.test(text[cursor] || '')) cursor += 1;
    if (key !== 'max_frames' || text[cursor] !== ':') continue;
    cursor += 1;
    while (/\s/.test(text[cursor] || '')) cursor += 1;
    const valueStart = cursor;
    while (cursor < text.length && !/[,\]}\s]/.test(text[cursor])) cursor += 1;
    const literal = text.slice(valueStart, cursor);
    if (!/^-?(?:0|[1-9]\d*)$/.test(literal)) {
      throw new Error('video_frame_selection.max_frames must be an integer.');
    }
    index = cursor;
  }
}

function normalizeVideoFrameSelectionConfig(raw) {
  if (raw === undefined || raw === null) return undefined;
  if (typeof raw !== 'object' || Array.isArray(raw)) {
    throw new Error('video_frame_selection must be an object.');
  }
  const allowed = new Set(['policy', 'motion_threshold', 'scene_threshold', 'max_frames']);
  for (const key of Object.keys(raw)) {
    if (!allowed.has(key)) throw new Error(`Unsupported video_frame_selection field: ${key}.`);
  }
  if (typeof raw.policy !== 'string') {
    throw new Error('video_frame_selection.policy must be Uniform or Temporal.');
  }
  let budgetText = '';
  if (raw.max_frames !== undefined && raw.max_frames !== null) {
    if (typeof raw.max_frames !== 'number' || !Number.isSafeInteger(raw.max_frames) ||
        ![4, 8, 16].includes(raw.max_frames)) {
      throw new Error('video_frame_selection.max_frames must be exactly 4, 8, or 16.');
    }
    budgetText = String(raw.max_frames);
  }
  if (raw.policy === 'uniform') {
    if (raw.motion_threshold !== undefined || raw.scene_threshold !== undefined) {
      throw new Error('Uniform video_frame_selection does not accept temporal thresholds.');
    }
    return parseVideoFrameSelection('uniform', '', '', budgetText);
  }
  if (raw.policy !== 'temporal') {
    throw new Error('video_frame_selection.policy must be Uniform or Temporal.');
  }
  for (const key of ['motion_threshold', 'scene_threshold']) {
    if (typeof raw[key] !== 'number' || !Number.isFinite(raw[key]) || raw[key] < 0 || raw[key] > 1) {
      throw new Error(`video_frame_selection.${key} must be a finite number in [0,1].`);
    }
  }
  return parseVideoFrameSelection(
    'temporal', String(raw.motion_threshold), String(raw.scene_threshold), budgetText);
}

function applyVideoFrameSelectionToControls(controls, selection) {
  controls.videoFramePolicy.value = selection?.policy || 'uniform';
  controls.videoMotionThreshold.value = String(selection?.motion_threshold ?? 0.02);
  controls.videoSceneThreshold.value = String(selection?.scene_threshold ?? 0.25);
  controls.videoFrameBudget.value = selection?.max_frames === undefined
    ? '' : String(selection.max_frames);
}

function videoURLPart(dataURL, frameSelection) {
  const video = { url: dataURL };
  if (frameSelection) {
    const selection = { policy: frameSelection.policy };
    if (frameSelection.policy === 'temporal') {
      selection.motion_threshold = frameSelection.motion_threshold;
      selection.scene_threshold = frameSelection.scene_threshold;
    }
    if (frameSelection.max_frames !== undefined) {
      selection.max_frames = frameSelection.max_frames;
    }
    video.frame_selection = selection;
  }
  return { type: 'video_url', video_url: video };
}
// VIDEO_FRAME_SELECTION_END

// NARRATIVE_CONTINUITY_BEGIN
const MAX_STYLE_ANCHOR_BYTES = 256;
const VALID_CONTINUITY_MODES = new Set(['off', 'prompt_anchor', 'i2v_chain']);

function validateStyleAnchor(raw) {
  const trimmed = String(raw ?? '').trim();
  if (!trimmed) return '';
  const byteLength = new TextEncoder().encode(trimmed).length;
  if (byteLength > MAX_STYLE_ANCHOR_BYTES) {
    throw new Error(`Style anchor must be at most ${MAX_STYLE_ANCHOR_BYTES} UTF-8 bytes (currently ${byteLength} bytes).`);
  }
  return trimmed;
}

function buildNarrativeConfig({
  visual_mode = 'auto',
  max_slots = 3,
  allow_text_only = true,
  continuity_mode = 'off',
  style_anchor = '',
} = {}) {
  const mode = String(continuity_mode || 'off');
  if (!VALID_CONTINUITY_MODES.has(mode)) {
    throw new Error("Continuity mode must be 'off', 'prompt_anchor', or 'i2v_chain'.");
  }
  const anchor = validateStyleAnchor(style_anchor);
  const slotsVal = Number.parseInt(String(max_slots ?? '').trim(), 10);
  const narrative = {
    enabled: true,
    visual_mode: visual_mode || 'auto',
    max_slots: Number.isInteger(slotsVal) ? Math.min(6, Math.max(1, slotsVal)) : 3,
    allow_text_only: Boolean(allow_text_only),
  };
  if (mode !== 'off') {
    narrative.continuity_mode = mode;
  }
  if (anchor) {
    narrative.style_anchor = anchor;
  }
  return narrative;
}

function normalizeAnchorSha256(raw) {
  if (typeof raw !== 'string') return '';
  const trimmed = raw.trim().toLowerCase();
  return /^[0-9a-f]{64}$/.test(trimmed) ? trimmed : '';
}

function visualSlotContinuityBadge(unified) {
  const mode = typeof unified?.continuity_mode === 'string' ? unified.continuity_mode : '';
  const anchorIdx = unified?.anchor_slot_index;
  const explicit = unified?.anchor_explicit === true;
  const sha256 = normalizeAnchorSha256(unified?.anchor_sha256);
  if (Number.isInteger(anchorIdx) && anchorIdx >= 0
      && (mode === 'i2v_chain' || mode === '' || explicit)) {
    const slotLabel = `Slot ${anchorIdx + 1}`;
    if (explicit) {
      const shortSha = sha256 ? ` · ${sha256.slice(0, 8)}` : '';
      return {
        text: `Explicit I2V ← ${slotLabel}${shortSha}`,
        kind: 'i2v-chain',
        explicit: true,
        sha256: sha256 || null,
        title: sha256
          ? `Explicit anchor slot-${anchorIdx} · SHA-256: ${sha256}`
          : `Explicit anchor slot-${anchorIdx}`,
      };
    }
    return {
      text: `I2V ← ${slotLabel}`,
      kind: 'i2v-chain',
      explicit: false,
      sha256: sha256 || null,
      title: sha256 ? `Anchor slot-${anchorIdx} · SHA-256: ${sha256}` : '',
    };
  }
  if (mode === 'prompt_anchor') {
    return { text: 'Anchor', kind: 'prompt-anchor', explicit: false, sha256: null, title: '' };
  }
  return null;
}

function updateSlotContinuity(slot, incoming) {
  if (!slot || !incoming || typeof incoming !== 'object') return;
  const prev = slot.continuityMeta || {};
  const merged = {
    continuity_mode: typeof incoming.continuity_mode === 'string' && incoming.continuity_mode
      ? incoming.continuity_mode : (prev.continuity_mode || ''),
    anchor_slot_index: Number.isInteger(incoming.anchor_slot_index) && incoming.anchor_slot_index >= 0
      ? incoming.anchor_slot_index : prev.anchor_slot_index,
    anchor_explicit: incoming.anchor_explicit === true || prev.anchor_explicit === true,
    anchor_sha256: normalizeAnchorSha256(incoming.anchor_sha256) || prev.anchor_sha256 || '',
  };
  slot.continuityMeta = merged;
  const badge = visualSlotContinuityBadge(merged);
  if (!badge) return;
  if (!slot.continuityEl) {
    slot.continuityEl = document.createElement('span');
    if (slot.head && typeof slot.head.insertBefore === 'function' && slot.caption) {
      slot.head.insertBefore(slot.continuityEl, slot.caption);
    } else if (slot.head) {
      slot.head.append(slot.continuityEl);
    }
  }
  slot.continuityEl.className = 'badge continuity ' + badge.kind
    + (badge.explicit ? ' explicit' : '');
  slot.continuityEl.textContent = badge.text;
  slot.continuityEl.dataset.continuity = badge.kind;
  if (badge.explicit) slot.continuityEl.dataset.anchorExplicit = 'true';
  if (badge.sha256) slot.continuityEl.dataset.anchorSha256 = badge.sha256;
  if (badge.title) slot.continuityEl.title = badge.title;
}
// NARRATIVE_CONTINUITY_END

// STORYBOARD_LIFECYCLE_BEGIN
function validateUnifiedOwnership(st, unified) {
  if (!st || !unified || typeof unified !== 'object') {
    throw new Error('Unified event ownership is missing.');
  }
  if (st.sessionID && unified.session_id && unified.session_id !== st.sessionID) {
    throw new Error(`Cross-session event rejected: expected ${st.sessionID}, got ${unified.session_id}.`);
  }
  if (st.requestID && unified.request_id && unified.request_id !== st.requestID) {
    throw new Error(`Cross-request event rejected: expected ${st.requestID}, got ${unified.request_id}.`);
  }
}

function settleTurnTerminal(targetTurn, kind, legs = []) {
  if (!targetTurn) return { outcome: kind, unresolved: 0 };
  const outcome = kind === 'complete' ? 'completed' : (kind === 'cancelled' ? 'cancelled' : 'error');
  const terminalLegs = Array.isArray(legs) ? legs.filter(isPlainObject).map((leg) => ({ ...leg })) : [];
  targetTurn.terminal = {
    state: outcome,
    request_id: targetTurn.requestId || null,
    legs: terminalLegs,
  };
  targetTurn.outcome = outcome;
  if (kind === 'cancelled' && !targetTurn.text &&
      !(targetTurn.slots?.size) && !targetTurn.artifacts?.childElementCount) {
    targetTurn.legs.textContent = 'Cancelled before response output.';
  }
  const bySlot = new Map();
  for (const leg of terminalLegs) {
    if (typeof leg.slot_id === 'string') bySlot.set(leg.slot_id, leg);
  }
  let unresolved = 0;
  for (const slot of targetTurn.slots?.values?.() || []) {
    const leg = bySlot.get(slot.id);
    const state = typeof leg?.state === 'string' ? leg.state : '';
    slot.terminalState = state || (kind === 'cancelled' ? 'aborted' : 'unknown');
    if (kind === 'cancelled') {
      if (!slot.url) showSlotCancelled(slot);
      continue;
    }
    if (kind !== 'complete') {
      if (!slot.url) showSlotError(slot, state === 'failed' ? (leg.error || 'Visual generation failed') : 'Response ended before visual completion');
      unresolved += 1;
      continue;
    }
    if (state === 'failed') {
      if (!slot.url && !slot.hasError) showSlotError(slot, leg.error || 'Visual generation failed');
      unresolved += 1;
    } else if (state !== 'completed' || !slot.url) {
      unresolved += 1;
      if (!slot.url) {
        if (state === 'aborted') showSlotCancelled(slot, 'Visual slot aborted before completion');
        else showSlotError(slot, `Visual slot unresolved at terminal (${state || 'missing terminal leg'})`);
      }
    } else {
      slot.terminalState = 'completed';
    }
  }
  if (unresolved > 0) {
    targetTurn.outcome = 'incomplete';
    targetTurn.legs.textContent = `${unresolved} visual slot${unresolved === 1 ? '' : 's'} did not complete cleanly.`;
  }
  return { outcome: targetTurn.outcome, unresolved };
}

function recordNarrativeEvent(targetTurn, unified) {
  if (!targetTurn || !unified) return;
  const event = JSON.parse(JSON.stringify(unified));
  if (event.artifact && typeof event.artifact === 'object') {
    if (typeof event.artifact.data === 'string') {
      event.artifact.data_base64_bytes = event.artifact.data.length;
      delete event.artifact.data;
    }
  }
  targetTurn.events.push(event);
}
// STORYBOARD_LIFECYCLE_END

async function send() {
  if (running) return;
  const text = ui.prompt.value.trim();
  if (!text && !attachedImage && !attachedVideo && !attachedAudio) {
    setStatus('Input required', false); ui.prompt.focus(); return;
  }

  let url;
  let model;
  try {
    url = chatURL(ui.endpoint.value);
    model = ui.model.value.trim();
    if (!model) throw new Error('Model is required.');
  } catch (err) { showError(err.message); return; }

  let frameSelection;
  try {
    if (videoFrameBudgetPersistenceError) throw new Error(videoFrameBudgetPersistenceError);
    frameSelection = attachedVideo
      ? parseVideoFrameSelection(ui.videoFramePolicy.value,
                                 ui.videoMotionThreshold.value,
                                 ui.videoSceneThreshold.value,
                                 ui.videoFrameBudget.value)
      : undefined;
  } catch (err) {
    setStatus('Configuration error', false);
    showError(err.message);
    return;
  }

  const narrativeOn = ui.narrative.checked;
  const visualMode = ui.visualMode.value || 'auto';
  let narrativeConfig;
  try {
    narrativeConfig = narrativeOn
      ? buildNarrativeConfig({
          visual_mode: visualMode,
          max_slots: ui.maxSlots.value,
          allow_text_only: ui.allowTextOnly.checked,
          continuity_mode: ui.narrativeContinuity.value,
          style_anchor: ui.styleAnchor.value,
        })
      : undefined;
  } catch (err) {
    setStatus('Configuration error', false);
    showError(err.message);
    return;
  }

  saveSettings();
  if (!sessionID) sessionID = newSessionID();

  let userContent;
  if (attachedImage || attachedVideo || attachedAudio) {
    const parts = [];
    if (text) parts.push({ type: 'text', text });
    if (attachedImage) parts.push({ type: 'image_url', image_url: { url: attachedImage.dataURL } });
    if (attachedVideo) parts.push(videoURLPart(attachedVideo.dataURL, frameSelection));
    if (attachedAudio) parts.push({ type: 'input_audio', input_audio: { data: attachedAudio.wavBase64, format: 'wav' } });
    userContent = parts;
  } else {
    userContent = text;
  }

  const maxTokVal = Number.parseInt(ui.maxTokens.value.trim(), 10);
  const tempVal = Number(ui.temperature.value);
  const body = {
    model,
    messages: [{ role: 'user', content: userContent }],
    max_tokens: Number.isInteger(maxTokVal) && maxTokVal > 0 ? maxTokVal : 256,
    temperature: Number.isFinite(tempVal) && tempVal >= 0 ? tempVal : 0,
    stream: true,
    session_id: sessionID,
  };
  if (history.length > 0) body.session_history = true;
  if (ui.topP.value.trim() !== '') {
    const topPVal = Number(ui.topP.value);
    if (Number.isFinite(topPVal) && topPVal > 0 && topPVal <= 1) body.top_p = topPVal;
  }
  if (ui.seed.value.trim() !== '') {
    const seedVal = Number.parseInt(ui.seed.value.trim(), 10);
    if (Number.isInteger(seedVal)) body.seed = seedVal;
  }

  const modalities = new Set(['text']);
  if (narrativeOn) {
    if (visualMode !== 'video') {
      modalities.add('image');
      body.image = await imageConfig();
    }
    if (visualMode !== 'image') {
      modalities.add('video');
      body.video = videoConfig();
    }
    body.narrative = narrativeConfig;
  } else {
    if (ui.image.checked) {
      modalities.add('image');
      body.image = await imageConfig();
    }
    if (ui.video.checked) {
      modalities.add('video');
      body.video = videoConfig();
    }
  }
  const wantAudio = voiceOn || ui.audio.checked;
  if (wantAudio) {
    modalities.add('audio');
    body.audio = { voice: ui.voice.value.trim() || 'vivian', format: 'wav' };
    const refAudioUrl = await readFileAsDataURL(ui.refAudio);
    if (refAudioUrl) body.audio.ref_audio = refAudioUrl;
    // Global Voice always streams PCM, even with image/video/narrative.
    // Legacy manual Audio keeps the single-WAV rule on mixed turns.
    if (voiceOn || (!ui.image.checked && !ui.video.checked && !narrativeOn)) {
      body.audio.stream = true;
    }
  }
  if (modalities.size > 1) body.modalities = [...modalities];
  applyNativeAllocatorTelemetryOption(body, ui.nativeAllocatorTelemetry.checked);
  const behaviorRequested = ui.behaviorLogprobs.checked;
  applyBehaviorLogprobsOption(body, behaviorRequested);

  const userLabel = [
    text,
    attachedImage ? `[Image: ${attachedImage.name}]` : '',
    attachedVideo ? `[Video: ${attachedVideo.name}]` : '',
    attachedAudio ? `[Audio: ${attachedAudio.name}]` : '',
  ].filter(Boolean).join(' ');
  const sentImage = attachedImage;
  const sentVideo = attachedVideo;
  const sentRevisionSource = revisionSource;
  attachedImage = null; revisionSource = null; ui.askImage.value = '';
  attachedVideo = null; ui.askVideo.value = '';
  attachedAudio = null; ui.askAudio.value = '';
  renderAttachments();

  ui.prompt.value = '';
  clearError();
  stopped = false;
  inflight = new Map();
  setBusy(true);
  setStatus('Connecting…');
  const userTurn = addTurn('user', userLabel);
  if (sentRevisionSource) {
    userTurn.visualReference = {
      slot_id: sentRevisionSource.slotId,
      sha256: sentRevisionSource.sha256 || null,
      source_attached: true,
      edit_source_attached: true,
    };
  }
  if (sentImage) {
    const thumb = document.createElement('img');
    thumb.src = sentImage.dataURL;
    thumb.alt = sentImage.name;
    userTurn.artifacts.append(thumb);
  }
  if (sentVideo) {
    const preview = document.createElement('video');
    preview.src = sentVideo.dataURL;
    preview.controls = true;
    preview.muted = true;
    preview.playsInline = true;
    preview.style.maxWidth = '260px';
    preview.style.maxHeight = '180px';
    userTurn.artifacts.append(preview);
  }
  turn = addTurn('assistant', '');
  const sessionEntry = { userTurn, assistantTurn: turn };
  sessionTurns.push(sessionEntry);
  syncExportControls();
  turn.telemetry = {
    startedAt: performance.now(),
    ttftMs: null,
    ttfaMs: null,
    visualSettledCount: 0,
    settledSlotIds: new Set(),
    firstVisualMs: null,
    hasI2VChain: false,
    hasExplicitAnchor: false,
    totalMs: null,
    nativeAllocator: null,
    behaviorRequested: false,
    behaviorEvidenceHeader: '',
    behaviorEvidence: null,
  };
  if (body.audio?.stream) player.begin(ui.voiceWave);

  controller = new AbortController();
  const requestTurn = turn;
  const st = {
    seq: 0, terminal: 0, sawUnified: false, done: false, text: '', finish: '', sessionID, requestID: '',
    behaviorRequested, behaviorEvidenceHeader: '',
  };
  log('request', url.href, JSON.stringify({ ...body, messages: '[redacted media]' }));

  try {
    let res = await fetch(url, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json', Accept: 'text/event-stream' }),
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    if (res.status === 400 && body.session_history) {
      delete body.session_history;
      res = await fetch(url, {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Accept: 'text/event-stream' }),
        body: JSON.stringify(body),
        signal: controller.signal,
      });
    }
    if (!res.ok) {
      const detail = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}: ${limit(detail)}`);
    }
    const type = (res.headers.get('content-type') || '').split(';')[0].trim().toLowerCase();
    if (type !== 'text/event-stream') {
      throw new Error(`Expected text/event-stream, got ${type || 'no content type'}.`);
    }
    st.behaviorEvidenceHeader = normalizeBehaviorEvidenceHeader(
      res.headers.get('x-umminfer-behavior-evidence') || '',
    );

    // One data line carries one event (docs/mixed-output-contract.md), the same
    // flush rule ChatClient.SSEParser uses.
    for await (const line of readLines(res, (chunk) => {
      if (requestTurn.rawCaptureError) return;
      if (requestTurn.rawCaptureBytes + chunk.byteLength > MAX_REPLAY_RAW_BYTES) {
        requestTurn.rawChunks = [];
        requestTurn.rawCaptureBytes = 0;
        requestTurn.rawCaptureError = 'Raw SSE capture exceeded 96 MiB; replay is unavailable for this turn.';
        return;
      }
      requestTurn.rawChunks.push(new Uint8Array(chunk));
      requestTurn.rawCaptureBytes += chunk.byteLength;
    })) {
      if (!line.startsWith('data:')) continue;
      let payload = line.slice(5);
      if (payload.startsWith(' ')) payload = payload.slice(1);
      await consume(payload, st);
      if (st.done) break;
    }

    if (!st.done) throw new Error('The stream ended before [DONE].');
    if (st.sawUnified && st.terminal !== 1) {
      throw new Error('The unified stream ended without a terminal event.');
    }
    if (inflight.size) throw new Error('An artifact stream ended before its final chunk.');

    if (st.sessionID) {
      sessionID = st.sessionID;
      ui.session.hidden = false;
      ui.session.textContent =
        'session ' + sessionID.replace(/^ummweb-/, '').slice(0, 8);
      ui.session.title = sessionID;
    }
    history.push({ role: 'user', content: userLabel });
    history.push({ role: 'assistant', content: st.text });
    finalizeBehaviorEvidence(turn, st.behaviorRequested, st.behaviorEvidenceHeader);
    recordTurnTotal(turn);
    turn.tailText?.classList.remove('caret');
    player.end();
    setStatus(turn.outcome === 'incomplete'
      ? 'Visual output incomplete'
      : (st.finish ? `Completed · ${st.finish}` : 'Completed'));
    setBusy(false);
  } catch (err) {
    player.stop();
    const aborted = stopped || err.name === 'AbortError' || err.cancelled;
    if (turn && !turn.terminal) settleTurnTerminal(turn, aborted ? 'cancelled' : 'error');
    turn.tailText?.classList.remove('caret');
    setBusy(false);
    if (aborted) {
      setStatus('Stopped');
      if (!turn.text && !turn.flow.querySelector('.slot') && !turn.artifacts.childElementCount) {
        turn.legs.textContent = 'Cancelled before response output.';
      }
      finalizeBehaviorEvidence(turn, st.behaviorRequested, st.behaviorEvidenceHeader);
      recordTurnTotal(turn);
    } else {
      setStatus('Error');
      let msg = err.message || String(err);
      if (/failed to fetch/i.test(msg)) {
        msg = `Failed to fetch ${url.href} — check that Base URL matches this page's host/port (${location.origin}/v1) and the server is reachable.`;
      }
      showError(msg);
    }
    log('failed', err.message);
  } finally {
    controller = null;
    turn = null;
  }
}

function limit(text) {
  const trimmed = String(text || '').trim();
  return trimmed.length > 300 ? trimmed.slice(0, 300) + '…' : (trimmed || 'no error detail');
}

function stopGeneration() {
  if (!running) return false;
  stopped = true;
  settleTurnTerminal(turn, 'cancelled');
  player.stop();
  setStatus('Stopping…');
  controller?.abort();
  return true;
}

ui.send.addEventListener('click', send);
ui.stop.addEventListener('click', () => {

});
ui.prompt.addEventListener('keydown', (event) => {

    event.preventDefault();
    send();

});
function applyShowcasePreset(presetId) {

  applyShowcasePresetToControls(presetId, ui, {
    setAudioEnabled(enabled) {

      if (!voiceOn) ui.audio.checked = false;

      applyVoice();

    syncNarrativeControls,
    syncVideoFrameControls,
    saveSettings,
    hasAttachedVideo: () => Boolean(attachedVideo),

}

ui.showcasePresets?.addEventListener('click', (event) => {
  const card = event.target.closest('[data-preset]');
  if (!card) return;
  applyShowcasePreset(card.dataset.preset);

// SESSION_EXPORT_BEGIN
const SESSION_EXPORT_SCHEMA = 'umminfer-web-session-export-v1';
const SESSION_REPLAY_SCHEMA = 'umminfer-web-session-replay-v1';
function isSessionObject(value) {
  return Boolean(value) && typeof value === 'object' && !Array.isArray(value);
}

function canExportSession(turnCount, busy = false) {
  return !busy && Number.isInteger(turnCount) && turnCount > 0;
}

function sanitizeSessionIdForFilename(sessionId) {
  const raw = typeof sessionId === 'string' ? sessionId.trim() : '';
  const cleaned = raw
    .replace(/[^A-Za-z0-9_-]+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^[-_]+|[-_]+$/g, '')
    .slice(0, 64)
    .replace(/[-_]+$/, '');
  return cleaned || 'untitled';
}

function buildSessionExportFilename(sessionId, format = 'json') {
  const ext = format === 'markdown' || format === 'md' ? 'md' : 'json';
  return `umminfer-session-${sanitizeSessionIdForFilename(sessionId)}.${ext}`;
}

function scrubInlineDataUri(text) {
  if (typeof text !== 'string') return '';
  return text.replace(/data:[a-z0-9.+-]+\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=\s]+/gi, '[omitted-base64]');
}

function normalizeVisualSlotForExport(rawSlot, fallbackIndex = 0) {
  if (!rawSlot || typeof rawSlot !== 'object') return null;
  const meta = rawSlot.continuityMeta && typeof rawSlot.continuityMeta === 'object'
    ? rawSlot.continuityMeta : {};
  const id = typeof rawSlot.id === 'string' && rawSlot.id.trim()
    ? rawSlot.id.trim()
    : (typeof rawSlot.slot_id === 'string' && rawSlot.slot_id.trim()
      ? rawSlot.slot_id.trim() : `slot-${fallbackIndex}`);
  const kind = (rawSlot.kind || rawSlot.media_type) === 'video' ? 'video' : 'image';
  const out = { id, kind };
  const slotIndex = rawSlot.slot_index ?? rawSlot.slotIndex;
  if (Number.isInteger(slotIndex) && slotIndex >= 0) out.slot_index = slotIndex;
  const prompt = scrubInlineDataUri(typeof rawSlot.prompt === 'string' ? rawSlot.prompt.trim() : '');
  if (prompt) out.prompt = prompt;
  if (typeof rawSlot.bytes === 'number' && Number.isSafeInteger(rawSlot.bytes) && rawSlot.bytes >= 0) {
    out.bytes = rawSlot.bytes;
  }
  const sha256 = normalizeAnchorSha256(rawSlot.sha256);
  if (sha256) out.sha256 = sha256;
  const rawVariants = Array.isArray(rawSlot.variants) ? rawSlot.variants
    : (isSessionObject(rawSlot.artifactMeta) ? Object.values(rawSlot.artifactMeta) : []);
  const variants = [];
  for (const variant of rawVariants) {
    if (!isSessionObject(variant) || !['image', 'video'].includes(variant.kind) ||
        !Number.isSafeInteger(variant.bytes) || variant.bytes < 0 ||
        !normalizeAnchorSha256(variant.sha256)) continue;
    variants.push({ kind: variant.kind, bytes: variant.bytes,
                    sha256: normalizeAnchorSha256(variant.sha256) });
  }
  variants.sort((a, b) => a.kind.localeCompare(b.kind));
  if (variants.length) out.variants = variants;

  const continuityMode = typeof rawSlot.continuity_mode === 'string' && rawSlot.continuity_mode
    ? rawSlot.continuity_mode
    : (typeof meta.continuity_mode === 'string' && meta.continuity_mode ? meta.continuity_mode : '');
  if (continuityMode) out.continuity_mode = continuityMode;

  const rawAnchorIdx = rawSlot.anchor_slot_index !== undefined
    ? rawSlot.anchor_slot_index : meta.anchor_slot_index;
  const hasAnchorIdx = Number.isInteger(rawAnchorIdx) && rawAnchorIdx >= 0;
  if (hasAnchorIdx) out.anchor_slot_index = rawAnchorIdx;

  const rawExplicit = rawSlot.anchor_explicit !== undefined
    ? rawSlot.anchor_explicit : meta.anchor_explicit;
  if (rawExplicit === true) {
    out.anchor_explicit = true;
  } else if (hasAnchorIdx) {
    out.anchor_explicit = false;
  }

  const anchorSha256 = normalizeAnchorSha256(
    rawSlot.anchor_sha256 !== undefined ? rawSlot.anchor_sha256 : meta.anchor_sha256,
  );
  if (anchorSha256) out.anchor_sha256 = anchorSha256;

  const errorText = typeof rawSlot.error === 'string' && rawSlot.error.trim()
    ? rawSlot.error.trim() : '';
  if (errorText) out.error = errorText;
  if (['pending', 'running', 'completed', 'failed', 'aborted', 'unknown'].includes(rawSlot.terminal_state ?? rawSlot.terminalState)) {
    out.terminal_state = rawSlot.terminal_state ?? rawSlot.terminalState;
  }

  return out;
}

function normalizeObservedMs(value) {
  return typeof value === 'number' && Number.isFinite(value) && value >= 0 ? value : null;
}

function normalizeTurnTelemetryForExport(rawTelemetry, normalizedSlots) {
  const src = rawTelemetry && typeof rawTelemetry === 'object' ? rawTelemetry : null;
  const slots = Array.isArray(normalizedSlots) ? normalizedSlots : [];

  const ttftMs = src ? normalizeObservedMs(src.ttftMs ?? src.ttft_ms) : null;
  const ttfaMs = src ? normalizeObservedMs(src.ttfaMs ?? src.ttfa_ms) : null;
  const firstVisualMs = src ? normalizeObservedMs(src.firstVisualMs ?? src.first_visual_ms) : null;
  const totalMs = src ? normalizeObservedMs(src.totalMs ?? src.total_ms) : null;

  const rawVisualCount = src
    ? (src.visualSettledCount ?? src.visual_slots) : undefined;
  const parsedVisualCount = Number.isInteger(rawVisualCount) && rawVisualCount >= 0
    ? rawVisualCount : 0;
  const visualSlotsCount = Math.max(parsedVisualCount, slots.length);

  let slotI2VCount = 0;
  let slotHasExplicitAnchor = false;
  for (const s of slots) {
    const isI2V = (Number.isInteger(s.anchor_slot_index) && s.anchor_slot_index >= 0) ||
                  s.continuity_mode === 'i2v_chain';
    if (isI2V) slotI2VCount += 1;
    if (s.anchor_explicit === true) slotHasExplicitAnchor = true;
  }
  const rawI2VSource = src ? (src.i2v_count ?? src.i2vCount) : undefined;
  const rawI2VCount = Number.isInteger(rawI2VSource) && rawI2VSource >= 0
    ? rawI2VSource : null;
  const hasI2VFlag = Boolean(src && (src.hasI2VChain === true || src.has_i2v_chain === true));
  const hasExplicitFlag = slotHasExplicitAnchor ||
    Boolean(src && (src.hasExplicitAnchor === true || src.has_explicit_anchor === true));
  const i2vCount = rawI2VCount !== null
    ? Math.max(rawI2VCount, slotI2VCount)
    : (slotI2VCount > 0 ? slotI2VCount : ((hasI2VFlag || hasExplicitFlag) ? 1 : 0));

  const rawNativeAllocator = src ? (src.nativeAllocator ?? src.native_allocator ?? null) : null;
  const rawNativeAllocatorSummary = src ? (src.nativeAllocatorSummary ?? null) : null;
  const vramSummary = rawNativeAllocatorSummary
    ? formatImportedNativeAllocatorSummary(rawNativeAllocatorSummary)
    : summarizeNativeAllocatorTelemetry(rawNativeAllocator);

  const rawBehaviorSummary = src ? (src.behaviorSummary ?? null) : null;
  const rawBehaviorRequested = Boolean(src && (src.behaviorRequested === true || src.behavior_requested === true));
  const rawBehaviorHeader = src
    ? (src.behaviorEvidenceHeader ?? src.behavior_evidence_header ?? '') : '';
  const rawBehaviorPayload = src
    ? (src.behaviorEvidence ?? src.behavior_evidence ?? null) : null;
  const behaviorSummary = rawBehaviorSummary
    ? formatImportedBehaviorSummary(rawBehaviorSummary)
    : summarizeBehaviorEvidence({
        requested: rawBehaviorRequested,
        header: rawBehaviorHeader,
        payload: rawBehaviorPayload,
      });

  const hasAnyMetric = ttftMs !== null || ttfaMs !== null || firstVisualMs !== null ||
    totalMs !== null || visualSlotsCount > 0 || i2vCount > 0 ||
    vramSummary !== null || behaviorSummary !== null;
  if (!hasAnyMetric) {
    return { json: null, formatInput: null };
  }

  const json = {};
  if (ttftMs !== null) json.ttft_ms = ttftMs;
  if (ttfaMs !== null) json.ttfa_ms = ttfaMs;
  if (firstVisualMs !== null) json.first_visual_ms = firstVisualMs;
  if (totalMs !== null) json.total_ms = totalMs;
  json.visual_slots = visualSlotsCount;
  json.i2v_count = i2vCount;

  if (vramSummary !== null) {
    const details = Array.isArray(vramSummary.details)
      ? vramSummary.details
      : vramSummary.title.split('\n').slice(1);
    json.native_allocator = {
      coverage: vramSummary.coverage,
      covered: vramSummary.covered,
      covered_stage_count: vramSummary.coveredStageCount,
      total_stage_count: vramSummary.totalStageCount,
      peak_bytes: vramSummary.covered ? vramSummary.peakBytes : null,
      label: vramSummary.label,
      details,
    };
  }

  if (behaviorSummary !== null) {
    const behaviorOut = {
      status: behaviorSummary.status,
      token_count: behaviorSummary.status === 'exposed' ? behaviorSummary.tokenCount : null,
      supervised_count: behaviorSummary.status === 'exposed' ? behaviorSummary.supervisedCount : null,
      label: behaviorSummary.label,
    };
    if (behaviorSummary.status === 'exposed') {
      const validPayload = rawBehaviorPayload
        ? extractBehaviorEvidence({ behavior: rawBehaviorPayload })
        : null;
      const format = validPayload?.format || behaviorSummary.format || '';
      const tokenizerSha = validPayload?.tokenizer_sha256 || behaviorSummary.tokenizer_sha256 || '';
      if (format) behaviorOut.format = format;
      if (tokenizerSha) behaviorOut.tokenizer_sha256 = tokenizerSha;
    }
    json.behavior_logprobs = behaviorOut;
  }

  const formatInput = {
    ttftMs,
    ttfaMs,
    visualSettledCount: visualSlotsCount,
    firstVisualMs,
    hasI2VChain: i2vCount > 0 || hasI2VFlag,
    hasExplicitAnchor: hasExplicitFlag,
    totalMs,
    nativeAllocator: rawNativeAllocator,
    nativeAllocatorSummary: rawNativeAllocatorSummary,
    behaviorRequested: rawBehaviorRequested,
    behaviorEvidenceHeader: rawBehaviorHeader,
    behaviorEvidence: rawBehaviorPayload,
    behaviorSummary: rawBehaviorSummary,
  };

  return { json, formatInput };
}

function buildSessionExportJson(state = {}) {
  const safeState = state && typeof state === 'object' ? state : {};
  const sessionId = typeof (safeState.session_id ?? safeState.sessionId) === 'string'
    ? (safeState.session_id ?? safeState.sessionId).trim() : '';
  const model = typeof safeState.model === 'string' ? safeState.model.trim() : '';
  const rawExportedAt = safeState.exported_at ?? safeState.exportedAt;
  const exportedAt = typeof rawExportedAt === 'string' && rawExportedAt.trim()
    ? rawExportedAt.trim() : new Date().toISOString();
  const rawTurns = Array.isArray(safeState.turns) ? safeState.turns : [];

  const turns = [];
  for (let i = 0; i < rawTurns.length; i += 1) {
    const rawTurn = rawTurns[i];
    if (!rawTurn || typeof rawTurn !== 'object') continue;
    const rawSlots = rawTurn.visual_slots ?? rawTurn.slots ?? [];
    const slotList = rawSlots instanceof Map
      ? [...rawSlots.values()]
      : (Array.isArray(rawSlots) ? rawSlots : []);
    const visualSlots = [];
    for (let j = 0; j < slotList.length; j += 1) {
      const normalizedSlot = normalizeVisualSlotForExport(slotList[j], j);
      if (normalizedSlot) visualSlots.push(normalizedSlot);
    }

    const prompt = scrubInlineDataUri(
      typeof rawTurn.prompt === 'string'
        ? rawTurn.prompt
        : (rawTurn.role === 'user' && typeof rawTurn.content === 'string' ? rawTurn.content : ''),
    );
    const response = scrubInlineDataUri(
      typeof rawTurn.response === 'string'
        ? rawTurn.response
        : (rawTurn.role === 'assistant' && typeof rawTurn.content === 'string' ? rawTurn.content : ''),
    );
    const role = typeof rawTurn.role === 'string' && rawTurn.role.trim()
      ? rawTurn.role.trim()
      : (prompt && response ? 'turn' : (response ? 'assistant' : (prompt ? 'user' : 'turn')));

    const { json: telemetryJson } = normalizeTurnTelemetryForExport(rawTurn.telemetry, visualSlots);

    const turnOut = {
      index: turns.length + 1,
      role,
      prompt,
      response,
    };
    const asrText = typeof (rawTurn.asr_text ?? rawTurn.asrText) === 'string'
      ? (rawTurn.asr_text ?? rawTurn.asrText).trim() : '';
    if (asrText) turnOut.asr_text = asrText;
    if (rawTurn.interrupted === true) {
      turnOut.interrupted = true;
      const spoken = parseNonNegativeCursor(
        rawTurn.spoken_bytes ?? rawTurn.spokenBytes ?? rawTurn.acknowledgedBytes,
      );
      if (spoken !== null) turnOut.spoken_bytes = spoken;
    }
    const visualReference = rawTurn.visual_reference ?? rawTurn.visualReference;
    if (isSessionObject(visualReference) && typeof visualReference.slot_id === 'string' && visualReference.slot_id) {
      turnOut.visual_reference = {
        slot_id: visualReference.slot_id,
        sha256: normalizeAnchorSha256(visualReference.sha256) || null,
        source_attached: visualReference.source_attached === true,
        edit_source_attached: visualReference.edit_source_attached === true,
      };
    }
    if (['completed', 'incomplete', 'cancelled', 'error'].includes(rawTurn.outcome)) {
      turnOut.outcome = rawTurn.outcome;
    }
    if (isSessionObject(rawTurn.terminal)) {
      turnOut.terminal = JSON.parse(JSON.stringify(rawTurn.terminal));
    }
    turnOut.visual_slots = visualSlots;
    if (telemetryJson !== null) turnOut.telemetry = telemetryJson;
    turns.push(turnOut);
  }

  const report = {
    schema: SESSION_EXPORT_SCHEMA,
    exported_at: exportedAt,
    session_id: sessionId || null,
    model: model || null,
    turn_count: turns.length,
    turns,
  };
  const frameSelection = normalizeVideoFrameSelectionConfig(
    safeState.video_frame_selection ?? safeState.videoFrameSelection);
  if (frameSelection) report.video_frame_selection = frameSelection;
  return report;
}

// RAW_SSE_REPLAY_EXPORT_BEGIN
const MAX_REPLAY_RAW_BYTES = 96 * 1024 * 1024;

function concatRawChunks(chunks) {
  const list = Array.isArray(chunks) ? chunks : [];
  const total = list.reduce((sum, chunk) => sum + (chunk?.byteLength || 0), 0);
  if (total > MAX_REPLAY_RAW_BYTES) throw new Error('Raw SSE capture exceeds the 96 MiB replay limit.');
  const joined = new Uint8Array(total);
  let offset = 0;
  for (const chunk of list) {
    const bytes = chunk instanceof Uint8Array ? chunk : new Uint8Array(chunk);
    joined.set(bytes, offset);
    offset += bytes.length;
  }
  return joined;
}

function splitRawChunks(rawBytes, lengths) {
  const chunks = [];
  let offset = 0;
  for (const length of lengths) {
    chunks.push(rawBytes.slice(offset, offset + length));
    offset += length;
  }
  if (offset !== rawBytes.length) throw new Error('Replay transport chunk lengths do not match raw SSE bytes.');
  return chunks;
}

async function buildSessionReplayJson(state = {}) {
  const report = buildSessionExportJson(state);
  report.schema = SESSION_REPLAY_SCHEMA;
  report.replay_format = 'umminfer-raw-sse-replay-v1';
  const rawTurns = Array.isArray(state?.turns) ? state.turns.filter(isSessionObject) : [];
  let artifactCount = 0;
  let directRenderCount = 0;
  for (let i = 0; i < report.turns.length; i += 1) {
    const rawTurn = rawTurns[i] || {};
    const rawChunks = Array.isArray(rawTurn.raw_chunks) ? rawTurn.raw_chunks : [];
    const events = Array.isArray(rawTurn.events) ? JSON.parse(JSON.stringify(rawTurn.events)) : [];
    const mediaArtifacts = Array.isArray(rawTurn.media_artifacts)
      ? JSON.parse(JSON.stringify(rawTurn.media_artifacts)) : [];
    if (rawTurn.raw_capture_error) throw new Error(rawTurn.raw_capture_error);
    if (events.length) report.turns[i].narrative_events = events;
    if (mediaArtifacts.length) report.turns[i].media_artifacts = mediaArtifacts;
    artifactCount += mediaArtifacts.length;
    const directRenders = Array.isArray(rawTurn.direct_renders) ? rawTurn.direct_renders : [];
    if (directRenders.length) {
      report.turns[i].direct_renders = [];
      for (const record of directRenders) {
        const bytes = record.bytesData || decodeBase64(record.response_base64);
        if (await sha256Hex(bytes) !== record.sha256 || bytes.length !== record.bytes) {
          throw new Error(`Direct render ${record.slot_id} failed its export hash check.`);
        }
        const clean = {
          slot_id: record.slot_id, kind: record.kind, mime_type: record.mime_type,
          bytes: record.bytes, sha256: record.sha256, source_sha256: record.source_sha256 || null,
          prompt: record.prompt || '', request_options: record.request_options || {},
          response_base64: record.response_base64 || encodeBase64(bytes),
        };
        report.turns[i].direct_renders.push(clean);
        directRenderCount += 1;
      }
    }
    if (!rawChunks.length) continue;
    const rawBytes = concatRawChunks(rawChunks);
    report.turns[i].replay = {
      transport: 'raw-sse',
      raw_sse: encodeBase64(rawBytes),
      raw_sse_bytes: rawBytes.length,
      raw_sse_sha256: await sha256Hex(rawBytes),
      chunk_lengths: rawChunks.map((chunk) => chunk.byteLength),
      terminal_required: !['cancelled', 'error'].includes(rawTurn.outcome),
    };
  }
  report.replay_artifact_count = artifactCount;
  if (directRenderCount) report.direct_render_count = directRenderCount;
  return report;
}
// RAW_SSE_REPLAY_EXPORT_END

function buildSessionExportMarkdown(state = {}) {
  const safeState = state && typeof state === 'object' ? state : {};
  const report = buildSessionExportJson(safeState);
  const rawTurns = Array.isArray(safeState.turns) ? safeState.turns : [];
  const validRawTurns = rawTurns.filter((t) => t && typeof t === 'object');

  const lines = [
    '# ummInfer Session Export',
    '',
    `- **Session ID:** ${report.session_id ? `\`${report.session_id}\`` : '_none_'}`,
  ];
  if (report.model) lines.push(`- **Model:** \`${report.model}\``);
  lines.push(`- **Exported at:** \`${report.exported_at}\``);
  lines.push(`- **Turns:** ${report.turn_count}`);

  if (report.turn_count === 0) {
    lines.push('', '_No turns recorded._');
    return lines.join('\n') + '\n';
  }

  for (let i = 0; i < report.turns.length; i += 1) {
    const turnItem = report.turns[i];
    const rawTurn = validRawTurns[i] || {};
    lines.push('', '---', '', `## Turn ${turnItem.index}`);

    if (turnItem.prompt) {
      lines.push('', '### User', '', turnItem.prompt);
    }
    if (turnItem.asr_text) {
      lines.push('', `> _ASR:_ ${turnItem.asr_text}`);
    }

    const hasAssistantSection = Boolean(turnItem.response) || turnItem.interrupted === true ||
      turnItem.visual_slots.length > 0 || Boolean(turnItem.telemetry);
    if (hasAssistantSection) {
      let heading = '### Assistant';
      if (turnItem.interrupted === true) {
        const badge = formatInterruptedBadge(turnItem.spoken_bytes);
        heading += ` · ${badge || 'Interrupted'}`;
      }
      lines.push('', heading);
      if (turnItem.response) {
        lines.push('', turnItem.response);
      }
    }

    if (turnItem.visual_slots.length > 0) {
      lines.push('', '#### Visual Slots', '');
      for (const slot of turnItem.visual_slots) {
        const kindLabel = slot.kind === 'video' ? 'Video' : 'Image';
        const badge = visualSlotContinuityBadge(slot);
        const headerParts = [`**${kindLabel}**`];
        if (badge) headerParts.push(`\`${badge.text}\``);
        const metaParts = [];
        const formattedBytes = formatAllocatorBytes(slot.bytes);
        if (formattedBytes !== null) metaParts.push(`\`${formattedBytes}\``);
        if (slot.sha256) metaParts.push(`\`sha256: ${slot.sha256.slice(0, 8)}\``);
        if (slot.error) metaParts.push(`error: ${slot.error}`);
        let item = `- \`${slot.id}\` (${headerParts.join(', ')})`;
        if (slot.prompt) item += ` — ${slot.prompt}`;
        if (metaParts.length) item += ` (${metaParts.join(', ')})`;
        lines.push(item);
      }
    }

    const { formatInput } = normalizeTurnTelemetryForExport(rawTurn.telemetry, turnItem.visual_slots);
    const pills = formatInput ? formatTurnTelemetry(formatInput) : [];
    if (pills.length > 0) {
      const pillText = pills.map((p) => `\`${p.label}\``).join(' · ');
      lines.push('', `**Telemetry:** ${pillText}`);
    }
  }

  return lines.join('\n') + '\n';
}

function downloadSessionText(content, mime, filename) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.rel = 'noopener';
  if (document.body && typeof document.body.append === 'function') {
    document.body.append(link);
  }
  try {
    link.click();
  } finally {
    if (typeof link.remove === 'function') link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }
  return { filename, mime, bytes: blob.size };
}

function triggerSessionExportDownload(state, format = 'json') {
  const isMarkdown = format === 'markdown' || format === 'md';
  const isReplay = format === 'replay';
  const filename = buildSessionExportFilename(
    state?.session_id ?? state?.sessionId ?? '',
    isMarkdown ? 'markdown' : 'json',
  );
  const mime = isMarkdown ? 'text/markdown;charset=utf-8' : 'application/json;charset=utf-8';
  if (isReplay) {
    return buildSessionReplayJson(state).then((report) => downloadSessionText(
      JSON.stringify(report, null, 2) + '\n', mime, filename.replace(/\.json$/, '.replay.json')));
  }
  const content = isMarkdown
    ? buildSessionExportMarkdown(state)
    : JSON.stringify(buildSessionExportJson(state), null, 2) + '\n';
  return downloadSessionText(content, mime, filename);
}
// SESSION_EXPORT_END

// SESSION_IMPORT_BEGIN
const MAX_IMPORT_SESSION_BYTES = 2 * 1024 * 1024;
const MAX_IMPORT_FILE_BYTES = 128 * 1024 * 1024;
const MAX_IMPORT_TURNS = 1000;
const SUPPORTED_IMPORT_SCHEMAS = Object.freeze(new Set([
  'umminfer-web-session-export-v1',
  'umminfer-web-session-replay-v1',
  'umminfer-session-export-v1',
]));
const VALID_IMPORT_TURN_ROLES = Object.freeze(new Set(['user', 'assistant', 'turn']));
const VALID_IMPORT_SLOT_KINDS = Object.freeze(new Set(['image', 'video']));
const VALID_IMPORT_VRAM_COVERAGE = Object.freeze(new Set(['COVERED', 'PARTIAL', 'NOT_COVERED']));
const VALID_IMPORT_BEHAVIOR_STATUS = Object.freeze(new Set(['exposed', 'not_exposed', 'absent']));

function isPlainObject(value) {
  return Boolean(value) && typeof value === 'object' && !Array.isArray(value);
}

function parseOptionalStringField(obj, key, context) {
  const val = obj[key];
  if (val === undefined || val === null) return null;
  if (typeof val !== 'string') {
    throw new Error(`${context}.${key} must be a string.`);
  }
  const trimmed = val.trim();
  return trimmed || null;
}

function parseOptionalNonNegInt(obj, key, context) {
  const val = obj[key];
  if (val === undefined || val === null) return null;
  if (typeof val !== 'number' || !Number.isSafeInteger(val) || val < 0) {
    throw new Error(`${context}.${key} must be a non-negative integer.`);
  }
  return val;
}

function parseOptionalNonNegMs(obj, key, context) {
  const val = obj[key];
  if (val === undefined || val === null) return null;
  if (typeof val !== 'number' || !Number.isFinite(val) || val < 0) {
    throw new Error(`${context}.${key} must be a non-negative finite number.`);
  }
  return val;
}

function parseImportedVisualSlot(rawSlot, turnLabel, slotIdx) {
  const ctx = `${turnLabel}.visual_slots[${slotIdx}]`;
  if (!isPlainObject(rawSlot)) {
    throw new Error(`${ctx} must be an object.`);
  }
  const rawId = rawSlot.id !== undefined ? rawSlot.id : rawSlot.slot_id;
  if (typeof rawId !== 'string' || !rawId.trim()) {
    throw new Error(`${ctx} must have a non-empty string id or slot_id.`);
  }
  const slotIndex = parseOptionalNonNegInt(rawSlot, 'slot_index', ctx);
  if (typeof rawSlot.kind !== 'string' || !VALID_IMPORT_SLOT_KINDS.has(rawSlot.kind)) {
    throw new Error(`${ctx}.kind must be "image" or "video".`);
  }
  const rawPrompt = rawSlot.prompt;
  if (rawPrompt !== undefined && rawPrompt !== null && typeof rawPrompt !== 'string') {
    throw new Error(`${ctx}.prompt must be a string.`);
  }
  const prompt = scrubInlineDataUri(typeof rawPrompt === 'string' ? rawPrompt.trim() : '');
  const bytes = parseOptionalNonNegInt(rawSlot, 'bytes', ctx);
  const rawSha = parseOptionalStringField(rawSlot, 'sha256', ctx);
  const sha256 = rawSha ? normalizeAnchorSha256(rawSha) : '';

  const rawContinuity = rawSlot.continuity_mode;
  let continuityMode = '';
  if (rawContinuity !== undefined && rawContinuity !== null) {
    if (typeof rawContinuity !== 'string') {
      throw new Error(`${ctx}.continuity_mode must be a string.`);
    }
    const trimmed = rawContinuity.trim();
    if (trimmed && !VALID_CONTINUITY_MODES.has(trimmed)) {
      throw new Error(`${ctx}.continuity_mode is unsupported: ${trimmed}.`);
    }
    continuityMode = trimmed === 'off' ? '' : trimmed;
  }

  const anchorSlotIndex = parseOptionalNonNegInt(rawSlot, 'anchor_slot_index', ctx);
  const rawExplicit = rawSlot.anchor_explicit;
  if (rawExplicit !== undefined && rawExplicit !== null && typeof rawExplicit !== 'boolean') {
    throw new Error(`${ctx}.anchor_explicit must be a boolean.`);
  }
  const anchorExplicit = rawExplicit === true;
  const rawAnchorSha = parseOptionalStringField(rawSlot, 'anchor_sha256', ctx);
  const anchorSha256 = rawAnchorSha ? normalizeAnchorSha256(rawAnchorSha) : '';
  const errorText = parseOptionalStringField(rawSlot, 'error', ctx) || '';
  const terminalState = parseOptionalStringField(rawSlot, 'terminal_state', ctx) || '';
  if (terminalState && !['pending', 'running', 'completed', 'failed', 'aborted', 'unknown'].includes(terminalState)) {
    throw new Error(`${ctx}.terminal_state is unsupported.`);
  }
  const variants = [];
  if (rawSlot.variants !== undefined && rawSlot.variants !== null) {
    if (!Array.isArray(rawSlot.variants)) throw new Error(`${ctx}.variants must be an array.`);
    for (const [variantIndex, variant] of rawSlot.variants.entries()) {
      if (!isPlainObject(variant) || !['image', 'video'].includes(variant.kind)) {
        throw new Error(`${ctx}.variants[${variantIndex}] has invalid kind.`);
      }
      const variantBytes = parseOptionalNonNegInt(variant, 'bytes', `${ctx}.variants[${variantIndex}]`);
      const variantSha = parseOptionalStringField(variant, 'sha256', `${ctx}.variants[${variantIndex}]`);
      if (variantBytes === null || !/^[0-9a-f]{64}$/i.test(variantSha || '')) {
        throw new Error(`${ctx}.variants[${variantIndex}] requires exact bytes and SHA-256.`);
      }
      variants.push({ kind: variant.kind, bytes: variantBytes, sha256: variantSha.toLowerCase() });
    }
  }

  return {
    id: rawId.trim(),
    slot_index: slotIndex,
    kind: rawSlot.kind,
    prompt,
    bytes,
    sha256,
    continuity_mode: continuityMode,
    anchor_slot_index: anchorSlotIndex !== null ? anchorSlotIndex : undefined,
    anchor_explicit: anchorExplicit,
    anchor_sha256: anchorSha256,
    error: errorText,
    terminal_state: terminalState || null,
    variants,
  };
}

function parseImportedNativeAllocator(rawNa, turnLabel) {
  if (rawNa === undefined || rawNa === null) return null;
  const ctx = `${turnLabel}.telemetry.native_allocator`;
  if (!isPlainObject(rawNa)) {
    throw new Error(`${ctx} must be an object.`);
  }
  if (typeof rawNa.coverage !== 'string' || !VALID_IMPORT_VRAM_COVERAGE.has(rawNa.coverage)) {
    throw new Error(`${ctx}.coverage must be COVERED, PARTIAL, or NOT_COVERED.`);
  }
  if (typeof rawNa.covered !== 'boolean') {
    throw new Error(`${ctx}.covered must be a boolean.`);
  }
  if (rawNa.covered && rawNa.coverage === 'NOT_COVERED') {
    throw new Error(`${ctx} cannot have covered=true with coverage=NOT_COVERED.`);
  }
  if (!rawNa.covered && rawNa.coverage !== 'NOT_COVERED') {
    throw new Error(`${ctx} cannot have covered=false with coverage=${rawNa.coverage}.`);
  }
  const coveredStageCount = parseOptionalNonNegInt(rawNa, 'covered_stage_count', ctx);
  const totalStageCount = parseOptionalNonNegInt(rawNa, 'total_stage_count', ctx);
  if (coveredStageCount !== null && totalStageCount !== null && coveredStageCount > totalStageCount) {
    throw new Error(`${ctx}.covered_stage_count exceeds total_stage_count.`);
  }
  let peakBytes = null;
  if (rawNa.covered) {
    peakBytes = parseOptionalNonNegMs(rawNa, 'peak_bytes', ctx);
    if (peakBytes === null) {
      throw new Error(`${ctx}.peak_bytes is required when covered=true.`);
    }
  } else if (rawNa.peak_bytes !== undefined && rawNa.peak_bytes !== null) {
    throw new Error(`${ctx}.peak_bytes must be null when covered=false.`);
  }
  if (rawNa.label !== undefined && rawNa.label !== null && typeof rawNa.label !== 'string') {
    throw new Error(`${ctx}.label must be a string.`);
  }
  let details = [];
  if (rawNa.details !== undefined && rawNa.details !== null) {
    if (!Array.isArray(rawNa.details) || !rawNa.details.every((d) => typeof d === 'string')) {
      throw new Error(`${ctx}.details must be an array of strings.`);
    }
    details = rawNa.details.map((d) => d.trim()).filter(Boolean);
  }
  return {
    coverage: rawNa.coverage,
    covered: rawNa.covered,
    covered_stage_count: coveredStageCount !== null ? coveredStageCount : (rawNa.covered ? 1 : 0),
    total_stage_count: totalStageCount !== null ? totalStageCount : details.length,
    peak_bytes: peakBytes,
    details,
  };
}

function parseImportedBehaviorLogprobs(rawBehavior, turnLabel) {
  if (rawBehavior === undefined || rawBehavior === null) return null;
  const ctx = `${turnLabel}.telemetry.behavior_logprobs`;
  if (!isPlainObject(rawBehavior)) {
    throw new Error(`${ctx} must be an object.`);
  }
  if (typeof rawBehavior.status !== 'string' || !VALID_IMPORT_BEHAVIOR_STATUS.has(rawBehavior.status)) {
    throw new Error(`${ctx}.status must be exposed, not_exposed, or absent.`);
  }
  if (rawBehavior.label !== undefined && rawBehavior.label !== null && typeof rawBehavior.label !== 'string') {
    throw new Error(`${ctx}.label must be a string.`);
  }
  if (rawBehavior.status === 'exposed') {
    const tokenCount = parseOptionalNonNegInt(rawBehavior, 'token_count', ctx);
    const supervisedCount = parseOptionalNonNegInt(rawBehavior, 'supervised_count', ctx);
    if (tokenCount === null || supervisedCount === null) {
      throw new Error(`${ctx} requires non-negative integer token_count and supervised_count when exposed.`);
    }
    if (supervisedCount > tokenCount) {
      throw new Error(`${ctx}.supervised_count cannot exceed token_count.`);
    }
    const format = parseOptionalStringField(rawBehavior, 'format', ctx) || '';
    const tokenizerSha = parseOptionalStringField(rawBehavior, 'tokenizer_sha256', ctx) || '';
    return {
      status: 'exposed',
      token_count: tokenCount,
      supervised_count: supervisedCount,
      format,
      tokenizer_sha256: tokenizerSha,
    };
  }
  if ((rawBehavior.token_count !== undefined && rawBehavior.token_count !== null) ||
      (rawBehavior.supervised_count !== undefined && rawBehavior.supervised_count !== null)) {
    throw new Error(`${ctx} must have null token_count and supervised_count when status is ${rawBehavior.status}.`);
  }
  return {
    status: rawBehavior.status,
    token_count: null,
    supervised_count: null,
    format: '',
    tokenizer_sha256: '',
  };
}

function buildImportedTelemetryRecord(rawTelemetry, visualSlots, turnLabel) {
  if (rawTelemetry === undefined || rawTelemetry === null) return null;
  const ctx = `${turnLabel}.telemetry`;
  if (!isPlainObject(rawTelemetry)) {
    throw new Error(`${ctx} must be an object.`);
  }
  const ttftMs = parseOptionalNonNegMs(rawTelemetry, 'ttft_ms', ctx);
  const ttfaMs = parseOptionalNonNegMs(rawTelemetry, 'ttfa_ms', ctx);
  const firstVisualMs = parseOptionalNonNegMs(rawTelemetry, 'first_visual_ms', ctx);
  const totalMs = parseOptionalNonNegMs(rawTelemetry, 'total_ms', ctx);
  const visualSlotsCount = parseOptionalNonNegInt(rawTelemetry, 'visual_slots', ctx) ?? 0;
  const i2vCount = parseOptionalNonNegInt(rawTelemetry, 'i2v_count', ctx) ?? 0;
  const nativeAllocatorSummary = parseImportedNativeAllocator(rawTelemetry.native_allocator, turnLabel);
  const behaviorSummary = parseImportedBehaviorLogprobs(rawTelemetry.behavior_logprobs, turnLabel);

  const slotHasI2V = visualSlots.some(
    (s) => (Number.isInteger(s.anchor_slot_index) && s.anchor_slot_index >= 0) ||
           s.continuity_mode === 'i2v_chain' || s.anchor_explicit === true,
  );
  const slotHasExplicitAnchor = visualSlots.some((s) => s.anchor_explicit === true);

  const hasAnyMetric = ttftMs !== null || ttfaMs !== null || firstVisualMs !== null ||
    totalMs !== null || visualSlotsCount > 0 || i2vCount > 0 ||
    nativeAllocatorSummary !== null || behaviorSummary !== null;
  if (!hasAnyMetric) return null;

  return {
    startedAt: null,
    ttftMs,
    ttfaMs,
    visualSettledCount: Math.max(visualSlotsCount, visualSlots.length),
    settledSlotIds: new Set(),
    firstVisualMs,
    hasI2VChain: i2vCount > 0 || slotHasI2V,
    hasExplicitAnchor: slotHasExplicitAnchor,
    i2vCount,
    totalMs,
    nativeAllocator: null,
    nativeAllocatorSummary,
    behaviorRequested: behaviorSummary !== null,
    behaviorEvidenceHeader: behaviorSummary ? behaviorSummary.status : '',
    behaviorEvidence: null,
    behaviorSummary,
  };
}

// RAW_SSE_REPLAY_IMPORT_BEGIN
function canonicalJson(value) {
  if (Array.isArray(value)) return '[' + value.map(canonicalJson).join(',') + ']';
  if (value && typeof value === 'object') {
    return '{' + Object.keys(value).sort().map((key) => JSON.stringify(key) + ':' + canonicalJson(value[key])).join(',') + '}';
  }
  return JSON.stringify(value);
}

function parseImportedReplay(rawReplay, turnLabel) {
  const ctx = `${turnLabel}.replay`;
  if (!isPlainObject(rawReplay) || rawReplay.transport !== 'raw-sse') {
    throw new Error(`${ctx} must be a raw-sse object.`);
  }
  const encoded = parseOptionalStringField(rawReplay, 'raw_sse', ctx);
  const rawSha = parseOptionalStringField(rawReplay, 'raw_sse_sha256', ctx);
  const rawBytesDeclared = parseOptionalNonNegInt(rawReplay, 'raw_sse_bytes', ctx);
  if (!encoded || !/^[0-9a-f]{64}$/.test(rawSha || '') || rawBytesDeclared === null) {
    throw new Error(`${ctx} requires canonical raw SSE bytes and a SHA-256 digest.`);
  }
  if (encoded.length > Math.ceil(MAX_REPLAY_RAW_BYTES / 3) * 4 + 4) {
    throw new Error(`${ctx} exceeds the 96 MiB raw SSE limit.`);
  }
  const rawBytes = decodeBase64(encoded);
  if (encodeBase64(rawBytes) !== encoded) throw new Error(`${ctx}.raw_sse must be canonical base64.`);
  if (rawBytes.length !== rawBytesDeclared || rawBytes.length > MAX_REPLAY_RAW_BYTES) {
    throw new Error(`${ctx}.raw_sse_bytes does not match the decoded bytes.`);
  }
  if (!Array.isArray(rawReplay.chunk_lengths) || !rawReplay.chunk_lengths.length) {
    throw new Error(`${ctx}.chunk_lengths must be a non-empty array.`);
  }
  for (const length of rawReplay.chunk_lengths) {
    if (!Number.isSafeInteger(length) || length < 0) throw new Error(`${ctx}.chunk_lengths contains an invalid length.`);
  }
  const chunks = splitRawChunks(rawBytes, rawReplay.chunk_lengths);
  return {
    rawBytes,
    rawSha,
    chunks,
    terminalRequired: rawReplay.terminal_required === true,
  };
}

function rawSsePayloads(rawBytes) {
  let text;
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(rawBytes); }
  catch { throw new Error('Raw SSE replay is not valid UTF-8.'); }
  const payloads = [];
  for (let line of text.split('\n')) {
    if (line.endsWith('\r')) line = line.slice(0, -1);
    if (!line.startsWith('data:')) continue;
    let payload = line.slice(5);
    if (payload.startsWith(' ')) payload = payload.slice(1);
    payloads.push(payload);
  }
  return payloads;
}

function verifyTerminalAndVisualSlots(item, events, actualMedia, ownership, turnIndex) {
  const terminalEvent = events.find((event) => ['complete', 'cancelled', 'error'].includes(event.kind)) || null;
  const expectedState = terminalEvent
    ? ({ complete: 'completed', cancelled: 'cancelled', error: 'error' }[terminalEvent.kind])
    : (['cancelled', 'error'].includes(item.outcome) ? item.outcome : null);
  if (!item.terminal || item.terminal.state !== expectedState) {
    throw new Error(`turns[${turnIndex}] terminal kind does not match its recorded outcome.`);
  }
  if (ownership.requestID && item.terminal.request_id !== ownership.requestID) {
    throw new Error(`turns[${turnIndex}] terminal request id mismatch.`);
  }
  if (canonicalJson(item.terminal.legs || []) !== canonicalJson(terminalEvent?.legs || [])) {
    throw new Error(`turns[${turnIndex}] terminal legs do not match raw SSE.`);
  }
  if (terminalEvent?.kind === 'complete' && !['completed', 'incomplete'].includes(item.outcome)) {
    throw new Error(`turns[${turnIndex}] raw complete conflicts with outcome ${item.outcome}.`);
  }
  if (terminalEvent?.kind === 'cancelled' && item.outcome !== 'cancelled') {
    throw new Error(`turns[${turnIndex}] raw cancellation conflicts with outcome ${item.outcome}.`);
  }
  const rawSlots = new Map();
  for (const event of events) {
    if (event.kind === 'visual_slot' && typeof event.slot_id === 'string') {
      if (rawSlots.has(event.slot_id)) throw new Error(`turns[${turnIndex}] has duplicate raw slot ids.`);
      rawSlots.set(event.slot_id, event);
    }
  }
  const exportedSlots = item.visual_slots || [];
  const exportedById = new Map();
  for (const slot of exportedSlots) {
    if (exportedById.has(slot.id)) throw new Error(`turns[${turnIndex}] has duplicate exported slot ids.`);
    exportedById.set(slot.id, slot);
  }
  for (const id of rawSlots.keys()) {
    if (!exportedById.has(id)) throw new Error(`turns[${turnIndex}] omits raw visual slot ${id}.`);
  }
  const mediaBySlot = new Map(actualMedia.filter((entry) => entry.slot_id).map((entry) => [entry.slot_id, entry]));
  const mediaById = new Map(actualMedia.map((entry) => [entry.artifact_id, entry]));
  const legs = new Map((terminalEvent?.legs || []).filter((leg) => typeof leg.slot_id === 'string').map((leg) => [leg.slot_id, leg]));
  const position = (slot) => Number.isInteger(slot.slot_index) ? slot.slot_index
    : (/^slot-(\d+)$/.test(slot.id) ? Number(slot.id.slice(5)) : null);
  for (const [id, slot] of exportedById) {
    const raw = rawSlots.get(id);
    if (!raw) {
      const media = mediaById.get(id);
      if (!media || media.sha256 !== slot.sha256 || media.bytes !== slot.bytes) {
        throw new Error(`turns[${turnIndex}] has an unbound non-slot visual ${id}.`);
      }
      continue;
    }
    const variants = Array.isArray(slot.variants) ? slot.variants : [];
    const rawVariant = variants.find((variant) => variant.kind === raw.media_type) ||
      (slot.kind === raw.media_type ? slot : null);
    const hasDisplayedDirectVariant = slot.kind === raw.media_type ||
      (item.direct_renders || []).some((record) => record.slot_id === id && record.kind === slot.kind);
    if (!rawVariant || !hasDisplayedDirectVariant ||
        (slot.slot_index !== null && slot.slot_index !== undefined && slot.slot_index !== raw.slot_index)) {
      throw new Error(`turns[${turnIndex}] slot identity/variant mismatch for ${id}.`);
    }
    for (const field of ['continuity_mode', 'anchor_slot_index', 'anchor_explicit']) {
      const matches = field === 'anchor_explicit'
        ? Boolean(slot[field]) === Boolean(raw[field])
        : ((slot[field] ?? null) === (raw[field] ?? null) || (field === 'continuity_mode' && !slot[field] && !raw[field]));
      if (!matches) throw new Error(`turns[${turnIndex}] slot ${field} mismatch for ${id}.`);
    }
    if (terminalEvent && legs.has(id) && slot.terminal_state !== legs.get(id).state) {
      throw new Error(`turns[${turnIndex}] terminal slot state mismatch for ${id}.`);
    }
    if (slot.terminal_state === 'completed') {
      const media = mediaBySlot.get(id);
      if (!media || media.sha256 !== rawVariant.sha256 || media.bytes !== rawVariant.bytes) {
        throw new Error(`turns[${turnIndex}] completed slot ${id} does not match its artifact.`);
      }
    }
    if (item.outcome === 'cancelled' && ['pending', 'running'].includes(slot.terminal_state)) {
      throw new Error(`turns[${turnIndex}] cancelled slot ${id} remains unresolved.`);
    }
    if (Number.isInteger(slot.anchor_slot_index)) {
      const source = exportedSlots.find((candidate) => position(candidate) === slot.anchor_slot_index);
      const sourceImageSha = source ? ((source.variants || []).find((variant) => variant.kind === 'image')?.sha256 ||
        (source.kind === 'image' ? source.sha256 : null)) : null;
      if (!source || source.terminal_state !== 'completed' || !sourceImageSha ||
          position(source) === null || position(source) >= position(slot) || !/^[0-9a-f]{64}$/.test(sourceImageSha)) {
        throw new Error(`turns[${turnIndex}] slot ${id} lacks an earlier completed image anchor.`);
      }
      if (slot.anchor_explicit === true &&
          (!/^[0-9a-f]{64}$/.test(slot.anchor_sha256 || '') || slot.anchor_sha256 !== sourceImageSha)) {
        throw new Error(`turns[${turnIndex}] explicit anchor ${id} has no exact source digest.`);
      }
    }
  }
}

function parseDirectRenderRecord(raw, turnLabel, index) {
  const ctx = `${turnLabel}.direct_renders[${index}]`;
  if (!isPlainObject(raw) || typeof raw.slot_id !== 'string' || !raw.slot_id ||
      !['image', 'video'].includes(raw.kind)) {
    throw new Error(`${ctx} requires a slot id and image/video kind.`);
  }
  const bytes = parseOptionalNonNegInt(raw, 'bytes', ctx);
  const sha = parseOptionalStringField(raw, 'sha256', ctx);
  const encoded = parseOptionalStringField(raw, 'response_base64', ctx);
  const mime = parseOptionalStringField(raw, 'mime_type', ctx);
  const sourceSha = parseOptionalStringField(raw, 'source_sha256', ctx);
  if (bytes === null || !/^[0-9a-f]{64}$/i.test(sha || '') || !encoded || !mime ||
      (sourceSha && !/^[0-9a-f]{64}$/i.test(sourceSha))) {
    throw new Error(`${ctx} requires exact media metadata.`);
  }
  const bytesData = decodeBase64(encoded);
  if (encodeBase64(bytesData) !== encoded || bytesData.length !== bytes || bytes > 48 * 1024 * 1024) {
    throw new Error(`${ctx} response bytes are noncanonical, oversized, or inconsistent.`);
  }
  const options = raw.request_options === undefined || raw.request_options === null ? {} : raw.request_options;
  if (!isPlainObject(options) || canonicalJson(options).includes('base64,')) {
    throw new Error(`${ctx}.request_options must not contain media payloads.`);
  }
  return {
    slot_id: raw.slot_id, kind: raw.kind, mime_type: mime, bytes, sha256: sha.toLowerCase(),
    source_sha256: sourceSha ? sourceSha.toLowerCase() : null,
    prompt: typeof raw.prompt === 'string' ? raw.prompt : '', request_options: options,
    response_base64: encoded, bytesData,
  };
}

async function verifyImportedReplay(parsed) {
  if (parsed.schema !== SESSION_REPLAY_SCHEMA) return { turns: 0, artifacts: 0 };
  let artifactTotal = 0;
  for (let turnIndex = 0; turnIndex < parsed.turns.length; turnIndex += 1) {
    const item = parsed.turns[turnIndex];
    const replay = item.replay;
    if (!replay) continue;
    if (await sha256Hex(replay.rawBytes) !== replay.rawSha) {
      throw new Error(`turns[${turnIndex}] raw SSE SHA-256 mismatch.`);
    }
    const payloads = replay.payloads || rawSsePayloads(replay.rawBytes);
    const expectedEvents = [];
    const ownership = { sessionID: parsed.session_id || '', requestID: '' };
    const artifacts = new Map();
    let seq = 0;
    let terminal = 0;
    let done = 0;
    for (const payload of payloads) {
      if (payload === '[DONE]') { done += 1; continue; }
      const root = JSON.parse(payload);
      if (!root.unified) continue;
      const unified = root.unified;
      validateUnifiedOwnership(ownership, unified);
      if (terminal) throw new Error(`turns[${turnIndex}] has an event after its terminal.`);
      if (unified.seq !== seq) throw new Error(`turns[${turnIndex}] has a non-contiguous unified sequence.`);
      seq += 1;
      ownership.requestID ||= unified.request_id || '';
      if (['complete', 'cancelled', 'error'].includes(unified.kind)) terminal += 1;
      recordNarrativeEvent({ events: expectedEvents }, unified);
      const chunk = unified.artifact;
      if (unified.kind !== 'artifact' || !chunk) continue;
      if (typeof chunk.artifact_id !== 'string' || !chunk.artifact_id) throw new Error('Replay artifact id is missing.');
      let assembly = artifacts.get(chunk.artifact_id);
      if (!assembly) {
        assembly = { chunk, parts: [], complete: false };
        artifacts.set(chunk.artifact_id, assembly);
      }
      requireStableArtifactAttribution(assembly.chunk, chunk);
      if (assembly.complete || !Number.isSafeInteger(chunk.index) || !Number.isSafeInteger(chunk.total) ||
          chunk.total < 1 || chunk.index < 0 || chunk.index >= chunk.total ||
          chunk.total !== assembly.chunk.total || assembly.parts[chunk.index]) {
        throw new Error(`Replay artifact ${chunk.artifact_id} has duplicate or inconsistent chunks.`);
      }
      assembly.parts[chunk.index] = decodeBase64(chunk.data);
      if (chunk.index + 1 === chunk.total) {
        assembly.complete = true;
        assembly.finalChunk = chunk;
      }
    }
    const actualEventProjection = canonicalJson(expectedEvents);
    const indexedEventProjection = canonicalJson(item.narrative_events || []);
    if (actualEventProjection !== indexedEventProjection) {
      let mismatchAt = 0;
      while (actualEventProjection[mismatchAt] === indexedEventProjection[mismatchAt]) mismatchAt += 1;
      throw new Error(`turns[${turnIndex}] narrative event projection mismatch at ${mismatchAt}: raw=${actualEventProjection.slice(mismatchAt, mismatchAt + 120)} index=${indexedEventProjection.slice(mismatchAt, mismatchAt + 120)}`);
    }
    if (replay.terminalRequired && (terminal !== 1 || done !== 1)) {
      throw new Error(`turns[${turnIndex}] requires exactly one terminal and one [DONE].`);
    }
    if (terminal > 1 || done > 1) throw new Error(`turns[${turnIndex}] has duplicate terminal or [DONE].`);
    const actualMedia = [];
    for (const [artifactId, assembly] of artifacts) {
      if (!assembly.complete || assembly.parts.length !== assembly.chunk.total ||
          assembly.parts.some((part) => !(part instanceof Uint8Array))) {
        throw new Error(`Replay artifact ${artifactId} is incomplete.`);
      }
      const bytes = concatRawChunks(assembly.parts);
      if (bytes.length > MAX_REPLAY_RAW_BYTES) throw new Error(`Replay artifact ${artifactId} exceeds the size limit.`);
      const finalChunk = assembly.finalChunk;
      const digest = await sha256Hex(bytes);
      if (digest !== String(finalChunk.sha256 || '').toLowerCase()) {
        throw new Error(`Replay artifact ${artifactId} SHA-256 mismatch.`);
      }
      if (Number.isSafeInteger(finalChunk.bytes) && finalChunk.bytes !== bytes.length) {
        throw new Error(`Replay artifact ${artifactId} byte count mismatch.`);
      }
      actualMedia.push({
        artifact_id: artifactId,
        media_type: finalChunk.media_type || null,
        mime_type: finalChunk.mime_type,
        bytes: bytes.length,
        sha256: digest,
        slot_id: finalChunk.slot_id || null,
        slot_index: Number.isInteger(finalChunk.slot_index) ? finalChunk.slot_index : null,
        stream_index: Number.isInteger(finalChunk.stream_index) ? finalChunk.stream_index : null,
        sample_rate: Number.isInteger(finalChunk.sample_rate) ? finalChunk.sample_rate : null,
        channels: Number.isInteger(finalChunk.channels) ? finalChunk.channels : null,
        anchor_slot_index: Number.isInteger(finalChunk.anchor_slot_index) ? finalChunk.anchor_slot_index : null,
        anchor_sha256: normalizeAnchorSha256(finalChunk.anchor_sha256) || null,
      });
    }
    const expectedMedia = new Map((item.media_artifacts || []).map((entry) => [entry.artifact_id, entry]));
    if (expectedMedia.size !== (item.media_artifacts || []).length || actualMedia.length !== (item.media_artifacts || []).length ||
        actualMedia.some((entry) => canonicalJson(entry) !== canonicalJson(expectedMedia.get(entry.artifact_id)))) {
      throw new Error(`turns[${turnIndex}] content-addressed media index does not match raw SSE.`);
    }
    artifactTotal += actualMedia.length;
    const visualById = new Map((item.visual_slots || []).map((slot) => [slot.id, slot]));
    for (const record of item.direct_renders || []) {
      const slot = visualById.get(record.slot_id);
      const bytes = record.bytesData || decodeBase64(record.response_base64);
      if (!slot || await sha256Hex(bytes) !== record.sha256 || bytes.length !== record.bytes) {
        throw new Error(`turns[${turnIndex}] direct render hash/slot mismatch.`);
      }
      const variant = (slot.variants || []).find((entry) => entry.kind === record.kind);
      if (!variant || variant.sha256 !== record.sha256 || variant.bytes !== record.bytes) {
        throw new Error(`turns[${turnIndex}] direct render variant is not preserved.`);
      }
      const rawSlot = expectedEvents.find((event) => event.kind === 'visual_slot' && event.slot_id === record.slot_id);
      if (record.kind === 'video' && rawSlot?.media_type === 'image') {
        const imageSha = (slot.variants || []).find((entry) => entry.kind === 'image')?.sha256;
        if (!record.source_sha256 || record.source_sha256 !== imageSha) {
          throw new Error(`turns[${turnIndex}] Animate source does not match the retained image.`);
        }
      }
    }
    verifyTerminalAndVisualSlots(item, expectedEvents, actualMedia, ownership, turnIndex);
    replay.payloads = payloads;
    replay.verified = true;
  }
  const earlierSlots = [];
  for (const [turnIndex, item] of parsed.turns.entries()) {
    const reference = item.visual_reference;
    if (reference) {
      const candidates = earlierSlots.filter((slot) => slot.id === reference.slot_id &&
        (!reference.sha256 || slot.sha256 === reference.sha256 ||
         (slot.variants || []).some((variant) => variant.sha256 === reference.sha256)));
      if (!candidates.length || reference.source_attached !== true || reference.edit_source_attached !== true) {
        throw new Error(`turns[${turnIndex}] visual revision does not resolve to an existing exact image.`);
      }
    }
    earlierSlots.push(...(item.visual_slots || []));
  }
  return { turns: parsed.turns.filter((item) => item.replay).length, artifacts: artifactTotal };
}
// RAW_SSE_REPLAY_IMPORT_END

function parseImportedSessionJson(text) {
  if (typeof text !== 'string') {
    throw new Error('Imported session must be a JSON string.');
  }
  if (text.length > MAX_IMPORT_FILE_BYTES) {
    throw new Error('Imported session JSON exceeds the 128 MiB file limit.');
  }
  let root;
  validateVideoFrameBudgetJson(text);
  try {
    root = JSON.parse(text);
  } catch {
    throw new Error('Imported file is not valid JSON.');
  }
  if (!isPlainObject(root)) {
    throw new Error('Imported session JSON root must be an object.');
  }
  if (typeof root.schema !== 'string' || !SUPPORTED_IMPORT_SCHEMAS.has(root.schema)) {
    const label = typeof root.schema === 'string' && root.schema ? root.schema : '(missing)';
    throw new Error(`Unsupported session export schema: ${label}.`);
  }
  const isReplay = root.schema === SESSION_REPLAY_SCHEMA;
  const textBytes = new TextEncoder().encode(text).length;
  if ((!isReplay && textBytes > MAX_IMPORT_SESSION_BYTES) || textBytes > MAX_IMPORT_FILE_BYTES) {
    throw new Error(isReplay
      ? 'Imported replay JSON exceeds the 128 MiB file limit.'
      : 'Imported session JSON exceeds the 2 MiB size limit.');
  }
  if (isReplay && root.replay_format !== 'umminfer-raw-sse-replay-v1') {
    throw new Error('Replay session must use umminfer-raw-sse-replay-v1.');
  }
  const sessionId = parseOptionalStringField(root, 'session_id', 'root');
  const model = parseOptionalStringField(root, 'model', 'root');
  const exportedAt = parseOptionalStringField(root, 'exported_at', 'root');
  const frameSelection = normalizeVideoFrameSelectionConfig(root.video_frame_selection);

  if (!Array.isArray(root.turns)) {
    throw new Error('Imported session JSON must contain a turns array.');
  }
  if (root.turn_count !== undefined && root.turn_count !== null) {
    if (typeof root.turn_count !== 'number' || !Number.isSafeInteger(root.turn_count) ||
        root.turn_count !== root.turns.length) {
      throw new Error('Imported session turn_count does not match turns length.');
    }
  }
  if (root.turns.length > MAX_IMPORT_TURNS) {
    throw new Error(`Imported session exceeds the maximum of ${MAX_IMPORT_TURNS} turns.`);
  }

  const turns = [];
  for (let i = 0; i < root.turns.length; i += 1) {
    const rawTurn = root.turns[i];
    const label = `turns[${i}]`;
    if (!isPlainObject(rawTurn)) {
      throw new Error(`${label} must be an object.`);
    }
    if (rawTurn.index !== undefined && rawTurn.index !== null) {
      if (typeof rawTurn.index !== 'number' || !Number.isSafeInteger(rawTurn.index) || rawTurn.index < 1) {
        throw new Error(`${label}.index must be a positive integer.`);
      }
    }
    let role = null;
    if (rawTurn.role !== undefined && rawTurn.role !== null) {
      if (typeof rawTurn.role !== 'string' || !VALID_IMPORT_TURN_ROLES.has(rawTurn.role)) {
        throw new Error(`${label}.role is unsupported: ${String(rawTurn.role)}.`);
      }
      role = rawTurn.role;
    }
    if (typeof rawTurn.prompt !== 'string') {
      throw new Error(`${label}.prompt must be a string.`);
    }
    if (typeof rawTurn.response !== 'string') {
      throw new Error(`${label}.response must be a string.`);
    }
    const prompt = scrubInlineDataUri(rawTurn.prompt);
    const response = scrubInlineDataUri(rawTurn.response);
    const asrText = scrubInlineDataUri(parseOptionalStringField(rawTurn, 'asr_text', label) || '');

    const rawInterrupted = rawTurn.interrupted;
    if (rawInterrupted !== undefined && rawInterrupted !== null && typeof rawInterrupted !== 'boolean') {
      throw new Error(`${label}.interrupted must be a boolean.`);
    }
    const interrupted = rawInterrupted === true;
    const rawSpokenBytes = parseOptionalNonNegInt(rawTurn, 'spoken_bytes', label);
    const spokenBytes = interrupted ? rawSpokenBytes : null;

    let visualSlots = [];
    if (rawTurn.visual_slots !== undefined && rawTurn.visual_slots !== null) {
      if (!Array.isArray(rawTurn.visual_slots)) {
        throw new Error(`${label}.visual_slots must be an array.`);
      }
      visualSlots = rawTurn.visual_slots.map((slot, j) => parseImportedVisualSlot(slot, label, j));
    }

    const telemetry = buildImportedTelemetryRecord(rawTurn.telemetry, visualSlots, label);
    const resolvedRole = role || (prompt && response ? 'turn' : (response ? 'assistant' : (prompt ? 'user' : 'turn')));
    const outcome = parseOptionalStringField(rawTurn, 'outcome', label);
    if (outcome && !['completed', 'incomplete', 'cancelled', 'error'].includes(outcome)) {
      throw new Error(`${label}.outcome is unsupported.`);
    }
    if (rawTurn.terminal !== undefined && rawTurn.terminal !== null && !isSessionObject(rawTurn.terminal)) {
      throw new Error(`${label}.terminal must be an object.`);
    }
    const terminal = isSessionObject(rawTurn.terminal) ? JSON.parse(JSON.stringify(rawTurn.terminal)) : null;
    if (terminal && !['completed', 'incomplete', 'cancelled', 'error'].includes(terminal.state)) {
      throw new Error(`${label}.terminal.state is unsupported.`);
    }
    const rawReference = rawTurn.visual_reference;
    let visualReference = null;
    if (rawReference !== undefined && rawReference !== null) {
