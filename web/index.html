  };
}

function scrollToEnd() {
  ui.transcript.scrollTop = ui.transcript.scrollHeight;
}

// ---------- balanced Markdown renderer (zero-dependency, XSS-safe DOM) ----------

function safeLinkURL(raw) {
  const s = String(raw || '').trim();
  if (/^(https?:|mailto:)/i.test(s)) return s;
  return '';
}

function appendInlineMarkdown(parent, text) {
  const tokenRe = /`([^`\n]+)`|\[([^\]\n]+)\]\(([^)\s]+)\)|\*\*([^*\n]+(?:\*(?!\*)[^*\n]*)*)\*\*|~~([^~\n]+)~~|\*([^*\n]+)\*/g;
  let last = 0;
  let match;
  while ((match = tokenRe.exec(text)) !== null) {
    if (match.index > last) {
      parent.append(document.createTextNode(text.slice(last, match.index)));
    }
    if (match[1] !== undefined) {
      const code = document.createElement('code');
      code.textContent = match[1];
      parent.append(code);
    } else if (match[2] !== undefined) {
      const href = safeLinkURL(match[3]);
      if (href) {
        const a = document.createElement('a');
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        appendInlineMarkdown(a, match[2]);
        parent.append(a);
      } else {
        parent.append(document.createTextNode(match[0]));
      }
    } else if (match[4] !== undefined) {
      const strong = document.createElement('strong');
      appendInlineMarkdown(strong, match[4]);
      parent.append(strong);
    } else if (match[5] !== undefined) {
      const del = document.createElement('del');
      appendInlineMarkdown(del, match[5]);
      parent.append(del);
    } else if (match[6] !== undefined) {
      const em = document.createElement('em');
      appendInlineMarkdown(em, match[6]);
      parent.append(em);
    }
    last = tokenRe.lastIndex;
  }
  if (last < text.length) {
    parent.append(document.createTextNode(text.slice(last)));
  }
}

function appendInlineLines(parent, lines) {
  for (let i = 0; i < lines.length; i += 1) {
    if (i > 0) parent.append(document.createElement('br'));
    appendInlineMarkdown(parent, lines[i]);
  }
}

function parseTableRow(line) {
  if (!line.includes('|')) return null;
  let inner = line.trim();
  if (inner.startsWith('|')) inner = inner.slice(1);
  if (inner.endsWith('|')) inner = inner.slice(0, -1);
  const cells = inner.split('|').map((c) => c.trim());
  return cells.length >= 2 ? cells : null;
}

function isTableSeparator(line, cols) {
  const cells = parseTableRow(line);
  if (!cells || cells.length !== cols) return false;
  return cells.every((c) => /^:?-{3,}:?$/.test(c));
}

function renderMarkdownInto(el, source) {
  const frag = document.createDocumentFragment();
  const lines = String(source || '').replace(/\r\n?/g, '\n').split('\n');
  let i = 0;

  while (i < lines.length) {
    const raw = lines[i];
    const trimmed = raw.trim();
    if (!trimmed) { i += 1; continue; }

    // Fenced code block (``` or ~~~), resilient to unclosed fences while streaming.
    const fenceMatch = /^(`{3,}|~{3,})\s*([^\s`]*)/.exec(trimmed);
    if (fenceMatch) {
      const marker = fenceMatch[1][0];
      const len = fenceMatch[1].length;
      const lang = fenceMatch[2] || '';
      i += 1;
      const codeLines = [];
      const closeRe = new RegExp(`^${marker}{${len},}$`);
      while (i < lines.length) {
        if (closeRe.test(lines[i].trim())) { i += 1; break; }
        codeLines.push(lines[i]);
        i += 1;
      }
      const box = document.createElement('div');
      box.className = 'md-code';
      const head = document.createElement('div');
      head.className = 'md-code-head';
      const badge = document.createElement('span');
      badge.textContent = (lang || 'code').toLowerCase();
      const copy = document.createElement('button');
      copy.type = 'button';
      copy.className = 'md-code-copy';
      copy.textContent = 'Copy';
      const codeText = codeLines.join('\n');
      copy.addEventListener('click', () => {
        navigator.clipboard?.writeText(codeText).then(() => {
          copy.textContent = 'Copied';
          setTimeout(() => { copy.textContent = 'Copy'; }, 1200);
        }).catch(() => {});
      });
      head.append(badge, copy);
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.textContent = codeText;
      pre.append(code);
      box.append(head, pre);
      frag.append(box);
      continue;
    }

    // Horizontal rule
    if (/^([-*_])(?:\s*\1){2,}$/.test(trimmed)) {
      frag.append(document.createElement('hr'));
      i += 1;
      continue;
    }

    // ATX heading (#..######)
    const headMatch = /^(#{1,6})\s+(.+?)\s*#*$/.exec(trimmed);
    if (headMatch) {
      const h = document.createElement('h' + headMatch[1].length);
      appendInlineMarkdown(h, headMatch[2].trim());
      frag.append(h);
      i += 1;
      continue;
    }

    // GFM pipe table
    if (i + 1 < lines.length) {
      const headers = parseTableRow(trimmed);
      if (headers && isTableSeparator(lines[i + 1].trim(), headers.length)) {
        i += 2;
        const wrap = document.createElement('div');
        wrap.className = 'md-table-wrap';
        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const htr = document.createElement('tr');
        for (const hCell of headers) {
          const th = document.createElement('th');
          appendInlineMarkdown(th, hCell);
          htr.append(th);
        }
        thead.append(htr);
        table.append(thead);
        const tbody = document.createElement('tbody');
        while (i < lines.length) {
          const rTrim = lines[i].trim();
          if (!rTrim) break;
          const cells = parseTableRow(rTrim);
          if (!cells) break;
          const tr = document.createElement('tr');
          for (let c = 0; c < headers.length; c += 1) {
            const td = document.createElement('td');
            appendInlineMarkdown(td, cells[c] ?? '');
            tr.append(td);
          }
          tbody.append(tr);
          i += 1;
        }
        table.append(tbody);
        wrap.append(table);
        frag.append(wrap);
        continue;
      }
    }

    // Blockquote
    if (trimmed.startsWith('>')) {
      const qLines = [];
      while (i < lines.length && lines[i].trim().startsWith('>')) {
        qLines.push(lines[i].trim().replace(/^>\s?/, ''));
        i += 1;
      }
      const bq = document.createElement('blockquote');
      appendInlineLines(bq, qLines);
      frag.append(bq);
      continue;
    }

    // Unordered or ordered list
    const listStart = /^(\s*)([-*+]|\d{1,4}[.)])\s+(.+)$/.exec(raw);
    if (listStart) {
      const ordered = /^\d/.test(listStart[2]);
      const listEl = document.createElement(ordered ? 'ol' : 'ul');
      while (i < lines.length) {
        const cur = lines[i];
        if (!cur.trim()) break;
        const m = /^(\s*)([-*+]|\d{1,4}[.)])\s+(.+)$/.exec(cur);
        if (m && (/^\d/.test(m[2]) === ordered)) {
          const li = document.createElement('li');
          appendInlineMarkdown(li, m[3]);
          listEl.append(li);
          i += 1;
        } else if (/^(?:  |\t)/.test(cur) && listEl.lastElementChild) {
          listEl.lastElementChild.append(document.createElement('br'));
          appendInlineMarkdown(listEl.lastElementChild, cur.trim());
          i += 1;
        } else {
          break;
        }
      }
      frag.append(listEl);
      continue;
    }

    // Paragraph
    const para = [raw];
    i += 1;
    while (i < lines.length) {
      const nxt = lines[i];
      const nt = nxt.trim();
      if (!nt || /^(`{3,}|~{3,})/.test(nt) || /^([-*_])(?:\s*\1){2,}$/.test(nt)
          || /^#{1,6}\s+/.test(nt) || nt.startsWith('>')
          || /^\s*(?:[-*+]|\d{1,4}[.)])\s+/.test(nxt)) break;
      if (i + 1 < lines.length) {
        const maybeHdr = parseTableRow(nt);
        if (maybeHdr && isTableSeparator(lines[i + 1].trim(), maybeHdr.length)) break;
      }
      para.push(nxt);
      i += 1;
    }
    const p = document.createElement('p');
    appendInlineLines(p, para);
    frag.append(p);
  }

  el.replaceChildren(frag);
}

function appendText(delta) {
  if (!turn) return;
  if (!turn.text) setStatus('Streaming…');
  turn.text += delta;
  if (!turn.tailText) {
    turn.tailText = document.createElement('div');
    turn.tailText.className = 'block text md caret';
    turn.tailText._raw = '';
    turn.flow.append(turn.tailText);
  }
  turn.tailText._raw += delta;
  renderMarkdownInto(turn.tailText, turn.tailText._raw);
  scrollToEnd();
}

// ---------- visual slot cards (interleaved narrative) ----------

function createSlot(id, prompt, kind, continuity = null) {
  const el = document.createElement('div');
  el.className = 'slot';
  el.dataset.slot = id;

  const head = document.createElement('div');
  head.className = 'slot-card-head';
  const badge = document.createElement('span');
  badge.className = 'badge ' + kind;
  badge.textContent = kind === 'video' ? 'Video' : 'Image';
  head.append(badge);
  let continuityEl = null;
  if (continuity) {
    continuityEl = document.createElement('span');
    continuityEl.className = 'badge continuity ' + continuity.kind
      + (continuity.explicit ? ' explicit' : '');
    continuityEl.textContent = continuity.text;
    continuityEl.dataset.continuity = continuity.kind;
    if (continuity.explicit) continuityEl.dataset.anchorExplicit = 'true';
    if (continuity.sha256) continuityEl.dataset.anchorSha256 = continuity.sha256;
    if (continuity.title) continuityEl.title = continuity.title;
    head.append(continuityEl);
  }
  const caption = document.createElement('span');
  caption.className = 'slot-caption';
  caption.textContent = prompt;
  caption.title = prompt;
  head.append(caption);

  const media = document.createElement('div');
  media.className = 'slot-media';
  showSlotLoading({ media });

  const actions = document.createElement('div');
  actions.className = 'slot-actions';
  const swap = document.createElement('button');
  swap.type = 'button';
  swap.textContent = kind === 'video' ? '→ Image' : '→ Video';
  const regen = document.createElement('button');
  regen.type = 'button';
  regen.textContent = 'Regenerate';
  const dl = document.createElement('a');
  dl.className = 'dl';
  dl.textContent = 'Download';
  dl.hidden = true;
  actions.append(swap, regen, dl);

  el.append(head, media, actions);

  const slot = { id, prompt, kind, el, head, caption, continuityEl,
                 continuityMeta: null, media, badge, swap, regen, dl,
                 url: '', cache: {}, loading: false, hasError: false };
  swap.addEventListener('click', () => {
    renderSlot(slot, slot.kind === 'video' ? 'image' : 'video');
  });
  regen.addEventListener('click', () => {
    delete slot.cache[slot.kind];
    renderSlot(slot, slot.kind);
  });
  return slot;
}

function showSlotLoading(slot) {
  slot.hasError = false;
  if (slot.el?.dataset) delete slot.el.dataset.error;
  slot.el?.classList?.remove('has-error');
  const shimmer = document.createElement('div');
  shimmer.className = 'shimmer';
  const overlay = document.createElement('div');
  overlay.className = 'slot-overlay';
  overlay.append(Object.assign(document.createElement('div'), { className: 'spinner' }));
  slot.media.replaceChildren(shimmer, overlay);
}

function showSlotError(slot, message) {
  slot.hasError = true;
  if (slot.el?.dataset) slot.el.dataset.error = 'true';
  slot.el?.classList?.add('has-error');
  const overlay = document.createElement('div');
  overlay.className = 'slot-overlay';
  const note = document.createElement('div');
  note.className = 'slot-error';
  note.textContent = `${message || 'Generation failed'} · tap Regenerate`;
  overlay.append(note);
  slot.media.replaceChildren(overlay);
}

function setSlotMedia(slot, kind, url) {
  slot.hasError = false;
  if (slot.el?.dataset) delete slot.el.dataset.error;
  slot.el?.classList?.remove('has-error');
  slot.kind = kind;
  slot.url = url;
  slot.cache[kind] = url;
  slot.media.replaceChildren();
  if (kind === 'video') {
    const video = document.createElement('video');
    video.controls = true;
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.autoplay = true;
    video.src = url;
    slot.media.append(video);
  } else {
    const link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener';
    const img = document.createElement('img');
    img.src = url;
    img.alt = slot.prompt || 'Generated visual';
    link.append(img);
    slot.media.append(link);
  }
  slot.badge.className = 'badge ' + kind;
  slot.badge.textContent = kind === 'video' ? 'Video' : 'Image';
  slot.swap.textContent = kind === 'video' ? '→ Image'
    : (slot.imageDataURL ? 'Animate → Video' : '→ Video');
  slot.dl.href = url;
  slot.dl.download = kind === 'video' ? 'slot.mp4' : 'slot.png';
  slot.dl.hidden = false;
}

function recordSlotContinuityTelemetry(targetTurn, meta) {
  if (!targetTurn?.telemetry || !meta || typeof meta !== 'object') return;
  let changed = false;
  if (Number.isInteger(meta.anchor_slot_index) && meta.anchor_slot_index >= 0) {
    if (!targetTurn.telemetry.hasI2VChain) {
      targetTurn.telemetry.hasI2VChain = true;
      changed = true;
    }
    if (meta.anchor_explicit === true && !targetTurn.telemetry.hasExplicitAnchor) {
      targetTurn.telemetry.hasExplicitAnchor = true;
      changed = true;
    }
  }
  if (changed) renderTurnTelemetry(targetTurn);
}

function onVisualSlot(unified) {
  if (!turn) return;
  if (turn.tailText) turn.tailText.classList.remove('caret');
  turn.tailText = null;
  const kind = (unified.media_type || unified.stage) === 'video' ? 'video' : 'image';
  const slotId = unified.slot_id || `slot-${turn.slots.size}`;
  if (turn.slots.has(slotId)) {
    const existing = turn.slots.get(slotId);
    updateSlotContinuity(existing, unified);
    recordSlotContinuityTelemetry(turn, unified);
    return;
  }
  const continuity = visualSlotContinuityBadge(unified);
  recordSlotContinuityTelemetry(turn, unified);
  const slot = createSlot(slotId, unified.prompt || '', kind, continuity);
  slot.continuityMeta = {
    continuity_mode: typeof unified?.continuity_mode === 'string' ? unified.continuity_mode : '',
    anchor_slot_index: Number.isInteger(unified?.anchor_slot_index) && unified.anchor_slot_index >= 0
      ? unified.anchor_slot_index : undefined,
    anchor_explicit: unified?.anchor_explicit === true,
    anchor_sha256: normalizeAnchorSha256(unified?.anchor_sha256),
  };
  turn.slots.set(slotId, slot);
  turn.flow.append(slot.el);
  scrollToEnd();
}

async function renderSlot(slot, kind) {
  if (slot.loading) return;
  if (slot.cache[kind]) {
    setSlotMedia(slot, kind, slot.cache[kind]);
    return;
  }
  slot.loading = true;
  showSlotLoading(slot);
  try {
    const body = { kind, prompt: slot.prompt };
    if (kind === 'image') {
      body.size = ui.imageSize.value || '512x512';
      const steps = Number.parseInt(ui.imageSteps.value.trim(), 10);
      if (Number.isInteger(steps) && steps > 0) body.steps = steps;
    } else {
      body.size = ui.videoSize.value || '480x320';
      const frames = Number.parseInt(ui.videoFrames.value.trim(), 10);
      if (Number.isInteger(frames) && frames > 0) body.num_frames = frames;
      const vsteps = Number.parseInt(ui.videoSteps.value.trim(), 10);
      if (Number.isInteger(vsteps) && vsteps > 0) body.steps = vsteps;
      const guidance = Number(ui.videoGuidance.value);
      if (ui.videoGuidance.value.trim() !== '' && Number.isFinite(guidance) && guidance >= 0) {
        body.guidance_scale = guidance;
      }
      if (ui.fastVideo.checked) body.teacache_thresh = 0.05;
      if (slot.imageDataURL) body.image = slot.imageDataURL;
    }
    const res = await fetch(apiURL(ui.endpoint.value, '/visual/render'), {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const detail = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}: ${limit(detail)}`);
    }
    const type = (res.headers.get('content-type') || '').split(';')[0].trim().toLowerCase();
    const hinted = (res.headers.get('x-umminfer-kind') || kind).toLowerCase();
    const actual = hinted === 'video' ? 'video' : 'image';
    const blob = await res.blob();
    const bytes = new Uint8Array(await blob.arrayBuffer());
    if (actual === 'image') {
      slot.imageDataURL = dataURLFor(type || blob.type || 'image/png', bytes);
    }
    setSlotMedia(slot, actual, URL.createObjectURL(new Blob([bytes], { type: type || blob.type })));
    scrollToEnd();
  } catch (err) {
    showSlotError(slot, err.message);
  } finally {
    slot.loading = false;
  }
}

// ---------- streaming PCM16 playback ----------
// One AudioContext per request. Chunks are scheduled back to back on a running
// cursor instead of starting a fresh source per chunk, so the waveform stays
// continuous. A short jitter buffer avoids an immediate starve. A master gain
// node carries the header Mute state.

const player = {
  ctx: null, gain: null, next: 0, started: false, ended: false,
  pending: [], buffered: 0, sources: 0, muted: false,

  begin(wave) {
    this.stop();
    waveEl = wave;
    this.ctx = new AudioContext();
    this.gain = this.ctx.createGain();
    this.gain.gain.value = this.muted ? 0 : 1;
    this.gain.connect(this.ctx.destination);
    this.next = 0; this.started = false; this.ended = false;
    this.pending = []; this.buffered = 0; this.sources = 0;
  },

  push(bytes, rate, channels) {
    if (!this.ctx || this.ended) return;
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    const buffer = pcmBuffer(this.ctx, bytes, rate, channels);
    if (!buffer) { log('pcm: rejected', bytes.length, rate, channels); return; }
    this.pending.push(buffer);
    this.buffered += buffer.duration;
    if (!this.started && this.buffered >= 0.3) {
      this.started = true;
      this.next = this.ctx.currentTime + 0.1;
      setPlaying(true);
    }
    if (this.started) this.drain();
  },

  drain() {
    const ctx = this.ctx;
    const sink = this.gain || ctx.destination;
    for (const buffer of this.pending) {
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(sink);
      const at = Math.max(this.next, ctx.currentTime + 0.02);
      source.start(at);
      this.next = at + buffer.duration;
      log('pcm: schedule', buffer.duration.toFixed(3) + 's', 'at', at.toFixed(3));
      this.sources += 1;
      source.onended = () => {
        this.sources -= 1;
        if (this.sources === 0 && this.ended) this.finish();
      };
    }
    this.pending = [];
    this.buffered = 0;
  },

  end() {
    this.ended = true;
    if (!this.started && this.pending.length) {
      this.started = true;
      this.next = this.ctx.currentTime + 0.05;
      setPlaying(true);
      this.drain();
    }
    if (this.sources === 0) this.finish();
  },

  finish() {
    setPlaying(false);
    this.ctx?.close().catch(() => {});
    this.ctx = null;
    this.gain = null;
  },

  stop() {
    this.ended = true;
    setPlaying(false);
    this.pending = [];
    this.buffered = 0;
    this.sources = 0;
    this.ctx?.close().catch(() => {});
    this.ctx = null;
    this.gain = null;
  },

  setMuted(muted) {
    this.muted = muted;
    if (this.gain) this.gain.gain.value = muted ? 0 : 1;
  },
};

// ---------- opt-in full-duplex realtime voice (Stage B playback_ack) ----------
// This controller and player are deliberately independent of the HTTP/SSE
// player above. Realtime is never connected until the user presses its toggle.

// REALTIME_ECHO_SUPPRESSION_BEGIN
function buildRealtimeInitialSessionUpdate({
  voice = 'vivian',
  maxTokens = 256,
  silenceMs = 400,
  echoSuppression = true,
} = {}) {
  const resolvedSilence = Number.isInteger(silenceMs) && silenceMs >= 100 && silenceMs <= 5000
    ? silenceMs : 400;
  const turnDetection = { type: 'server_vad', silence_ms: resolvedSilence };
  // Keep default session.update wire shape unchanged when echo suppression is ON.
  if (echoSuppression === false) turnDetection.echo_suppression = false;
  const resolvedVoice = typeof voice === 'string' && voice.trim() ? voice.trim() : 'vivian';
  const resolvedMaxTokens = Number.isInteger(maxTokens) && maxTokens > 0 ? maxTokens : 256;
  return {
    type: 'session.update',
    session: {
      input_audio_format: 'pcm16',
      turn_detection: turnDetection,
      max_new_tokens: resolvedMaxTokens,
      audio_output: {
        voice: resolvedVoice,
        playback_ack: true,
      },
    },
  };
}

function buildRealtimeEchoSuppressionUpdate(enabled, silenceMs = 400) {
  const resolvedSilence = Number.isInteger(silenceMs) && silenceMs >= 100 && silenceMs <= 5000
    ? silenceMs : 400;
  return {
    type: 'session.update',
    session: {
      turn_detection: {
        type: 'server_vad',
        silence_ms: resolvedSilence,
        echo_suppression: Boolean(enabled),
      },
    },
  };
}

function parseRealtimeSessionUpdated(event) {
  const session = event?.session;
  const turn = session && typeof session.turn_detection === 'object' ? session.turn_detection : null;
  const rawSilence = turn?.silence_ms;
  const silenceMs = Number.isInteger(rawSilence) && rawSilence >= 100 && rawSilence <= 5000
    ? rawSilence : 400;
  let echoSuppression = true;
  if (turn && Object.prototype.hasOwnProperty.call(turn, 'echo_suppression') &&
      turn.echo_suppression !== undefined && turn.echo_suppression !== null) {
    if (typeof turn.echo_suppression !== 'boolean') {
      throw new Error('session.turn_detection.echo_suppression must be a boolean.');
    }
    echoSuppression = turn.echo_suppression;
  }
  return {
    silenceMs,
    echoSuppression,
    playbackAck: session?.audio_output?.playback_ack === true,
  };
}

function formatRealtimeEchoSuppressionLabel(confirmed) {
  if (confirmed === true) return 'Echo suppression: On';
  if (confirmed === false) return 'Echo suppression: Off (A/B)';
  return '';
}

function formatRealtimeBargeInLabel(count) {
  const n = Number.isInteger(count) && count >= 0 ? count : 0;
  return `Barge-ins: ${n}`;
}

function resetRealtimeTelemetry(state) {
  state.negotiatedSilenceMs = 400;
  state.confirmedEchoSuppression = null;
  state.bargeInCount = 0;
  return state;
}

function recordRealtimeBargeIn(state) {
  state.bargeInCount = (Number.isInteger(state.bargeInCount) && state.bargeInCount >= 0
    ? state.bargeInCount : 0) + 1;
  return state.bargeInCount;
}

function sendRealtimeEchoSuppressionToggle(enabled, silenceMs, socket) {
  const openState = typeof WebSocket !== 'undefined' ? WebSocket.OPEN : 1;
  if (!socket || socket.readyState !== openState) return null;
  const payload = buildRealtimeEchoSuppressionUpdate(enabled, silenceMs);
  socket.send(JSON.stringify(payload));
  return payload;
}
// REALTIME_ECHO_SUPPRESSION_END

// REALTIME_AUDIO_METER_BEGIN
function computePcm16RmsLevel(pcmBytes) {
  if (!(pcmBytes instanceof Uint8Array) || pcmBytes.byteLength === 0 || (pcmBytes.byteLength % 2) !== 0) {
    return 0;
  }
  const sampleCount = pcmBytes.byteLength / 2;
  const view = new DataView(pcmBytes.buffer, pcmBytes.byteOffset, pcmBytes.byteLength);
  let sumSquares = 0;
  for (let i = 0; i < sampleCount; i += 1) {
    const normalized = view.getInt16(i * 2, true) / 32768;
    sumSquares += normalized * normalized;
  }
  const rms = Math.sqrt(sumSquares / sampleCount);
  if (!Number.isFinite(rms) || rms <= 0) return 0;
  return Math.min(1, rms);
}

function parseNonNegativeCursor(value) {
  return typeof value === 'number' && Number.isSafeInteger(value) && value >= 0 ? value : null;
}

function formatInterruptedBadge(acknowledgedBytes) {
  const bytes = parseNonNegativeCursor(acknowledgedBytes);
  if (bytes === null) return '';
  return bytes > 0 ? `Interrupted · ${bytes} B spoken` : 'Interrupted before audio';
}

function createRealtimeTurnTracker() {
  return {
    acknowledgedBytesByResponse: new Map(),
    interruptedBytesByResponse: new Map(),
  };
}

function recordRealtimePlaybackAck(tracker, responseId, textCursor) {
  if (!tracker || !responseId) return null;
  const cursor = parseNonNegativeCursor(textCursor);
  if (cursor === null) return null;
  const prev = tracker.acknowledgedBytesByResponse.get(responseId) ?? 0;
  const next = Math.max(prev, cursor);
  tracker.acknowledgedBytesByResponse.set(responseId, next);
  return next;
}

function recordRealtimeTurnCancelled(tracker, responseId, cancelledTextCursor) {
  if (!tracker || !responseId) return null;
  const ackFromPlayback = tracker.acknowledgedBytesByResponse.get(responseId) ?? 0;
  const ackFromCancelled = parseNonNegativeCursor(cancelledTextCursor);
  const resolvedBytes = ackFromCancelled !== null
    ? Math.max(ackFromPlayback, ackFromCancelled)
    : ackFromPlayback;
  tracker.acknowledgedBytesByResponse.set(responseId, resolvedBytes);
  tracker.interruptedBytesByResponse.set(responseId, resolvedBytes);
  return {
    acknowledgedBytes: resolvedBytes,
    badgeText: formatInterruptedBadge(resolvedBytes),
  };
}

function clearRealtimeTurnTracking(tracker, responseId) {
  if (!tracker || !responseId) return;
  tracker.acknowledgedBytesByResponse.delete(responseId);
}

function resetRealtimeTurnTracker(tracker) {
  if (!tracker) return;
  tracker.acknowledgedBytesByResponse.clear();
  tracker.interruptedBytesByResponse.clear();
}
// REALTIME_AUDIO_METER_END

const realtime = {
  ws: null,
  enabled: false,
  ready: false,
  generation: 0,
  mic: null,
  micStarting: false,
  micLevel: 0,
  activeResponseId: '',
  cancelledResponses: new Set(),
  turns: new Map(),
  turnTracker: createRealtimeTurnTracker(),
  phase: 'Realtime off',
  echoSuppression: ui.realtimeEchoSuppression.checked,
  negotiatedSilenceMs: 400,
  confirmedEchoSuppression: null,
  bargeInCount: 0,
};

function renderRealtimeMicMeter() {
  const clamped = realtime.enabled && Number.isFinite(realtime.micLevel)
    ? Math.max(0, Math.min(1, realtime.micLevel)) : 0;
  const pct = Math.round(clamped * 100);
  ui.realtimeMicMeter.setAttribute('aria-valuenow', String(pct));
  ui.realtimeMicMeterFill.style.width = `${pct}%`;
}

function setRealtimeMicLevel(level) {
  realtime.micLevel = Number.isFinite(level) ? Math.max(0, Math.min(1, level)) : 0;
  renderRealtimeMicMeter();
}

function renderRealtimeStrip() {
  ui.realtimeStrip.hidden = !realtime.enabled;
  if (!realtime.enabled) {
    ui.realtimeStripPhase.textContent = '';
    realtime.micLevel = 0;
    renderRealtimeMicMeter();
    ui.realtimeEchoState.hidden = true;
    ui.realtimeEchoState.textContent = '';
    ui.realtimeEchoState.classList.remove('echo-on', 'echo-off');
    ui.realtimeBargeInCount.textContent = '';
    return;
  }
  ui.realtimeStripPhase.textContent = realtime.phase;
  renderRealtimeMicMeter();
  const echoLabel = formatRealtimeEchoSuppressionLabel(realtime.confirmedEchoSuppression);
  ui.realtimeEchoState.hidden = !echoLabel;
  ui.realtimeEchoState.textContent = echoLabel;
  ui.realtimeEchoState.classList.toggle('echo-on', realtime.confirmedEchoSuppression === true);
  ui.realtimeEchoState.classList.toggle('echo-off', realtime.confirmedEchoSuppression === false);
  ui.realtimeBargeInCount.textContent = formatRealtimeBargeInLabel(realtime.bargeInCount);
}

function setRealtimeStatus(text) {
  realtime.phase = text;
  ui.realtimeToggle.classList.toggle('on', realtime.enabled);
  ui.realtimeToggle.setAttribute('aria-pressed', realtime.enabled ? 'true' : 'false');
  ui.realtimeToggle.textContent = realtime.enabled ? 'Realtime ON' : 'Realtime OFF';
  ui.realtimeStatus.textContent = text;
  renderRealtimeStrip();
}

function markRealtimeStale(responseId) {
  if (!responseId) return;
  realtime.cancelledResponses.add(responseId);
  // A session normally has only a handful of responses; bound defense-in-depth
  // state anyway so a long-lived microphone session cannot grow without limit.
  if (realtime.cancelledResponses.size > 64) {
    realtime.cancelledResponses.delete(realtime.cancelledResponses.values().next().value);
  }
}

// REALTIME_PLAYER_CLASS_BEGIN
class RealtimePCMPlayer {
  constructor(sendAck, onState) {
    this.sendAck = sendAck;
    this.onState = onState;
    this.ctx = null;
    this.gain = null;
    this.muted = false;
    this.responseId = '';
    this.sources = new Set();
    this.nextTime = 0;
    this.lastAckCursor = -1;
    this.finalCursor = null;
    this.finalAckSent = false;
    this.cancelled = new Set();
    this.epoch = 0;
  }

  ensureContext() {
    if (this.ctx && this.ctx.state !== 'closed') return;
    this.ctx = new AudioContext();
    this.gain = this.ctx.createGain();
    this.gain.gain.value = this.muted ? 0 : 1;
    this.gain.connect(this.ctx.destination);
  }

  async unlock() {
    // Called synchronously from the toggle's user gesture, before any await in
    // the audio path, so later audio.delta frames are allowed to start sound.
    this.ensureContext();
    if (this.ctx.state === 'suspended') await this.ctx.resume();
  }

  setMuted(muted) {
    this.muted = muted;
    if (this.gain) this.gain.gain.value = muted ? 0 : 1;
  }

  begin(responseId) {
    if (!responseId) throw new Error('Realtime response is missing response_id.');
    if (this.responseId === responseId) return;
    this.clearSources();
    if (this.responseId) this.cancelled.add(this.responseId);
    this.responseId = responseId;
    this.lastAckCursor = -1;
    this.finalCursor = null;
    this.finalAckSent = false;
  }

  clearSources() {
    this.epoch += 1;
    for (const record of this.sources) {
      record.active = false;
      record.source.onended = null;
      try { record.source.stop(0); } catch { /* already ended */ }
      try { record.source.disconnect(); } catch { /* already disconnected */ }
    }
    this.sources.clear();
    this.nextTime = 0;
    this.onState(false);
  }

  push(responseId, bytes, sampleRate, channels, textCursor) {
    if (this.cancelled.has(responseId)) return;
    this.begin(responseId);
    if (this.finalAckSent) return;
    if (!Number.isSafeInteger(textCursor) || textCursor < 0) {
      throw new Error('audio.delta has an invalid text_cursor.');
    }
    this.ensureContext();
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    const buffer = pcmBuffer(this.ctx, bytes, sampleRate, channels);
    if (!buffer) throw new Error('audio.delta has invalid PCM16 metadata or sample alignment.');

    const source = this.ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(this.gain);
    const record = {
      source,
      responseId,
      textCursor,
      epoch: this.epoch,
      active: true,
    };
    this.sources.add(record);
    source.onended = () => {
      if (!record.active || record.epoch !== this.epoch ||
          this.responseId !== responseId || this.cancelled.has(responseId)) return;
      record.active = false;
      this.sources.delete(record);
      source.disconnect();
      // onended is the playback-consumption boundary. Neither receipt nor
      // AudioBufferSourceNode.start() is sufficient to acknowledge a cursor.
      this.acknowledge(responseId, textCursor, false);
      this.acknowledgeFinalIfDrained();
      if (this.sources.size === 0) this.onState(false);
    };
    const at = Math.max(this.nextTime, this.ctx.currentTime + 0.02);
    source.start(at);
    this.nextTime = at + buffer.duration;
    this.onState(true);
  }

  done(responseId, textCursor) {
    if (this.cancelled.has(responseId)) return;
    this.begin(responseId);
    if (this.finalCursor !== null) return;
    if (!Number.isSafeInteger(textCursor) || textCursor < 0) {
      throw new Error('audio.done has an invalid text_cursor.');
    }
    this.finalCursor = textCursor;
    this.acknowledgeFinalIfDrained();
  }

  acknowledge(responseId, textCursor, final) {
    if (this.responseId !== responseId || this.cancelled.has(responseId)) return;
    if (final) {
      // A final cursor may equal the last delta cursor. Repeating that one
      // cursor after audio.done is required to commit an already-consumed
      // final sentence; it is still non-decreasing and is sent only once.
      if (this.finalAckSent || textCursor < this.lastAckCursor) return;
      this.finalAckSent = true;
    } else {
      if (this.finalAckSent || textCursor <= this.lastAckCursor) return;
    }
    this.lastAckCursor = Math.max(this.lastAckCursor, textCursor);
    this.sendAck(responseId, textCursor);
  }

  acknowledgeFinalIfDrained() {
    if (this.finalCursor === null || this.sources.size !== 0) return;
    this.acknowledge(this.responseId, this.finalCursor, true);
    this.onState(false);
  }

  cancel(responseId) {
    if (!responseId) return;
    this.cancelled.add(responseId);
    if (this.cancelled.size > 64) {
      this.cancelled.delete(this.cancelled.values().next().value);
    }
    if (this.responseId !== responseId) return;
    this.finalCursor = null;
    this.finalAckSent = true;
    this.clearSources();
  }

  stop() {
    this.clearSources();
    this.responseId = '';
    this.finalCursor = null;
    this.finalAckSent = false;
    this.lastAckCursor = -1;
    this.cancelled.clear();
    const ctx = this.ctx;
    this.ctx = null;
    this.gain = null;
    if (ctx && ctx.state !== 'closed') ctx.close().catch(() => {});
  }
}
// REALTIME_PLAYER_CLASS_END

function sendRealtimePlaybackAck(responseId, textCursor) {
  const socket = realtime.ws;
  if (!realtime.enabled || realtime.cancelledResponses.has(responseId) ||
      !socket || socket.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify({
    type: 'output_audio_buffer.playback_ack',
    response_id: responseId,
    text_cursor: textCursor,
  }));
}

const realtimePlayback = new RealtimePCMPlayer(
  sendRealtimePlaybackAck,
  (playing) => {
    if (!realtime.enabled) return;
    setRealtimeStatus(playing ? 'Speaking…' : (realtime.ready ? 'Listening' : 'Connecting…'));
  },
);

function realtimeURL() {
  const base = ui.realtimeEndpoint.value.trim() || ui.endpoint.value;
  const url = apiURL(base, '/realtime');
  const model = ui.model.value.trim();
  if (!model) throw new Error('Model is required.');
  url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
  url.search = new URLSearchParams({ intent: 'transcription', model }).toString();
  return url;
}

function closeRealtimeMic() {
  const mic = realtime.mic;
  realtime.mic = null;
  realtime.ready = false;
  setRealtimeMicLevel(0);
  if (!mic) return;
  mic.proc.onaudioprocess = null;
  try { mic.proc.disconnect(); } catch { /* already disconnected */ }
  try { mic.src.disconnect(); } catch { /* already disconnected */ }
  try { mic.sink.disconnect(); } catch { /* already disconnected */ }
  mic.stream.getTracks().forEach((track) => track.stop());
  mic.ctx.close().catch(() => {});
}

async function startRealtimeMic(generation) {
  if (realtime.mic || realtime.micStarting) return;
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error('Microphone requires localhost/127.0.0.1 or HTTPS.');
  }
  realtime.micStarting = true;
  let stream = null;
  let ctx = null;
  let handedOff = false;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
    if (!realtime.enabled || realtime.generation !== generation) return;
    ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(1024, 1, 1);
    const sink = ctx.createGain();
    sink.gain.value = 0; // Run the capture graph without microphone feedback.
    src.connect(proc);
    proc.connect(sink);
    sink.connect(ctx.destination);
    realtime.mic = { stream, ctx, src, proc, sink };
    handedOff = true;
    proc.onaudioprocess = (event) => {
      const socket = realtime.ws;
      if (!realtime.enabled || !realtime.ready || realtime.generation !== generation ||
          !socket || socket.readyState !== WebSocket.OPEN) return;
      const input = new Float32Array(event.inputBuffer.getChannelData(0));
      const pcm16k = resampleMono(input, ctx.sampleRate, 16000);
      const pcmBytes = encodePcm16Mono(pcm16k);
      if (!pcmBytes.length) return;
      setRealtimeMicLevel(computePcm16RmsLevel(pcmBytes));
      socket.send(JSON.stringify({
        type: 'input_audio_buffer.append',
        audio: encodeBase64(pcmBytes),
      }));
    };
    realtime.ready = true;
    setRealtimeStatus('Listening');
  } finally {
    if (!handedOff) {
      // Permission may already have produced live tracks before AudioContext or
      // graph construction fails; stop them even when no mic object was stored.
      stream?.getTracks().forEach((track) => track.stop());
      if (ctx && ctx.state !== 'closed') ctx.close().catch(() => {});
    }
    if (realtime.generation === generation) realtime.micStarting = false;
  }
}

function ensureRealtimeResponseTurn(responseId) {
  let responseTurn = realtime.turns.get(responseId);
  if (!responseTurn) {
    responseTurn = addTurn('assistant', '');
    realtime.turns.set(responseId, responseTurn);
  }
  return responseTurn;
}

function attachRealtimeInterruptedBadge(responseTurn, acknowledgedBytes, badgeText) {
  if (!responseTurn?.meta || !badgeText) return;
  let badge = responseTurn.interruptedBadgeEl;
  if (!badge) {
    badge = document.createElement('span');
    badge.className = 'turn-interrupted-badge';
    responseTurn.interruptedBadgeEl = badge;
    responseTurn.meta.append(badge);
  }
  badge.dataset.acknowledgedBytes = String(acknowledgedBytes);
  badge.setAttribute('aria-label', badgeText);
  badge.textContent = badgeText;
}

function appendRealtimeResponseText(responseId, delta) {
  const responseTurn = ensureRealtimeResponseTurn(responseId);
  responseTurn.text += delta;
  if (!responseTurn.tailText) {
    responseTurn.tailText = document.createElement('div');
    responseTurn.tailText.className = 'block text md caret';
    responseTurn.tailText._raw = '';
    responseTurn.flow.append(responseTurn.tailText);
  }
  responseTurn.tailText._raw += delta;
  renderMarkdownInto(responseTurn.tailText, responseTurn.tailText._raw);
  scrollToEnd();
}

function cancelRealtimeResponse(responseId = '') {
  const id = responseId || realtime.activeResponseId || realtimePlayback.responseId;
  if (!id) return;
  // Invalidate first so even an already queued onended callback is harmless.
  markRealtimeStale(id);
  realtimePlayback.cancel(id);
  const responseTurn = realtime.turns.get(id);
  responseTurn?.tailText?.classList.remove('caret');
  if (realtime.activeResponseId === id) realtime.activeResponseId = '';
}

async function handleRealtimeEvent(event, generation) {
  if (!realtime.enabled || realtime.generation !== generation || !event?.type) return;
  const responseId = typeof event.response_id === 'string' ? event.response_id : '';
  if (event.type !== 'response.cancelled' && responseId &&
      realtime.cancelledResponses.has(responseId)) return;

  switch (event.type) {
    case 'transcription_session.updated': {
      if (event.session?.audio_output?.playback_ack !== true) {
        throw new Error('Server did not negotiate audio_output.playback_ack=true.');
      }
      const negotiated = parseRealtimeSessionUpdated(event);
      realtime.negotiatedSilenceMs = negotiated.silenceMs;
      realtime.confirmedEchoSuppression = negotiated.echoSuppression;
      if (!realtime.mic && !realtime.micStarting) {
        await startRealtimeMic(generation);
      } else {
        renderRealtimeStrip();
      }
      break;
    }
    case 'input_audio_buffer.speech_started':
      setRealtimeStatus('Listening');
      break;
    case 'transcription.segment':
      setRealtimeStatus('Hearing…');
      break;
    case 'transcription.completed':
      if (typeof event.text === 'string' && event.text.trim()) {
        addTurn('user', event.text.trim());
      }
      setRealtimeStatus('Thinking…');
      break;
    case 'response.text.delta':
      if (!responseId || typeof event.text !== 'string') break;
      realtime.activeResponseId = responseId;
      appendRealtimeResponseText(responseId, event.text);
      break;
    case 'audio.delta': {
      if (!responseId || event.format !== 'pcm16') {
        throw new Error('Realtime audio.delta must carry response_id and PCM16 format.');
      }
      const bytes = decodeBase64(event.audio);
      realtime.activeResponseId = responseId;
      ensureRealtimeResponseTurn(responseId);
      realtimePlayback.push(responseId, bytes, Number(event.sample_rate),
                            Number(event.channels), Number(event.text_cursor));
      break;
    }
    case 'audio.done':
      if (!responseId) break;
      realtimePlayback.done(responseId, Number(event.text_cursor));
      break;
    case 'response.playback_ack':
      if (responseId) {
        recordRealtimePlaybackAck(realtime.turnTracker, responseId, event.text_cursor);
      }
      if (event.final === true) {
        if (responseId) clearRealtimeTurnTracking(realtime.turnTracker, responseId);
        if (realtime.activeResponseId === responseId) realtime.activeResponseId = '';
        setRealtimeStatus('Listening');
      }
      break;
    case 'response.completed': {
      const responseTurn = realtime.turns.get(responseId);
      responseTurn?.tailText?.classList.remove('caret');
      if (realtimePlayback.sources.size === 0) setRealtimeStatus('Listening');
      break;
    }
    case 'response.cancelled': {
      // Mark stale before touching Web Audio so any already queued onended or
      // late audio/text/completion frame for this response becomes inert.
      recordRealtimeBargeIn(realtime);
      const targetId = responseId || realtime.activeResponseId || realtimePlayback.responseId;
      cancelRealtimeResponse(responseId);
      if (targetId) {
        const result = recordRealtimeTurnCancelled(realtime.turnTracker, targetId, event.text_cursor);
        const responseTurn = realtime.turns.get(targetId);
        if (responseTurn && result) {
          if (typeof event.acknowledged_text === 'string') {
            responseTurn.text = event.acknowledged_text;
            if (responseTurn.tailText) {
              responseTurn.tailText._raw = event.acknowledged_text;
              renderMarkdownInto(responseTurn.tailText, event.acknowledged_text);
            }
          }
          attachRealtimeInterruptedBadge(responseTurn, result.acknowledgedBytes, result.badgeText);
        }
        clearRealtimeTurnTracking(realtime.turnTracker, targetId);
      }
      setRealtimeStatus('Interrupted · Listening');
      break;
    }
    case 'response.failed': {
      // Timeout failures may omit response_id; fall back to the active response.
      const targetId = responseId || realtime.activeResponseId || realtimePlayback.responseId;
      if (targetId) clearRealtimeTurnTracking(realtime.turnTracker, targetId);
      cancelRealtimeResponse(responseId);
      showError(`Realtime response failed: ${limit(event.error || 'unknown error')}`);
      setRealtimeStatus('Listening');
      break;
    }
    case 'error':
      throw new Error(limit(event.error?.message || event.error || 'Realtime protocol error.'));
    default:
      break;
  }
}

function stopRealtime(status = 'Realtime off') {
  realtime.generation += 1;
  realtime.enabled = false;
  realtime.ready = false;
  realtime.micStarting = false;
  realtime.micLevel = 0;
  realtime.activeResponseId = '';
  resetRealtimeTelemetry(realtime);
  resetRealtimeTurnTracker(realtime.turnTracker);
  realtime.cancelledResponses.clear();
  realtime.turns.clear();
  const socket = realtime.ws;
  realtime.ws = null;
  if (socket && socket.readyState < WebSocket.CLOSING) socket.close();
  closeRealtimeMic();
  realtimePlayback.stop();
  setRealtimeStatus(status);
}

function failRealtime(error, generation) {
  if (realtime.generation !== generation) return;
  const message = error?.message || String(error);
  stopRealtime('Realtime error');
  showError(message);
}

async function startRealtime() {
  let url;
  try {
    if (ui.apiKey.value.trim()) {
      throw new Error('Browser Realtime WS cannot send the configured API key. Use an authenticating same-origin proxy or a trusted local listener without an API key.');
    }
    url = realtimeURL();
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Microphone requires localhost/127.0.0.1 or HTTPS.');
    }
  } catch (error) {
    showError(error.message);
    return;
  }

  saveSettings();
  realtime.generation += 1;
  const generation = realtime.generation;
  realtime.enabled = true;
  realtime.ready = false;
  realtime.micLevel = 0;
  realtime.echoSuppression = ui.realtimeEchoSuppression.checked;
  resetRealtimeTelemetry(realtime);
  resetRealtimeTurnTracker(realtime.turnTracker);
  realtime.cancelledResponses.clear();
  clearError();
  setRealtimeStatus('Connecting…');
  try {
    await realtimePlayback.unlock();
    if (!realtime.enabled || realtime.generation !== generation) return;
    const socket = new WebSocket(url);
    realtime.ws = socket;
    socket.onopen = () => {
      if (!realtime.enabled || realtime.generation !== generation || realtime.ws !== socket) return;
      const maxTokens = Number.parseInt(ui.maxTokens.value.trim(), 10);
      socket.send(JSON.stringify(buildRealtimeInitialSessionUpdate({
        voice: ui.voice.value.trim() || 'vivian',
        maxTokens: Number.isInteger(maxTokens) && maxTokens > 0 ? maxTokens : 256,
        silenceMs: 400,
        echoSuppression: realtime.echoSuppression,
      })));
      setRealtimeStatus('Negotiating…');
    };
    socket.onmessage = (message) => {
      if (!realtime.enabled || realtime.generation !== generation || realtime.ws !== socket) return;
      let event;
      try { event = JSON.parse(message.data); }
      catch { failRealtime(new Error('Realtime server sent invalid JSON.'), generation); return; }
      handleRealtimeEvent(event, generation).catch((error) => failRealtime(error, generation));
    };
    socket.onerror = () => {
      if (realtime.generation === generation && realtime.ws === socket) {
        showError('Realtime WebSocket connection failed.');
      }
    };
    socket.onclose = () => {
      if (realtime.generation !== generation || realtime.ws !== socket) return;
      stopRealtime('Realtime disconnected');
      showError('Realtime WebSocket disconnected.');
    };
  } catch (error) {
    failRealtime(error, generation);
  }
}

function pcmBuffer(ctx, bytes, rate, channels) {
  const frameBytes = channels * 2;
  if (!bytes.length || bytes.length % frameBytes !== 0) return null;
  if (!(rate > 0) || channels < 1 || channels > 8) return null;
  const frames = bytes.length / frameBytes;
  const buffer = ctx.createBuffer(channels, frames, rate);
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  for (let c = 0; c < channels; c += 1) {
    const out = buffer.getChannelData(c);
    for (let i = 0, offset = c * 2; i < frames; i += 1, offset += frameBytes) {
      out[i] = view.getInt16(offset, true) / 32768;
    }
  }
  return buffer;
}

// ---------- artifacts (UnifiedStream.swift ArtifactCollector) ----------

function decodeBase64(text) {
  const binary = atob(text);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function dataURLFor(mime, bytes) {
  let binary = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }
  return `data:${mime};base64,${btoa(binary)}`;
}

async function sha256Hex(bytes) {
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
  return [...digest].map((b) => b.toString(16).padStart(2, '0')).join('');
}

async function ingestArtifact(chunk) {
  if (!chunk || typeof chunk !== 'object') throw new Error('Artifact is missing.');
  if (chunk.encoding !== 'base64') throw new Error('Artifact encoding must be base64.');
  if (!(chunk.total >= 1) || !(chunk.index >= 0) || chunk.index >= chunk.total) {
    throw new Error('Artifact chunk index is out of range.');
  }
  let slot = inflight.get(chunk.artifact_id);
  if (!slot) {
    slot = { mime: chunk.mime_type, total: chunk.total, parts: [] };
    inflight.set(chunk.artifact_id, slot);
  }
  if (slot.total !== chunk.total) throw new Error('Artifact total changed between chunks.');
  slot.parts[chunk.index] = decodeBase64(chunk.data);
  if (chunk.index + 1 < chunk.total) return;

  inflight.delete(chunk.artifact_id);
  const size = slot.parts.reduce((n, part) => n + part.length, 0);
  const bytes = new Uint8Array(size);
  let offset = 0;
  for (const part of slot.parts) { bytes.set(part, offset); offset += part.length; }
  if (chunk.bytes != null && chunk.bytes !== bytes.length) {
    throw new Error(`Artifact ${chunk.artifact_id} has ${bytes.length} bytes, not ${chunk.bytes}.`);
  }
  if (chunk.sha256 && crypto.subtle) {
    const digest = await sha256Hex(bytes);
    if (digest !== chunk.sha256.toLowerCase()) {
      throw new Error(`Artifact ${chunk.artifact_id} failed its sha256 check.`);
    }
  }
  deliver(chunk, bytes);
}

function recordVisualSettled(key) {
  if (!turn?.telemetry || !key) return;
  if (turn.telemetry.settledSlotIds.has(key)) return;
  turn.telemetry.settledSlotIds.add(key);
  turn.telemetry.visualSettledCount = turn.telemetry.settledSlotIds.size;
  if (turn.telemetry.firstVisualMs === null) {
    turn.telemetry.firstVisualMs = elapsedTelemetryMs(turn);
  }
  renderTurnTelemetry(turn);
}

function recordFirstAudio() {
  if (!turn?.telemetry || turn.telemetry.ttfaMs !== null) return;
  turn.telemetry.ttfaMs = elapsedTelemetryMs(turn);
  renderTurnTelemetry(turn);
}

function deliver(chunk, bytes) {
  const mime = chunk.mime_type;
  log('artifact', chunk.artifact_id, mime, bytes.length + ' bytes');
  if (mime === 'audio/pcm') {
    recordFirstAudio();
    player.push(bytes, chunk.sample_rate ?? 24000, chunk.channels ?? 1);
    return;
  }
  const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
  const kindHint = chunk.media_type === 'video' || mime === 'video/mp4' ? 'video' : 'image';
  if (chunk.slot_id && turn?.slots?.has(chunk.slot_id)) {
    const slot = turn.slots.get(chunk.slot_id);
    if (kindHint === 'image' && mime.startsWith('image/')) {
      slot.imageDataURL = dataURLFor(mime, bytes);
    }
    updateSlotContinuity(slot, chunk);
    recordSlotContinuityTelemetry(turn, chunk);
    setSlotMedia(slot, kindHint, url);
    recordVisualSettled(chunk.slot_id);
    scrollToEnd();
    return;
  }
  const wrapCard = (node, filename) => {
    const card = document.createElement('div');
    card.className = 'artifact-card';
    card.append(node);
    const dl = document.createElement('a');
    dl.className = 'dl';
    dl.href = url;
    dl.download = filename;
    dl.textContent = `Download ${filename} (${(bytes.length / 1024).toFixed(1)} KB)`;
    card.append(dl);
    turn.artifacts.append(card);
  };
  if (chunk.media_type === 'image') {
    const link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener';
    const img = document.createElement('img');
    img.src = url;
    img.alt = 'Generated image';
    link.append(img);
    wrapCard(link, 'image.png');
    recordVisualSettled(chunk.artifact_id || `image-${turn.telemetry?.settledSlotIds?.size ?? 0}`);
  } else if (mime === 'audio/wav') {
    recordFirstAudio();
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.src = url;
    wrapCard(audio, 'speech.wav');
  } else if (mime === 'video/mp4') {
    const video = document.createElement('video');
    video.controls = true;
    video.src = url;
    wrapCard(video, 'video.mp4');
    recordVisualSettled(chunk.artifact_id || `video-${turn.telemetry?.settledSlotIds?.size ?? 0}`);
  } else {
    const note = document.createElement('div');
    note.className = 'legs';
    note.textContent = `Unsupported artifact ${mime}`;
    turn.artifacts.append(note);
  }
  scrollToEnd();
}

// ---------- SSE ----------

async function* readLines(res) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let rest = '';
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      rest += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = rest.indexOf('\n')) >= 0) {
        let line = rest.slice(0, cut);
        rest = rest.slice(cut + 1);
        if (line.endsWith('\r')) line = line.slice(0, -1);
        yield line;
      }
      if (rest.length > 4 * 1024 * 1024) throw new Error('An SSE line exceeds 4 MiB.');
    }
    rest += decoder.decode();
    if (rest) yield rest.replace(/\r$/, '');
  } finally {
    reader.cancel().catch(() => {});
  }
}

function errorDetail(root) {
  if (typeof root.error === 'string') return root.error;
  if (root.error && typeof root.error === 'object') {
    return [root.error.type, root.error.code, root.error.message]
      .filter((v) => typeof v === 'string' && v).join(': ') || 'no error detail';
  }
  return typeof root.message === 'string' && root.message ? root.message : 'no error detail';
}

async function consume(payload, st) {
  if (payload === '[DONE]') { st.done = true; return; }
  let root;
  try { root = JSON.parse(payload); } catch { throw new Error('An SSE event is not JSON.'); }
  const rawTelemetry = extractNativeAllocatorTelemetry(root);
  if (rawTelemetry) recordNativeAllocatorTelemetry(turn, rawTelemetry);
  if (root.error != null) throw new Error(errorDetail(root));

  const unified = root.unified;
  if (unified != null) {
    if (st.terminal) throw new Error('A unified event follows the terminal event.');
    if (unified.seq !== st.seq) {
      throw new Error(`Unified seq ${unified.seq} arrived, expected ${st.seq}.`);
    }
    st.seq += 1;
    st.sawUnified = true;
    if (unified.session_id) st.sessionID = unified.session_id;
    log('event', unified.kind, unified.seq, unified.stage);
    switch (unified.kind) {
      case 'asr_final':
        if (unified.text) turn.asrEl.textContent = `ASR: ${unified.text}`;
        break;
      case 'visual_slot': onVisualSlot(unified); break;
      case 'artifact': await ingestArtifact(unified.artifact); break;
      case 'leg_error':
        if (unified.slot_id) {
          if (!turn.slots.has(unified.slot_id) && unified.anchor_explicit === true) {
            onVisualSlot(unified);
          }
          if (turn.slots.has(unified.slot_id)) {
            const failedSlot = turn.slots.get(unified.slot_id);
            updateSlotContinuity(failedSlot, unified);
            recordSlotContinuityTelemetry(turn, unified);
            showSlotError(failedSlot, unified.error);
          } else {
            turn.legs.textContent = `${unified.stage} output: ${unified.error || 'failed'}`;
          }
        } else {
          turn.legs.textContent = `${unified.stage} output: ${unified.error || 'failed'}`;
        }
        break;
      case 'complete':
        st.terminal = 1;
        if (Array.isArray(unified.legs)) {
          for (const leg of unified.legs) {
            if (!leg || typeof leg !== 'object' || typeof leg.slot_id !== 'string') continue;
            if (!turn.slots.has(leg.slot_id)) continue;
            const slot = turn.slots.get(leg.slot_id);
            updateSlotContinuity(slot, leg);
            recordSlotContinuityTelemetry(turn, leg);
            if (leg.state === 'failed' && typeof leg.error === 'string' && leg.error
                && !slot.url && !slot.hasError) {
              showSlotError(slot, leg.error);
            }
          }
        }
        recordTurnTotal(turn);
        break;
      case 'error': st.terminal = 1; throw new Error(unified.error || 'The request failed.');
      case 'cancelled': {
        st.terminal = 1;
        recordTurnTotal(turn);
        const err = new Error('The server cancelled the request.');
        err.cancelled = true;
        throw err;
      }
      default: break;
    }
  }

  const choice = Array.isArray(root.choices) ? root.choices[0] : null;
  if (choice?.delta && typeof choice.delta.content === 'string' && choice.delta.content) {
    if (turn?.telemetry && turn.telemetry.ttftMs === null) {
      turn.telemetry.ttftMs = elapsedTelemetryMs(turn);
      renderTurnTelemetry(turn);
    }
    st.text += choice.delta.content;
    appendText(choice.delta.content);
  }
  if (choice?.finish_reason) st.finish = choice.finish_reason;
}

  }
  if (ui.videoSteps.value.trim() !== '') {
    const vsVal = Number.parseInt(ui.videoSteps.value.trim(), 10);
    if (Number.isInteger(vsVal) && vsVal > 0) config.steps = vsVal;
  }
  if (ui.videoGuidance.value.trim() !== '') {
    const cfgVal = Number(ui.videoGuidance.value);
    if (Number.isFinite(cfgVal) && cfgVal >= 0) config.guidance_scale = cfgVal;
  }
  if (ui.fastVideo.checked) config.teacache_thresh = 0.05;
  return config;
}

// VIDEO_FRAME_SELECTION_BEGIN
function parseVideoFrameSelection(policy, motionText, sceneText) {
  if (policy === 'uniform') return undefined;
  if (policy !== 'temporal') throw new Error('Input frame policy must be Uniform or Temporal.');
  const threshold = (text, name) => {
    const normalized = String(text).trim();
    const value = Number(normalized);
    if (!normalized || !Number.isFinite(value) || value < 0 || value > 1) {
      throw new Error(`${name} must be a finite number in [0,1].`);
    }
    return value;
  };
  return {
    policy: 'temporal',
    motion_threshold: threshold(motionText, 'Motion threshold'),
    scene_threshold: threshold(sceneText, 'Scene threshold'),
  };
}

function videoURLPart(dataURL, frameSelection) {
  const video = { url: dataURL };
  if (frameSelection) {
    video.frame_selection = {
      policy: 'temporal',
      motion_threshold: frameSelection.motion_threshold,
      scene_threshold: frameSelection.scene_threshold,
    };
  }
  return { type: 'video_url', video_url: video };
}
// VIDEO_FRAME_SELECTION_END

// NARRATIVE_CONTINUITY_BEGIN
const MAX_STYLE_ANCHOR_BYTES = 256;
const VALID_CONTINUITY_MODES = new Set(['off', 'prompt_anchor', 'i2v_chain']);

function validateStyleAnchor(raw) {
  const trimmed = String(raw ?? '').trim();
  if (!trimmed) return '';
  const byteLength = new TextEncoder().encode(trimmed).length;
  if (byteLength > MAX_STYLE_ANCHOR_BYTES) {
    throw new Error(`Style anchor must be at most ${MAX_STYLE_ANCHOR_BYTES} UTF-8 bytes (currently ${byteLength} bytes).`);
  }
  return trimmed;
}

function buildNarrativeConfig({
  visual_mode = 'auto',
  max_slots = 3,
  allow_text_only = true,
  continuity_mode = 'off',
  style_anchor = '',
} = {}) {
  const mode = String(continuity_mode || 'off');
  if (!VALID_CONTINUITY_MODES.has(mode)) {
    throw new Error("Continuity mode must be 'off', 'prompt_anchor', or 'i2v_chain'.");
  }
  const anchor = validateStyleAnchor(style_anchor);
  const slotsVal = Number.parseInt(String(max_slots ?? '').trim(), 10);
  const narrative = {
    enabled: true,
    visual_mode: visual_mode || 'auto',
    max_slots: Number.isInteger(slotsVal) ? Math.min(6, Math.max(1, slotsVal)) : 3,
    allow_text_only: Boolean(allow_text_only),
  };
  if (mode !== 'off') {
    narrative.continuity_mode = mode;
  }
  if (anchor) {
    narrative.style_anchor = anchor;
  }
  return narrative;
}

function normalizeAnchorSha256(raw) {
  if (typeof raw !== 'string') return '';
  const trimmed = raw.trim().toLowerCase();
  return /^[0-9a-f]{64}$/.test(trimmed) ? trimmed : '';
}

function visualSlotContinuityBadge(unified) {
  const mode = typeof unified?.continuity_mode === 'string' ? unified.continuity_mode : '';
  const anchorIdx = unified?.anchor_slot_index;
  const explicit = unified?.anchor_explicit === true;
  const sha256 = normalizeAnchorSha256(unified?.anchor_sha256);
  if (Number.isInteger(anchorIdx) && anchorIdx >= 0
      && (mode === 'i2v_chain' || mode === '' || explicit)) {
    const slotLabel = `Slot ${anchorIdx + 1}`;
    if (explicit) {
      const shortSha = sha256 ? ` · ${sha256.slice(0, 8)}` : '';
      return {
        text: `Explicit I2V ← ${slotLabel}${shortSha}`,
        kind: 'i2v-chain',
        explicit: true,
        sha256: sha256 || null,
        title: sha256
          ? `Explicit anchor slot-${anchorIdx} · SHA-256: ${sha256}`
          : `Explicit anchor slot-${anchorIdx}`,
      };
    }
    return {
      text: `I2V ← ${slotLabel}`,
      kind: 'i2v-chain',
      explicit: false,
      sha256: sha256 || null,
      title: sha256 ? `Anchor slot-${anchorIdx} · SHA-256: ${sha256}` : '',
    };
  }
  if (mode === 'prompt_anchor') {
    return { text: 'Anchor', kind: 'prompt-anchor', explicit: false, sha256: null, title: '' };
  }
  return null;
}

function updateSlotContinuity(slot, incoming) {
  if (!slot || !incoming || typeof incoming !== 'object') return;
  const prev = slot.continuityMeta || {};
  const merged = {
    continuity_mode: typeof incoming.continuity_mode === 'string' && incoming.continuity_mode
      ? incoming.continuity_mode : (prev.continuity_mode || ''),
    anchor_slot_index: Number.isInteger(incoming.anchor_slot_index) && incoming.anchor_slot_index >= 0
      ? incoming.anchor_slot_index : prev.anchor_slot_index,
    anchor_explicit: incoming.anchor_explicit === true || prev.anchor_explicit === true,
    anchor_sha256: normalizeAnchorSha256(incoming.anchor_sha256) || prev.anchor_sha256 || '',
  };
  slot.continuityMeta = merged;
  const badge = visualSlotContinuityBadge(merged);
  if (!badge) return;
  if (!slot.continuityEl) {
    slot.continuityEl = document.createElement('span');
    if (slot.head && typeof slot.head.insertBefore === 'function' && slot.caption) {
      slot.head.insertBefore(slot.continuityEl, slot.caption);
    } else if (slot.head) {
      slot.head.append(slot.continuityEl);
    }
  }
  slot.continuityEl.className = 'badge continuity ' + badge.kind
    + (badge.explicit ? ' explicit' : '');
  slot.continuityEl.textContent = badge.text;
  slot.continuityEl.dataset.continuity = badge.kind;
  if (badge.explicit) slot.continuityEl.dataset.anchorExplicit = 'true';
  if (badge.sha256) slot.continuityEl.dataset.anchorSha256 = badge.sha256;
  if (badge.title) slot.continuityEl.title = badge.title;
}
// NARRATIVE_CONTINUITY_END

async function send() {
  if (running) return;
  const text = ui.prompt.value.trim();
  if (!text && !attachedImage && !attachedVideo && !attachedAudio) {
    setStatus('Input required', false); ui.prompt.focus(); return;
  }

  let url;
  let model;
  try {
    url = chatURL(ui.endpoint.value);
    model = ui.model.value.trim();
    if (!model) throw new Error('Model is required.');
  } catch (err) { showError(err.message); return; }

  let frameSelection;
  try {
    frameSelection = attachedVideo
      ? parseVideoFrameSelection(ui.videoFramePolicy.value,
                                 ui.videoMotionThreshold.value,
                                 ui.videoSceneThreshold.value)
      : undefined;
  } catch (err) {
    setStatus('Configuration error', false);
    showError(err.message);
    return;
  }

  const narrativeOn = ui.narrative.checked;
  const visualMode = ui.visualMode.value || 'auto';
  let narrativeConfig;
  try {
    narrativeConfig = narrativeOn
      ? buildNarrativeConfig({
          visual_mode: visualMode,
          max_slots: ui.maxSlots.value,
          allow_text_only: ui.allowTextOnly.checked,
          continuity_mode: ui.narrativeContinuity.value,
          style_anchor: ui.styleAnchor.value,
        })
      : undefined;
  } catch (err) {
    setStatus('Configuration error', false);
    showError(err.message);
    return;
  }

  saveSettings();
  if (!sessionID) sessionID = newSessionID();

  let userContent;
  if (attachedImage || attachedVideo || attachedAudio) {
    const parts = [];
    if (text) parts.push({ type: 'text', text });
    if (attachedImage) parts.push({ type: 'image_url', image_url: { url: attachedImage.dataURL } });
    if (attachedVideo) parts.push(videoURLPart(attachedVideo.dataURL, frameSelection));
    if (attachedAudio) parts.push({ type: 'input_audio', input_audio: { data: attachedAudio.wavBase64, format: 'wav' } });
    userContent = parts;
  } else {
    userContent = text;
  }

  const maxTokVal = Number.parseInt(ui.maxTokens.value.trim(), 10);
  const tempVal = Number(ui.temperature.value);
  const body = {
    model,
    messages: [{ role: 'user', content: userContent }],
    max_tokens: Number.isInteger(maxTokVal) && maxTokVal > 0 ? maxTokVal : 256,
    temperature: Number.isFinite(tempVal) && tempVal >= 0 ? tempVal : 0,
    stream: true,
    session_id: sessionID,
  };
  if (history.length > 0) body.session_history = true;
  if (ui.topP.value.trim() !== '') {
    const topPVal = Number(ui.topP.value);
    if (Number.isFinite(topPVal) && topPVal > 0 && topPVal <= 1) body.top_p = topPVal;
  }
  if (ui.seed.value.trim() !== '') {
    const seedVal = Number.parseInt(ui.seed.value.trim(), 10);
    if (Number.isInteger(seedVal)) body.seed = seedVal;
  }

  const modalities = new Set(['text']);
  if (narrativeOn) {
    if (visualMode !== 'video') {
      modalities.add('image');
      body.image = await imageConfig();
    }
    if (visualMode !== 'image') {
      modalities.add('video');
      body.video = videoConfig();
    }
    body.narrative = narrativeConfig;
  } else {
    if (ui.image.checked) {
      modalities.add('image');
      body.image = await imageConfig();
    }
    if (ui.video.checked) {
      modalities.add('video');
      body.video = videoConfig();
    }
  }
  const wantAudio = voiceOn || ui.audio.checked;
  if (wantAudio) {
    modalities.add('audio');
    body.audio = { voice: ui.voice.value.trim() || 'vivian', format: 'wav' };
    const refAudioUrl = await readFileAsDataURL(ui.refAudio);
    if (refAudioUrl) body.audio.ref_audio = refAudioUrl;
    // Global Voice always streams PCM, even with image/video/narrative.
    // Legacy manual Audio keeps the single-WAV rule on mixed turns.
    if (voiceOn || (!ui.image.checked && !ui.video.checked && !narrativeOn)) {
      body.audio.stream = true;
    }
  }
  if (modalities.size > 1) body.modalities = [...modalities];
  applyNativeAllocatorTelemetryOption(body, ui.nativeAllocatorTelemetry.checked);

  const userLabel = [
    text,
    attachedImage ? `[Image: ${attachedImage.name}]` : '',
    attachedVideo ? `[Video: ${attachedVideo.name}]` : '',
    attachedAudio ? `[Audio: ${attachedAudio.name}]` : '',
  ].filter(Boolean).join(' ');
  const sentImage = attachedImage;
  const sentVideo = attachedVideo;
  attachedImage = null; ui.askImage.value = '';
  attachedVideo = null; ui.askVideo.value = '';
  attachedAudio = null; ui.askAudio.value = '';
  renderAttachments();

  ui.prompt.value = '';
  clearError();
  stopped = false;
  inflight = new Map();
  setBusy(true);
  setStatus('Connecting…');
  const userTurn = addTurn('user', userLabel);
  if (sentImage) {
    const thumb = document.createElement('img');
    thumb.src = sentImage.dataURL;
    thumb.alt = sentImage.name;
    userTurn.artifacts.append(thumb);
  }
  if (sentVideo) {
    const preview = document.createElement('video');
    preview.src = sentVideo.dataURL;
    preview.controls = true;
    preview.muted = true;
    preview.playsInline = true;
    preview.style.maxWidth = '260px';
    preview.style.maxHeight = '180px';
    userTurn.artifacts.append(preview);
  }
  turn = addTurn('assistant', '');
  turn.telemetry = {
    startedAt: performance.now(),
    ttftMs: null,
    ttfaMs: null,
    visualSettledCount: 0,
    settledSlotIds: new Set(),
    firstVisualMs: null,
    hasI2VChain: false,
    hasExplicitAnchor: false,
    totalMs: null,
    nativeAllocator: null,
  };
  if (body.audio?.stream) player.begin(ui.voiceWave);

  controller = new AbortController();
  const st = { seq: 0, terminal: 0, sawUnified: false, done: false, text: '', finish: '', sessionID };
  log('request', url.href, JSON.stringify({ ...body, messages: '[redacted media]' }));

  try {
    let res = await fetch(url, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json', Accept: 'text/event-stream' }),
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    if (res.status === 400 && body.session_history) {
      delete body.session_history;
      res = await fetch(url, {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Accept: 'text/event-stream' }),
        body: JSON.stringify(body),
        signal: controller.signal,
      });
    }
    if (!res.ok) {
      const detail = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}: ${limit(detail)}`);
    }
    const type = (res.headers.get('content-type') || '').split(';')[0].trim().toLowerCase();
    if (type !== 'text/event-stream') {
      throw new Error(`Expected text/event-stream, got ${type || 'no content type'}.`);
    }

    // One data line carries one event (docs/mixed-output-contract.md), the same
    // flush rule ChatClient.SSEParser uses.
    for await (const line of readLines(res)) {
      if (!line.startsWith('data:')) continue;
      let payload = line.slice(5);
      if (payload.startsWith(' ')) payload = payload.slice(1);
      await consume(payload, st);
      if (st.done) break;
    }

    if (!st.done) throw new Error('The stream ended before [DONE].');
    if (st.sawUnified && st.terminal !== 1) {
      throw new Error('The unified stream ended without a terminal event.');
    }
    if (inflight.size) throw new Error('An artifact stream ended before its final chunk.');

    if (st.sessionID) {
      sessionID = st.sessionID;
      ui.session.hidden = false;
      ui.session.textContent =
        'session ' + sessionID.replace(/^ummweb-/, '').slice(0, 8);
      ui.session.title = sessionID;
    }
    history.push({ role: 'user', content: userLabel });
    history.push({ role: 'assistant', content: st.text });
    recordTurnTotal(turn);
    turn.tailText?.classList.remove('caret');
    player.end();
    setStatus(st.finish ? `Completed · ${st.finish}` : 'Completed');
    setBusy(false);
  } catch (err) {
    player.stop();
    const aborted = stopped || err.name === 'AbortError' || err.cancelled;
    turn.tailText?.classList.remove('caret');
    setBusy(false);
    if (aborted) {
      setStatus('Stopped');
      if (!turn.text && !turn.flow.querySelector('.slot') && !turn.artifacts.childElementCount) {
        turn.el.remove();
        syncEmptyState();
      } else {
        recordTurnTotal(turn);
      }
    } else {
      setStatus('Error');
      let msg = err.message || String(err);
      if (/failed to fetch/i.test(msg)) {
        msg = `Failed to fetch ${url.href} — check that Base URL matches this page's host/port (${location.origin}/v1) and the server is reachable.`;
      }
      showError(msg);
    }
    log('failed', err.message);
  } finally {
    controller = null;
    turn = null;
  }
}

function limit(text) {
  const trimmed = String(text || '').trim();
  return trimmed.length > 300 ? trimmed.slice(0, 300) + '…' : (trimmed || 'no error detail');
}

ui.send.addEventListener('click', send);
ui.stop.addEventListener('click', () => {
  if (!running) return;
  stopped = true;
  player.stop();
  setStatus('Stopping…');
  controller?.abort();
});
ui.prompt.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
    event.preventDefault();
    send();
  }
});
function applyShowcasePreset(presetId) {
  if (running) return;
  clearError();
  applyShowcasePresetToControls(presetId, ui, {
    setAudioEnabled(enabled) {
      voiceOn = Boolean(enabled);
      if (!voiceOn) ui.audio.checked = false;
      localStorage.setItem(GLOBAL_VOICE_KEY, voiceOn ? '1' : '0');
      applyVoice();
    },
    syncNarrativeControls,
    syncVideoFrameControls,
    saveSettings,
    hasAttachedVideo: () => Boolean(attachedVideo),
    setStatus,
  });
}

ui.showcasePresets?.addEventListener('click', (event) => {
  const card = event.target.closest('[data-preset]');
  if (!card) return;
  applyShowcasePreset(card.dataset.preset);
});
syncEmptyState();

ui.newChat.addEventListener('click', () => {
  if (running) return;
  stopRealtime();
  player.stop();
  history.length = 0;
  ui.transcript.replaceChildren(ui.emptyState);
  syncEmptyState();
  sessionID = '';
  ui.session.hidden = true;
  clearError();
  setStatus('Ready', false);
});
</script>
</body>
</html>
